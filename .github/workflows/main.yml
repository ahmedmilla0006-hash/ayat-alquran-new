name: Build Aya Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Android project
        run: |
          mkdir -p android-app
          cd android-app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web files
        run: |
          mkdir -p android-app/www
          rsync -av --exclude='.git' --exclude='.github' --exclude='android-app' ./ android-app/www/

      - name: Initialize Capacitor
        working-directory: android-app
        run: npx cap init "آية" "com.aya.alquran" --web-dir www

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Configure Android app name
        working-directory: android-app
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/src/main/res/values/strings.xml")
          if p.exists():
              text = p.read_text(encoding="utf-8")
              text = text.replace("app_name\">App", "app_name\">آية")
              p.write_text(text, encoding="utf-8")
          print("Android app name configured.")
          PY

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Install Aya app icon
        run: |
          python3 << 'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import shutil

          icon_path = Path("icon.png")
          if not icon_path.exists():
              raise SystemExit("ERROR: icon.png was not found.")

          original = Image.open(icon_path).convert("RGBA")

          base = Path("android-app/android/app/src/main/res")

          # === Legacy icons (دائرية كاملة) ===
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              target_dir = base / folder
              target_dir.mkdir(parents=True, exist_ok=True)

              # نعيد تحجيم الأيقونة مع الحفاظ على الدائرة
              resized = original.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(target_dir / "ic_launcher.png", "PNG")
              resized.save(target_dir / "ic_launcher_round.png", "PNG")

              for f in target_dir.glob("ic_launcher*"):
                  if f.name not in ["ic_launcher.png", "ic_launcher_round.png"]:
                      f.unlink(missing_ok=True)

          # === Adaptive Icon محسّن ===
          # نستخدم حجم أكبر ونضع الأيقونة في المنتصف مع مساحة آمنة
          fg_size = 432
          canvas = Image.new("RGBA", (fg_size, fg_size), (0, 0, 0, 0))

          # نحسب حجم الأيقونة داخل الـ safe zone (حوالي 66% من المساحة)
          icon_size = int(fg_size * 0.72)
          icon_resized = original.resize((icon_size, icon_size), Image.Resampling.LANCZOS)

          # نوسطها
          offset = (fg_size - icon_size) // 2
          canvas.paste(icon_resized, (offset, offset), icon_resized)

          xxx = base / "mipmap-xxxhdpi"
          xxx.mkdir(parents=True, exist_ok=True)
          canvas.save(xxx / "ic_launcher_foreground.png", "PNG")

          # خلفية بنفس لون الأيقونة
          bg = Image.new("RGBA", (fg_size, fg_size), (13, 27, 42, 255))
          bg.save(xxx / "ic_launcher_background.png", "PNG")

          # Adaptive XML
          anydpi = base / "mipmap-anydpi-v26"
          if anydpi.exists():
              shutil.rmtree(anydpi)
          anydpi.mkdir(parents=True, exist_ok=True)

          xml = '<?xml version="1.0" encoding="utf-8"?>\n'
          xml += '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
          xml += '    <background android:drawable="@mipmap/ic_launcher_background"/>\n'
          xml += '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
          xml += '</adaptive-icon>'

          (anydpi / "ic_launcher.xml").write_text(xml, encoding="utf-8")
          (anydpi / "ic_launcher_round.xml").write_text(xml, encoding="utf-8")

          print("=== Icon files after install ===")
          for p in sorted(base.rglob("ic_launcher*")):
              print(p)
          print("Aya icon improved successfully.")
          PY

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-android-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
