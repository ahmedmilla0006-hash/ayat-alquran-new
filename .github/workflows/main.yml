- name: Install Aya app icon
        run: |
          python3 << 'PY'
          from pathlib import Path
          from PIL import Image

          icon_path = Path("icon.png")
          if not icon_path.exists():
              raise SystemExit("ERROR: icon.png was not found in the project root.")

          image = Image.open(icon_path).convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          base = Path("android-app/android/app/src/main/res")

          for folder, size in sizes.items():
              target_dir = base / folder
              target_dir.mkdir(parents=True, exist_ok=True)
              resized = image.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(target_dir / "ic_launcher.png", "PNG")
              resized.save(target_dir / "ic_launcher_round.png", "PNG")

          # Adaptive Icon
          fg_size = 432
          fg = image.resize((fg_size, fg_size), Image.Resampling.LANCZOS)

          xxx = base / "mipmap-xxxhdpi"
          xxx.mkdir(parents=True, exist_ok=True)
          fg.save(xxx / "ic_launcher_foreground.png", "PNG")

          bg = Image.new("RGBA", (fg_size, fg_size), (13, 27, 42, 255))
          bg.save(xxx / "ic_launcher_background.png", "PNG")

          anydpi = base / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)

          xml = '<?xml version="1.0" encoding="utf-8"?>\n'
          xml += '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
          xml += '    <background android:drawable="@mipmap/ic_launcher_background"/>\n'
          xml += '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
          xml += '</adaptive-icon>'

          (anydpi / "ic_launcher.xml").write_text(xml, encoding="utf-8")
          (anydpi / "ic_launcher_round.xml").write_text(xml, encoding="utf-8")

          print("Aya icon (Legacy + Adaptive) installed successfully.")
          PY
