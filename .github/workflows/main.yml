name: Build Aya Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Android project
        run: |
          mkdir -p android-app
          cd android-app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web files
        run: |
          mkdir -p android-app/www
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android-app' \
            ./ android-app/www/

      - name: Initialize Capacitor
        working-directory: android-app
        run: npx cap init "آية" "com.aya.alquran" --web-dir www

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Configure Android app name
        working-directory: android-app
        run: |
          python3 << 'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/values/strings.xml")

          if p.exists():
              text = p.read_text(encoding="utf-8")

              text = text.replace(
                  "app_name\">App",
                  "app_name\">آية"
              )

              p.write_text(text, encoding="utf-8")

          print("Android app name configured.")
          PY

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Install Aya app icon
        run: |
          python3 << 'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          icon_path = Path("icon.png")

          if not icon_path.exists():
              raise SystemExit("ERROR: icon.png was not found.")

          original = Image.open(icon_path).convert("RGBA")

          base = Path(
              "android-app/android/app/src/main/res"
          )

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              target_dir = base / folder
              target_dir.mkdir(parents=True, exist_ok=True)

              resized = original.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              resized.save(
                  target_dir / "ic_launcher.png",
                  "PNG"
              )

              resized.save(
                  target_dir / "ic_launcher_round.png",
                  "PNG"
              )

              for f in target_dir.glob("ic_launcher*"):
                  if f.name not in [
                      "ic_launcher.png",
                      "ic_launcher_round.png"
                  ]:
                      f.unlink(missing_ok=True)

          fg_size = 432

          canvas = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (0, 0, 0, 0)
          )

          icon_size = int(fg_size * 0.72)

          icon_resized = original.resize(
              (icon_size, icon_size),
              Image.Resampling.LANCZOS
          )

          offset = (
              (fg_size - icon_size) // 2
          )

          canvas.paste(
              icon_resized,
              (offset, offset),
              icon_resized
          )

          xxx = base / "mipmap-xxxhdpi"

          xxx.mkdir(
              parents=True,
              exist_ok=True
          )

          canvas.save(
              xxx / "ic_launcher_foreground.png",
              "PNG"
          )

          bg = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (13, 27, 42, 255)
          )

          bg.save(
              xxx / "ic_launcher_background.png",
              "PNG"
          )

          anydpi = base / "mipmap-anydpi-v26"

          if anydpi.exists():
              shutil.rmtree(anydpi)

          anydpi.mkdir(
              parents=True,
              exist_ok=True
          )

          xml = (
              '<?xml version="1.0" encoding="utf-8"?>'
              '<adaptive-icon '
              'xmlns:android='
              '"http://schemas.android.com/apk/res/android">'
              '<background '
              'android:drawable='
              '"@mipmap/ic_launcher_background"/>'
              '<foreground '
              'android:drawable='
              '"@mipmap/ic_launcher_foreground"/>'
              '</adaptive-icon>'
          )

          (
              anydpi / "ic_launcher.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          (
              anydpi / "ic_launcher_round.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          print("Aya icon improved successfully.")
          PY

      - name: Set versionCode from run number
        id: ver
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"

          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # KEYSTORE
      # ============================================================

      - name: Decode and verify keystore
        env:
          K1: ${{ secrets.KS1 }}
          K2: ${{ secrets.KS2 }}
          K3: ${{ secrets.KS3 }}
          K4: ${{ secrets.KS4 }}
          K5: ${{ secrets.KS5 }}
          K6: ${{ secrets.KS6 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 << 'PY'
          import os, re, base64, pathlib, subprocess, sys

          parts = []
          for i in range(1, 7):
              v = os.environ.get(f"K{i}") or ""
              print(f"KS{i} length = {len(v)}")
              if not v:
                  print(f"::error::السر KS{i} ناقص")
                  sys.exit(1)
              parts.append(v)

          b64 = "".join(parts)
          # إزالة أي محارف غير Base64 (مسافات، أسطر، إلخ)
          b64 = re.sub(r"[^A-Za-z0-9+/=]", "", b64)
          # إكمال الحشو إن نقص
          pad = (-len(b64)) % 4
          if pad:
              b64 += "=" * pad

          print(f"Total base64 length = {len(b64)}")

          try:
              raw = base64.b64decode(b64, validate=False)
          except Exception as e:
              print(f"::error::فشل فك Base64: {e}")
              sys.exit(1)

          out = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "aya-release.jks"
          out.write_bytes(raw)
          print(f"Keystore bytes = {len(raw)}")
          if len(raw) < 100:
              print("::error::ملف keystore صغير جداً — الأجزاء ناقصة")
              sys.exit(1)

          pw = os.environ.get("KEYSTORE_PASSWORD") or ""
          alias = os.environ.get("KEY_ALIAS") or ""
          r = subprocess.run(
              ["keytool", "-list", "-keystore", str(out), "-storepass", pw, "-alias", alias],
              capture_output=True,
              text=True,
          )
          print(r.stdout)
          if r.returncode != 0:
              print(r.stderr)
              print("::error::keytool فشل — تحقق من KEYSTORE_PASSWORD و KEY_ALIAS")
              sys.exit(1)
          print("Keystore verified successfully.")
          PY

      # ============================================================
      # VERSION
      # ============================================================

      - name: Set version in Gradle
        env:
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os
          import re

          vc = os.environ["VERSION_CODE"]
          vn = os.environ["VERSION_NAME"]

          gradle = Path(
              "android-app/android/app/build.gradle"
          )

          if not gradle.exists():
              gradle = Path(
                  "android-app/android/app/build.gradle.kts"
              )

          if not gradle.exists():
              raise SystemExit(
                  "ERROR: Gradle file not found."
              )

          text = gradle.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r"versionCode\s+\d+",
              "versionCode " + vc,
              text
          )

          text = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName "' + vn + '"',
              text
          )

          gradle.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "version set",
              vc,
              vn
          )
          PY

      # ============================================================
      # NOTIFICATIONS — إشعار التلاوة (قائمة التشغيل)
      # ============================================================

      - name: Configure Android notifications and in-app APK update
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re, base64

          android_root = Path("android-app/android/app/src/main")
          manifest = android_root / "AndroidManifest.xml"
          text = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK",
              "android.permission.REQUEST_INSTALL_PACKAGES",
              "android.permission.RECORD_AUDIO",
          ]
          for permission in permissions:
              if permission not in text:
                  text = re.sub(
                      r"(<manifest[^>]*>)",
                      r'\1\n    <uses-permission android:name="%s" />' % permission,
                      text,
                      count=1,
                  )

          if "android:usesCleartextTraffic" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )

          if "androidx.core.content.FileProvider" not in text:
              provider_xml = """
                        <provider
                            android:name="androidx.core.content.FileProvider"
                            android:authorities="${applicationId}.fileprovider"
                            android:exported="false"
                            android:grantUriPermissions="true">
                            <meta-data
                                android:name="android.support.FILE_PROVIDER_PATHS"
                                android:resource="@xml/file_paths" />
                        </provider>
                    """
              text = re.sub(r"(</application>)", provider_xml + r"\1", text, count=1)

          manifest.write_text(text, encoding="utf-8")

          xml_dir = android_root / "res/xml"
          xml_dir.mkdir(parents=True, exist_ok=True)
          (xml_dir / "file_paths.xml").write_text(
              """<?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="apk_cache" path="." />
              <external-cache-path name="apk_ext_cache" path="." />
              <files-path name="apk_files" path="." />
          </paths>
          """,
              encoding="utf-8",
          )

          java_dir = android_root / "java/com/aya/alquran"
          java_dir.mkdir(parents=True, exist_ok=True)
          activity = java_dir / "MainActivity.java"

          activity_b64 = ""
          activity.write_bytes(base64.b64decode(activity_b64))

          # ============================================================
          # RESTORE EXISTING MEDIA SERVICE
          # MainActivity already references AyaMediaService; keep the
          # existing media notification/player functionality intact.
          # ============================================================

          service_b64 = ""
          service_text = r"""package com.aya.alquran;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          
                    import androidx.core.app.NotificationCompat;
          import androidx.media.app.NotificationCompat.MediaStyle;
          import androidx.media.session.MediaSessionCompat;
          import androidx.media.session.PlaybackStateCompat;
          
          public class AyaMediaService extends Service {
              public static final String ACTION_SYNC = "com.aya.alquran.ACTION_SYNC";
              public static final String EXTRA_CMD = "extra_cmd";
              public static final String EXTRA_TITLE = "extra_title";
              public static final String EXTRA_ARTIST = "extra_artist";
              public static final String EXTRA_PLAYING = "extra_playing";
              public static final String CMD_PLAY = "PLAY";
              public static final String CMD_PAUSE = "PAUSE";
              public static final String CMD_PREV = "PREV";
              public static final String CMD_NEXT = "NEXT";
              public static final String CMD_STOP = "STOP";
              private static final String CHANNEL_ID = "aya_media";
              private static final int NOTIFICATION_ID = 7701;
              private String title = "القرآن الكريم";
              private String artist = "قارئ";
              private boolean playing = false;
              private MediaSessionCompat mediaSession;
          
              @Override public void onCreate() {
                  super.onCreate();
                  createChannel();
                  mediaSession = new MediaSessionCompat(this, "AyaMediaService");
                  mediaSession.setCallback(new MediaSessionCompat.Callback() {
                      @Override public void onPlay() { sendCommand(CMD_PLAY); }
                      @Override public void onPause() { sendCommand(CMD_PAUSE); }
                      @Override public void onSkipToNext() { sendCommand(CMD_NEXT); }
                      @Override public void onSkipToPrevious() { sendCommand(CMD_PREV); }
                      @Override public void onStop() { sendCommand(CMD_STOP); }
                  });
                  mediaSession.setActive(true);
              }
          
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null) {
                      String action = intent.getAction();
                      if (ACTION_SYNC.equals(action)) {
                          if (intent.hasExtra(EXTRA_TITLE)) title = intent.getStringExtra(EXTRA_TITLE);
                          if (intent.hasExtra(EXTRA_ARTIST)) artist = intent.getStringExtra(EXTRA_ARTIST);
                          if (intent.hasExtra(EXTRA_PLAYING)) playing = intent.getBooleanExtra(EXTRA_PLAYING, false);
                      } else {
                          String cmd = intent.getStringExtra(EXTRA_CMD);
                          if (cmd == null) cmd = action;
                          if (cmd != null) sendCommand(cmd);
                      }
                  }
                  updateNotification();
                  return START_STICKY;
              }
          
              private void sendCommand(String cmd) {
                  MainActivity activity = MainActivity.getInstance();
                  if (activity != null) {
                      activity.applyMediaCommand(cmd);
                  } else {
                      Intent i = new Intent(this, MainActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      i.putExtra(EXTRA_CMD, cmd);
                      startActivity(i);
                  }
              }
          
              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(new NotificationChannel(
                              CHANNEL_ID, "تشغيل القرآن", NotificationManager.IMPORTANCE_LOW));
                  }
              }
          
              private PendingIntent actionIntent(String command, int requestCode) {
                  Intent i = new Intent(this, AyaMediaService.class);
                  i.putExtra(EXTRA_CMD, command);
                  return PendingIntent.getService(this, requestCode, i,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }
          
              private Notification buildNotification() {
                  Intent open = new Intent(this, MainActivity.class);
                  open.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent content = PendingIntent.getActivity(this, 0, open,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  NotificationCompat.Builder b = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentTitle(title == null || title.isEmpty() ? "القرآن الكريم" : title)
                          .setContentText(artist == null ? "قارئ" : artist)
                          .setContentIntent(content)
                          .setOnlyAlertOnce(true)
                          .setOngoing(playing)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .addAction(android.R.drawable.ic_media_previous, "السابق", actionIntent(CMD_PREV, 1));
                  if (playing) {
                      b.addAction(android.R.drawable.ic_media_pause, "إيقاف مؤقت", actionIntent(CMD_PAUSE, 2));
                  } else {
                      b.addAction(android.R.drawable.ic_media_play, "تشغيل", actionIntent(CMD_PLAY, 2));
                  }
                  b.addAction(android.R.drawable.ic_media_next, "التالي", actionIntent(CMD_NEXT, 3));
                  if (mediaSession != null) {
                      long actions = PlaybackStateCompat.ACTION_PLAY
                              | PlaybackStateCompat.ACTION_PAUSE
                              | PlaybackStateCompat.ACTION_PLAY_PAUSE
                              | PlaybackStateCompat.ACTION_SKIP_TO_NEXT
                              | PlaybackStateCompat.ACTION_SKIP_TO_PREVIOUS
                              | PlaybackStateCompat.ACTION_STOP;
                      mediaSession.setPlaybackState(new PlaybackStateCompat.Builder()
                              .setActions(actions)
                              .setState(playing ? PlaybackStateCompat.STATE_PLAYING : PlaybackStateCompat.STATE_PAUSED, 0, 1f)
                              .build());
                      b.setStyle(new MediaStyle().setMediaSession(mediaSession.getSessionToken()));
                  }
                  return b.build();
              }
          
              private void updateNotification() {
                  startForeground(NOTIFICATION_ID, buildNotification());
              }
          
              @Override public void onDestroy() {
                  if (mediaSession != null) {
                      mediaSession.setActive(false);
                      mediaSession.release();
                      mediaSession = null;
                  }
                  super.onDestroy();
              }
          
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          """
          service_file = java_dir / "AyaMediaService.java"
          service_file.write_text(service_text, encoding="utf-8")
          if not service_file.exists():
              raise SystemExit("ERROR: AyaMediaService.java was not created.")
          service_text_check = service_file.read_text(encoding="utf-8")
          if "public class AyaMediaService" not in service_text_check:
              raise SystemExit("ERROR: AyaMediaService.java is invalid.")

          mtxt = manifest.read_text(encoding="utf-8")
          if 'android:name=".AyaMediaService"' not in mtxt:
              svc = (
                  '    <service\n'
                  '        android:name=".AyaMediaService"\n'
                  '        android:exported="false"\n'
                  '        android:foregroundServiceType="mediaPlayback" />\n'
              )
              mtxt = re.sub(r"(</application>)", svc + r"\1", mtxt, count=1)
              manifest.write_text(mtxt, encoding="utf-8")
          print("AyaMediaService.java verified and registered.")

          # ============================================================
          # MICROPHONE — Android RECORD_AUDIO + Capacitor WebView capture
          # ============================================================
          activity_text = activity.read_text(encoding="utf-8")

          if "import android.webkit.WebChromeClient;" not in activity_text:
              activity_text = activity_text.replace(
                  "import android.webkit.WebView;",
                  "import android.webkit.WebView;\nimport android.webkit.WebChromeClient;\nimport android.webkit.PermissionRequest;",
                  1,
              )

          if "REQ_MIC = 2002" not in activity_text:
              activity_text = activity_text.replace(
                  "private static final int REQ_NOTIF = 2001;",
                  "private static final int REQ_NOTIF = 2001;\n    private static final int REQ_MIC = 2002;",
                  1,
              )

          marker = "        createNotificationChannel();\n        requestNotifPermission();"
          if "MICROPHONE_WEBVIEW_CLIENT" not in activity_text:
              mic_setup = """        // MICROPHONE_WEBVIEW_CLIENT
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                          && checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                              new String[]{Manifest.permission.RECORD_AUDIO},
                              REQ_MIC
                      );
                  }

                  try {
                      WebView microphoneWebView = getBridge().getWebView();
                      if (microphoneWebView != null) {
                          microphoneWebView.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public void onPermissionRequest(final PermissionRequest request) {
                                  runOnUiThread(() -> {
                                      boolean allowed =
                                              Build.VERSION.SDK_INT < Build.VERSION_CODES.M
                                              || checkSelfPermission(
                                                      Manifest.permission.RECORD_AUDIO
                                              ) == PackageManager.PERMISSION_GRANTED;

                                      if (allowed) {
                                          request.grant(new String[]{
                                                  PermissionRequest.RESOURCE_AUDIO_CAPTURE
                                          });
                                      } else {
                                          request.deny();
                                      }
                                  });
                              }
                          });
                      }
                  } catch (Exception ignored) {
                  }

          """
              if marker not in activity_text:
                  raise SystemExit("ERROR: onCreate microphone insertion marker not found")
              activity_text = activity_text.replace(marker, marker + "\n" + mic_setup.rstrip("\n"), 1)

          activity.write_text(activity_text, encoding="utf-8")

          final_activity = activity.read_text(encoding="utf-8")
          required = [
              "android.webkit.WebChromeClient",
              "android.webkit.PermissionRequest",
              "Manifest.permission.RECORD_AUDIO",
              "PermissionRequest.RESOURCE_AUDIO_CAPTURE",
              "setWebChromeClient(new WebChromeClient()",
              "MICROPHONE_WEBVIEW_CLIENT",
          ]
          missing = [x for x in required if x not in final_activity]
          if missing:
              raise SystemExit(
                  "ERROR: microphone integration missing: " + ", ".join(missing)
              )

          print("Microphone integration successfully added.")
          PY

      - name: Add media library for system media panel
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          gradle = Path("android-app/android/app/build.gradle")
          if not gradle.exists():
              gradle = Path("android-app/android/app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")
          dep = 'implementation "androidx.media:media:1.7.0"'
          if "androidx.media:media" not in text:
              if "dependencies {" in text:
                  text = text.replace("dependencies {", "dependencies {\n    " + dep, 1)
              elif "dependencies {" in text.replace("'", '"'):
                  pass
              else:
                  # kts
                  dep_kts = 'implementation("androidx.media:media:1.7.0")'
                  text = text.replace("dependencies {", "dependencies {\n    " + dep_kts, 1)
              gradle.write_text(text, encoding="utf-8")
              print("media dependency added")
          else:
              print("media dependency already present")
          PY


      - name: Verify Android media service and microphone files
        run: |
          set -e
          test -f android-app/android/app/src/main/java/com/aya/alquran/MainActivity.java
          test -f android-app/android/app/src/main/java/com/aya/alquran/AyaMediaService.java
          grep -q "public class AyaMediaService" android-app/android/app/src/main/java/com/aya/alquran/AyaMediaService.java
          grep -q "android.permission.RECORD_AUDIO" android-app/android/app/src/main/AndroidManifest.xml
          grep -q 'android:name=".AyaMediaService"' android-app/android/app/src/main/AndroidManifest.xml
          grep -q "PermissionRequest.RESOURCE_AUDIO_CAPTURE" android-app/android/app/src/main/java/com/aya/alquran/MainActivity.java
          echo "Android media service and microphone integration verified."

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build signed release APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          STORE="${{ github.workspace }}/aya-release.jks"

          if [ ! -f "$STORE" ]; then
            echo "::error::Keystore file not found."
            exit 1
          fi

          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$STORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-android-apk-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
