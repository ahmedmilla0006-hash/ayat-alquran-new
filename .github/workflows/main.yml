      - name: Copy final web changes to Android
        working-directory: android-app
        run: npx cap copy android

      - name: Add media library for system media panel
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          gradle = Path("android-app/android/app/build.gradle")
          if not gradle.exists():
              gradle = Path("android-app/android/app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")
          dep = 'implementation "androidx.media:media:1.7.0"'
          if "androidx.media:media" not in text:
              if "dependencies {" in text:
                  text = text.replace("dependencies {", "dependencies {\n    " + dep, 1)
              elif "dependencies {" in text.replace("'", '"'):
                  pass
              else:
                  # kts
                  dep_kts = 'implementation("androidx.media:media:1.7.0")'
                  text = text.replace("dependencies {", "dependencies {\n    " + dep_kts, 1)
              gradle.write_text(text, encoding="utf-8")
              print("media dependency added")
          else:
              print("media dependency already present")
          PY

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build signed release APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          STORE="${{ github.workspace }}/aya-release.jks"

          if [ ! -f "$STORE" ]; then
            echo "::error::Keystore file not found."
            exit 1
          fi

          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$STORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-android-apk-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
