name: Build Aya Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # تحميل المشروع
      - name: Download project
        uses: actions/checkout@v4

      # تثبيت Node.js
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # تثبيت Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # إنشاء مشروع Android
      - name: Create Android project
        run: |
          mkdir android-app
          cd android-app

          npm init -y

          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      # تجهيز ملفات الموقع
      - name: Prepare web files
        run: |
          mkdir -p android-app/www

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android-app' \
            ./ android-app/www/

      # تهيئة Capacitor
      - name: Initialize Capacitor
        working-directory: android-app
        run: |
          npx cap init "آية" "com.aya.alquran" --web-dir www

      # إضافة Android
      - name: Add Android platform
        working-directory: android-app
        run: |
          npx cap add android

      # تعيين اسم التطبيق
      - name: Set Android app name
        working-directory: android-app
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">آية<\/string>/' \
            android/app/src/main/res/values/strings.xml

      # تثبيت ImageMagick
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      # تثبيت أيقونة تطبيق آية
      - name: Install Aya app icon
        run: |
          ICON="icon.png"
          RES="android-app/android/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: icon.png not found"
            exit 1
          fi

          # إنشاء مجلد مؤقت للأيقونة
          mkdir -p /tmp/aya-icon

          # إنشاء نسخة أصلية 192x192 بدون تشويه
          convert "$ICON" \
            -resize "192x192^" \
            -gravity center \
            -extent 192x192 \
            /tmp/aya-icon/icon-192.png

          # إزالة أيقونات Android adaptive القديمة
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          # إنشاء مجلدات الأيقونات
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # mdpi = 48x48
          convert /tmp/aya-icon/icon-192.png \
            -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert /tmp/aya-icon/icon-192.png \
            -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          # hdpi = 72x72
          convert /tmp/aya-icon/icon-192.png \
            -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert /tmp/aya-icon/icon-192.png \
            -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          # xhdpi = 96x96
          convert /tmp/aya-icon/icon-192.png \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert /tmp/aya-icon/icon-192.png \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          # xxhdpi = 144x144
          convert /tmp/aya-icon/icon-192.png \
            -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher
