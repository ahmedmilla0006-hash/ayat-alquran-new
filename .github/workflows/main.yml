name: Build Aya Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Android project
        run: |
          mkdir -p android-app
          cd android-app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web files
        run: |
          mkdir -p android-app/www
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android-app' \
            ./ android-app/www/

      - name: Initialize Capacitor
        working-directory: android-app
        run: npx cap init "آية" "com.aya.alquran" --web-dir www

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Configure Android app name
        working-directory: android-app
        run: |
          python3 << 'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/values/strings.xml")

          if p.exists():
              text = p.read_text(encoding="utf-8")

              text = text.replace(
                  "app_name\">App",
                  "app_name\">آية"
              )

              p.write_text(text, encoding="utf-8")

          print("Android app name configured.")
          PY

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Install Aya app icon
        run: |
          python3 << 'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          icon_path = Path("icon.png")

          if not icon_path.exists():
              raise SystemExit("ERROR: icon.png was not found.")

          original = Image.open(icon_path).convert("RGBA")

          base = Path(
              "android-app/android/app/src/main/res"
          )

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              target_dir = base / folder
              target_dir.mkdir(parents=True, exist_ok=True)

              resized = original.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              resized.save(
                  target_dir / "ic_launcher.png",
                  "PNG"
              )

              resized.save(
                  target_dir / "ic_launcher_round.png",
                  "PNG"
              )

              for f in target_dir.glob("ic_launcher*"):
                  if f.name not in [
                      "ic_launcher.png",
                      "ic_launcher_round.png"
                  ]:
                      f.unlink(missing_ok=True)

          fg_size = 432

          canvas = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (0, 0, 0, 0)
          )

          icon_size = int(fg_size * 0.72)

          icon_resized = original.resize(
              (icon_size, icon_size),
              Image.Resampling.LANCZOS
          )

          offset = (
              (fg_size - icon_size) // 2
          )

          canvas.paste(
              icon_resized,
              (offset, offset),
              icon_resized
          )

          xxx = base / "mipmap-xxxhdpi"

          xxx.mkdir(
              parents=True,
              exist_ok=True
          )

          canvas.save(
              xxx / "ic_launcher_foreground.png",
              "PNG"
          )

          bg = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (13, 27, 42, 255)
          )

          bg.save(
              xxx / "ic_launcher_background.png",
              "PNG"
          )

          anydpi = base / "mipmap-anydpi-v26"

          if anydpi.exists():
              shutil.rmtree(anydpi)

          anydpi.mkdir(
              parents=True,
              exist_ok=True
          )

          xml = (
              '<?xml version="1.0" encoding="utf-8"?>'
              '<adaptive-icon '
              'xmlns:android='
              '"http://schemas.android.com/apk/res/android">'
              '<background '
              'android:drawable='
              '"@mipmap/ic_launcher_background"/>'
              '<foreground '
              'android:drawable='
              '"@mipmap/ic_launcher_foreground"/>'
              '</adaptive-icon>'
          )

          (
              anydpi / "ic_launcher.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          (
              anydpi / "ic_launcher_round.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          print("Aya icon improved successfully.")
          PY

      - name: Set versionCode from run number
        id: ver
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"

          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # KEYSTORE
      # ============================================================

      - name: Decode and verify keystore
        env:
          K1: ${{ secrets.KS1 }}
          K2: ${{ secrets.KS2 }}
          K3: ${{ secrets.KS3 }}
          K4: ${{ secrets.KS4 }}
          K5: ${{ secrets.KS5 }}
          K6: ${{ secrets.KS6 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 << 'PY'
          import os, re, base64, pathlib, subprocess, sys

          parts = []
          for i in range(1, 7):
              v = os.environ.get(f"K{i}") or ""
              print(f"KS{i} length = {len(v)}")
              if not v:
                  print(f"::error::السر KS{i} ناقص")
                  sys.exit(1)
              parts.append(v)

          b64 = "".join(parts)
          # إزالة أي محارف غير Base64 (مسافات، أسطر، إلخ)
          b64 = re.sub(r"[^A-Za-z0-9+/=]", "", b64)
          # إكمال الحشو إن نقص
          pad = (-len(b64)) % 4
          if pad:
              b64 += "=" * pad

          print(f"Total base64 length = {len(b64)}")

          try:
              raw = base64.b64decode(b64, validate=False)
          except Exception as e:
              print(f"::error::فشل فك Base64: {e}")
              sys.exit(1)

          out = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "aya-release.jks"
          out.write_bytes(raw)
          print(f"Keystore bytes = {len(raw)}")
          if len(raw) < 100:
              print("::error::ملف keystore صغير جداً — الأجزاء ناقصة")
              sys.exit(1)

          pw = os.environ.get("KEYSTORE_PASSWORD") or ""
          alias = os.environ.get("KEY_ALIAS") or ""
          r = subprocess.run(
              ["keytool", "-list", "-keystore", str(out), "-storepass", pw, "-alias", alias],
              capture_output=True,
              text=True,
          )
          print(r.stdout)
          if r.returncode != 0:
              print(r.stderr)
              print("::error::keytool فشل — تحقق من KEYSTORE_PASSWORD و KEY_ALIAS")
              sys.exit(1)
          print("Keystore verified successfully.")
          PY

      # ============================================================
      # VERSION
      # ============================================================

      - name: Set version in Gradle
        env:
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os
          import re

          vc = os.environ["VERSION_CODE"]
          vn = os.environ["VERSION_NAME"]

          gradle = Path(
              "android-app/android/app/build.gradle"
          )

          if not gradle.exists():
              gradle = Path(
                  "android-app/android/app/build.gradle.kts"
              )

          if not gradle.exists():
              raise SystemExit(
                  "ERROR: Gradle file not found."
              )

          text = gradle.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r"versionCode\s+\d+",
              "versionCode " + vc,
              text
          )

          text = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName "' + vn + '"',
              text
          )

          gradle.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "version set",
              vc,
              vn
          )
          PY

      # ============================================================
      # NOTIFICATIONS — إشعار التلاوة (قائمة التشغيل)
      # ============================================================

      - name: Configure Android notifications and in-app APK update
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re, base64

          android_root = Path("android-app/android/app/src/main")
          manifest = android_root / "AndroidManifest.xml"
          text = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK",
              "android.permission.REQUEST_INSTALL_PACKAGES",
          ]
          for permission in permissions:
              if permission not in text:
                  text = re.sub(
                      r"(<manifest[^>]*>)",
                      r'\1\n    <uses-permission android:name="%s" />' % permission,
                      text,
                      count=1,
                  )

          if "android:usesCleartextTraffic" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )

          if "androidx.core.content.FileProvider" not in text:
              provider_xml = """
                        <provider
                            android:name="androidx.core.content.FileProvider"
                            android:authorities="${applicationId}.fileprovider"
                            android:exported="false"
                            android:grantUriPermissions="true">
                            <meta-data
                                android:name="android.support.FILE_PROVIDER_PATHS"
                                android:resource="@xml/file_paths" />
                        </provider>
                    """
              text = re.sub(r"(</application>)", provider_xml + r"\1", text, count=1)

          manifest.write_text(text, encoding="utf-8")

          # Remove media notification/service when the app task is swiped away.
          text = manifest.read_text(encoding="utf-8")
          if 'android:name=".AyaMediaService"' in text and 'android:stopWithTask="true"' not in text:
              text = re.sub(
                  r'(<service\s+android:name="\.AyaMediaService"[^>]*)(/?>)',
                  r'\1\n        android:stopWithTask="true"\2',
                  text, count=1
              )
              manifest.write_text(text, encoding="utf-8")

          xml_dir = android_root / "res/xml"
          xml_dir.mkdir(parents=True, exist_ok=True)
          (xml_dir / "file_paths.xml").write_text(
              """<?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="apk_cache" path="." />
              <external-cache-path name="apk_ext_cache" path="." />
              <files-path name="apk_files" path="." />
          </paths>
          """,
              encoding="utf-8",
          )

          java_dir = android_root / "java/com/aya/alquran"
          java_dir.mkdir(parents=True, exist_ok=True)
          activity = java_dir / "MainActivity.java"

          activity_b64 = ""
          activity.write_bytes(base64.b64decode(activity_b64))

          # ============================================================
          # ============================================================
          # AYA MEDIA SERVICE — keep the existing service intact
          # IMPORTANT: use AndroidX MediaCompat classes from androidx.media:media
          # ============================================================

          service_b64 = ""
          service_file = java_dir / "AyaMediaService.java"
          service_file.write_bytes(base64.b64decode(service_b64))

          if not service_file.exists():
              raise SystemExit("ERROR: AyaMediaService.java was not created.")

          service_text_check = service_file.read_text(encoding="utf-8")
          required_service = [
              "public class AyaMediaService",
              "android.support.v4.media.session.MediaSessionCompat",
              "android.support.v4.media.session.PlaybackStateCompat",
              "EXTRA_POSITION",
              "EXTRA_DURATION",
              "onTaskRemoved(Intent rootIntent)",
          ]
          missing_service = [x for x in required_service if x not in service_text_check]
          if missing_service:
              raise SystemExit(
                  "ERROR: AyaMediaService.java missing: " + ", ".join(missing_service)
              )

          mtxt = manifest.read_text(encoding="utf-8")
          if 'android:name=".AyaMediaService"' not in mtxt:
              svc = (
                  '    <service\n'
                  '        android:name=".AyaMediaService"\n'
                  '        android:exported="false"\n'
                  '        android:stopWithTask="true"\n'
                  '        android:foregroundServiceType="mediaPlayback" />\n'
              )
              mtxt = re.sub(r"(</application>)", svc + r"\1", mtxt, count=1)
          elif 'android:name=".AyaMediaService"' in mtxt and 'android:foregroundServiceType="mediaPlayback"' not in mtxt:
              mtxt = re.sub(
                  r'(<service\s+android:name="\.AyaMediaService"[^>]*)(/?>)',
                  r'\1\n        android:foregroundServiceType="mediaPlayback"\2',
                  mtxt,
                  count=1
              )
          manifest.write_text(mtxt, encoding="utf-8")
          print("AyaMediaService.java restored and verified without overwriting it later.")


      - name: Remove invalid Activity onTaskRemoved override
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          activity = Path("android-app/android/app/src/main/java/com/aya/alquran/MainActivity.java")
          text = activity.read_text(encoding="utf-8")

          # onTaskRemoved() belongs to Service, not Activity/BridgeActivity.
          # Remove any previously injected override from MainActivity.
          text = re.sub(
              r"\n\s*@Override\s*\n\s*public void onTaskRemoved\(Intent rootIntent\)\s*\{.*?\n\s*\}\s*\n",
              "\n",
              text,
              flags=re.DOTALL,
          )
          text = text.replace("\n        super.onTaskRemoved(rootIntent);", "")
          activity.write_text(text, encoding="utf-8")

          if "onTaskRemoved(" in text or "super.onTaskRemoved(" in text:
              raise SystemExit("ERROR: invalid onTaskRemoved override remains in MainActivity.java")

          print("MainActivity.java fixed: no onTaskRemoved override.")
          PY

      # ============================================================
      # BACKGROUND UPDATE NOTIFICATIONS — فحص التحديثات في الخلفية
      # ============================================================

      - name: Enable background update notification
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import re

          java_dir = Path("android-app/android/app/src/main/java/com/aya/alquran")
          activity = java_dir / "MainActivity.java"
          worker = java_dir / "UpdateCheckWorker.java"
          activity_text = activity.read_text(encoding="utf-8")

          imports = """import androidx.work.Constraints;
          import androidx.work.ExistingPeriodicWorkPolicy;
          import androidx.work.NetworkType;
          import androidx.work.PeriodicWorkRequest;
          import androidx.work.WorkManager;
          import java.util.concurrent.TimeUnit;
          """

          if "import androidx.work.WorkManager;" not in activity_text:
              package_end = activity_text.find("\n", activity_text.find("package "))
              if package_end == -1: raise SystemExit("ERROR: package declaration not found.")
              activity_text = activity_text[:package_end + 1] + imports + activity_text[package_end + 1:]

          method = """
              private void scheduleBackgroundUpdateCheck() {
                  try {
                      Constraints constraints = new Constraints.Builder()
                              .setRequiredNetworkType(NetworkType.CONNECTED)
                              .build();
                      PeriodicWorkRequest request = new PeriodicWorkRequest.Builder(
                              UpdateCheckWorker.class, 6, TimeUnit.HOURS)
                              .setConstraints(constraints)
                              .build();
                      WorkManager.getInstance(getApplicationContext())
                              .enqueueUniquePeriodicWork(
                                      "aya_background_update_check",
                                      ExistingPeriodicWorkPolicy.KEEP,
                                      request);
                  } catch (Exception ignored) {
                  }
              }
          """

          if "private void scheduleBackgroundUpdateCheck()" not in activity_text:
              pos = activity_text.rfind("\n}")
              if pos == -1: raise SystemExit("ERROR: MainActivity closing brace not found.")
              activity_text = activity_text[:pos] + method + activity_text[pos:]

          if "scheduleBackgroundUpdateCheck();" not in activity_text:
              m = re.search(r"(protected|public)\s+void\s+onCreate\s*\([^)]*\)\s*\{", activity_text)
              if not m: raise SystemExit("ERROR: onCreate() not found.")
              activity_text = activity_text[:m.end()] + "\n        scheduleBackgroundUpdateCheck();" + activity_text[m.end():]

          activity.write_text(activity_text, encoding="utf-8")

          UPDATE_INSTALL_ACTIVITY_CODE = __import__("base64").b64decode("").decode("utf-8")

          WORKER_CODE = 'package com.aya.alquran;\n\nimport android.app.NotificationChannel;\nimport android.app.NotificationManager;\nimport android.app.PendingIntent;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.content.SharedPreferences;\nimport android.content.pm.PackageInfo;\nimport android.os.Build;\n\nimport androidx.annotation.NonNull;\nimport androidx.core.app.NotificationCompat;\nimport androidx.work.Worker;\nimport androidx.work.WorkerParameters;\n\nimport org.json.JSONObject;\n\nimport java.io.BufferedReader;\nimport java.io.InputStream;\nimport java.io.InputStreamReader;\nimport java.net.HttpURLConnection;\nimport java.net.URL;\n\npublic class UpdateCheckWorker extends Worker {\n    private static final String UPDATE_URL =\n            "https://raw.githubusercontent.com/ahmedmilla0006-hash/ayat-alquran-new/main/update.json";\n    private static final String CHANNEL_ID = "aya_updates";\n    private static final int NOTIFICATION_ID = 7703;\n    private static final String PREFS = "aya_background_updates";\n    private static final String LAST_NOTIFIED = "last_notified_version";\n\n    public UpdateCheckWorker(@NonNull Context context, @NonNull WorkerParameters params) {\n        super(context, params);\n    }\n\n    @NonNull\n    @Override\n    public Result doWork() {\n        HttpURLConnection connection = null;\n        try {\n            URL url = new URL(UPDATE_URL + "?t=" + System.currentTimeMillis());\n            connection = (HttpURLConnection) url.openConnection();\n            connection.setRequestMethod("GET");\n            connection.setConnectTimeout(15000);\n            connection.setReadTimeout(20000);\n            connection.setUseCaches(false);\n            connection.setRequestProperty("Cache-Control", "no-cache");\n            connection.setRequestProperty("User-Agent", "Aya-Android-UpdateChecker");\n\n            int code = connection.getResponseCode();\n            if (code == 408 || code == 429 || code == 500 || code == 502\n                    || code == 503 || code == 504) return Result.retry();\n            if (code != HttpURLConnection.HTTP_OK) return Result.success();\n\n            InputStream input = connection.getInputStream();\n            BufferedReader reader = new BufferedReader(new InputStreamReader(input, "UTF-8"));\n            StringBuilder jsonText = new StringBuilder();\n            String line;\n            while ((line = reader.readLine()) != null) jsonText.append(line);\n            reader.close();\n            input.close();\n\n            JSONObject data = new JSONObject(jsonText.toString());\n            String remoteVersion = data.optString("version", "").trim();\n            if (remoteVersion.length() == 0) return Result.success();\n\n            String installedVersion = getInstalledVersion();\n            if (!isNewer(remoteVersion, installedVersion)) return Result.success();\n\n            SharedPreferences prefs = getApplicationContext().getSharedPreferences(\n                    PREFS, Context.MODE_PRIVATE);\n            if (remoteVersion.equals(prefs.getString(LAST_NOTIFIED, ""))) return Result.success();\n\n            String title = data.optString("title", "آية — تحديث جديد");\n            String notes = data.optString("body",\n                    data.optString("message", "يتوفر إصدار جديد من تطبيق آية."));\n            String apkUrl = data.optString("url", "").trim();\n            if (apkUrl.length() == 0) apkUrl = data.optString("apkUrl", "").trim();\n            if (apkUrl.length() == 0) apkUrl = data.optString("download_url", "").trim();\n\n            showUpdateNotification(remoteVersion, title, notes, apkUrl);\n            prefs.edit().putString(LAST_NOTIFIED, remoteVersion).apply();\n            return Result.success();\n        } catch (Exception e) {\n            return Result.retry();\n        } finally {\n            if (connection != null) connection.disconnect();\n        }\n    }\n\n    private String getInstalledVersion() {\n        try {\n            PackageInfo info = getApplicationContext().getPackageManager().getPackageInfo(\n                    getApplicationContext().getPackageName(), 0);\n            return info.versionName == null ? "0" : info.versionName;\n        } catch (Exception e) {\n            return "0";\n        }\n    }\n\n    private boolean isNewer(String remote, String installed) {\n        try {\n            String[] r = remote.split("\\\\.");\n            String[] i = installed.split("\\\\.");\n            int count = Math.max(r.length, i.length);\n            for (int n = 0; n < count; n++) {\n                int rv = n < r.length ? parsePart(r[n]) : 0;\n                int iv = n < i.length ? parsePart(i[n]) : 0;\n                if (rv > iv) return true;\n                if (rv < iv) return false;\n            }\n            return false;\n        } catch (Exception e) {\n            return !remote.equals(installed);\n        }\n    }\n\n    private int parsePart(String value) {\n        String digits = value.replaceAll("[^0-9].*$", "");\n        return digits.length() == 0 ? 0 : Integer.parseInt(digits);\n    }\n\n    private void showUpdateNotification(String version, String title, String notes, String apkUrl) {\n        Context context = getApplicationContext();\n        NotificationManager manager =\n                (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);\n        if (manager == null) return;\n\n        if (Build.VERSION.SDK_INT >= 26) {\n            NotificationChannel channel = new NotificationChannel(\n                    CHANNEL_ID, "تحديثات تطبيق آية", NotificationManager.IMPORTANCE_DEFAULT);\n            channel.setDescription("إشعارات توفر إصدارات جديدة من تطبيق آية");\n            manager.createNotificationChannel(channel);\n        }\n\n        Intent intent = new Intent(context, UpdateInstallActivity.class);\n        intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);\n        intent.putExtra("apk_url", apkUrl);\n        intent.putExtra("version", version);\n\n        PendingIntent pendingIntent = PendingIntent.getActivity(\n                context, NOTIFICATION_ID, intent,\n                PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);\n\n        String body = "يتوفر إصدار جديد (" + version + ")";\n        if (notes != null && notes.trim().length() > 0) body += " — " + notes.trim();\n\n        NotificationCompat.Builder builder = new NotificationCompat.Builder(context, CHANNEL_ID)\n                .setSmallIcon(android.R.drawable.stat_sys_download_done)\n                .setContentTitle(title == null || title.trim().length() == 0\n                        ? "آية — تحديث جديد" : title)\n                .setContentText(body)\n                .setStyle(new NotificationCompat.BigTextStyle().bigText(body))\n                .setContentIntent(pendingIntent)\n                .addAction(android.R.drawable.stat_sys_download, "تحديث الآن", pendingIntent)\n                .setAutoCancel(true)\n                .setPriority(NotificationCompat.PRIORITY_DEFAULT);\n\n        manager.notify(NOTIFICATION_ID, builder.build());\n    }\n}\n'
          worker.write_text(WORKER_CODE, encoding="utf-8")

          install_activity = java_dir / "UpdateInstallActivity.java"
          install_activity.write_text(UPDATE_INSTALL_ACTIVITY_CODE, encoding="utf-8")

          manifest = Path("android-app/android/app/src/main/AndroidManifest.xml")
          manifest_text = manifest.read_text(encoding="utf-8")
          if 'android:name=".UpdateInstallActivity"' not in manifest_text:
              activity_xml = (
                  '        <activity\n'
                  '            android:name=".UpdateInstallActivity"\n'
                  '            android:exported="false"\n'
                  '            android:theme="@android:style/Theme.Translucent.NoTitleBar" />\n'
              )
              manifest_text = manifest_text.replace("</application>", activity_xml + "    </application>", 1)
              manifest.write_text(manifest_text, encoding="utf-8")

          print("Background update notification enabled with instant update action.")
          PY

      - name: Add required AndroidX Media library
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import re

          gradle = Path("android-app/android/app/build.gradle")
          is_kts = False
          if not gradle.exists():
              gradle = Path("android-app/android/app/build.gradle.kts")
              is_kts = True

          if not gradle.exists():
              raise SystemExit("ERROR: app Gradle file not found.")

          text = gradle.read_text(encoding="utf-8")

          additions = []
          if "androidx.media:media" not in text:
              additions.append('    implementation("androidx.media:media:1.7.0")' if is_kts else '    implementation "androidx.media:media:1.7.0"')
          if "androidx.work:work-runtime" not in text:
              additions.append('    implementation("androidx.work:work-runtime:2.9.0")' if is_kts else '    implementation "androidx.work:work-runtime:2.9.0"')

          if additions:
              if "dependencies {" not in text:
                  raise SystemExit("ERROR: dependencies block not found in app Gradle file.")
              text = text.replace("dependencies {", "dependencies {\n" + "\n".join(additions), 1)
              gradle.write_text(text, encoding="utf-8")

          final = gradle.read_text(encoding="utf-8")
          if "androidx.media:media:1.7.0" not in final:
              raise SystemExit("ERROR: androidx.media:media:1.7.0 was not added to app Gradle.")
          if "androidx.work:work-runtime:2.9.0" not in final:
              raise SystemExit("ERROR: androidx.work:work-runtime:2.9.0 was not added to app Gradle.")
          print("AndroidX Media 1.7.0 dependency is present.")
          print("WorkManager 2.9.0 dependency is present.")
          PY

          echo "Checking AndroidX Media on the release compile classpath..."
          cd android-app/android
          ./gradlew :app:dependencies --configuration releaseCompileClasspath --no-daemon > /tmp/aya-deps.txt
          grep -q "androidx.media:media:1.7.0" /tmp/aya-deps.txt || {
            echo "::error::androidx.media:media:1.7.0 is not on releaseCompileClasspath"
            exit 1
          }
          echo "AndroidX Media dependency verified on releaseCompileClasspath."
          grep -q "androidx.work:work-runtime:2.9.0" /tmp/aya-deps.txt || {
            echo "::error::androidx.work:work-runtime:2.9.0 is not on releaseCompileClasspath"
            exit 1
          }
          echo "WorkManager dependency verified on releaseCompileClasspath."
          cd ../..


      - name: Verify Android media service and microphone files
        run: |
          set -e
          test -f android-app/android/app/src/main/java/com/aya/alquran/MainActivity.java
          test -f android-app/android/app/src/main/java/com/aya/alquran/AyaMediaService.java
          test -f android-app/android/app/src/main/java/com/aya/alquran/UpdateCheckWorker.java
          test -f android-app/android/app/src/main/java/com/aya/alquran/UpdateInstallActivity.java
          grep -q "public class UpdateCheckWorker" android-app/android/app/src/main/java/com/aya/alquran/UpdateCheckWorker.java
          grep -q "public class UpdateInstallActivity" android-app/android/app/src/main/java/com/aya/alquran/UpdateInstallActivity.java
          grep -q "update.json" android-app/android/app/src/main/java/com/aya/alquran/UpdateCheckWorker.java
          grep -q "تحديث الآن" android-app/android/app/src/main/java/com/aya/alquran/UpdateCheckWorker.java
          grep -q 'android:name=".UpdateInstallActivity"' android-app/android/app/src/main/AndroidManifest.xml

          SERVICE="android-app/android/app/src/main/java/com/aya/alquran/AyaMediaService.java"

          grep -q "public class AyaMediaService" "$SERVICE"
          grep -q "android.support.v4.media.session.MediaSessionCompat" "$SERVICE"
          grep -q "android.support.v4.media.session.PlaybackStateCompat" "$SERVICE"
          grep -q "EXTRA_POSITION" "$SERVICE"
          grep -q "EXTRA_DURATION" "$SERVICE"
          grep -q "onTaskRemoved(Intent rootIntent)" "$SERVICE"

          if grep -q "androidx.media.session.MediaSessionCompat" "$SERVICE"; then
            echo "::error::Invalid androidx.media.session.MediaSessionCompat import detected."
            exit 1
          fi

          if grep -q "androidx.media.session.PlaybackStateCompat" "$SERVICE"; then
            echo "::error::Invalid androidx.media.session.PlaybackStateCompat import detected."
            exit 1
          fi

          grep -q 'android:name=".AyaMediaService"' android-app/android/app/src/main/AndroidManifest.xml

          if grep -Rqs --include='*.xml' --include='*.java' --include='*.kt' \
              'android.permission.RECORD_AUDIO\|PermissionRequest.RESOURCE_AUDIO_CAPTURE\|WebChromeClient' \
              android-app/android/app/src/main; then
            echo "::error::Microphone permission/capture code detected in app source."
            exit 1
          fi

          if grep -Rqs --include='*.xml' 'android.permission.RECORD_AUDIO' android-app/android/app/src/main; then
            echo "::error::RECORD_AUDIO permission detected in app manifest sources."
            exit 1
          fi

          echo "AyaMediaService verified; microphone permission/capture removed."


      # ============================================================
      # FINAL MICROPHONE PERMISSION GUARD
      # ============================================================

      - name: Remove and block RECORD_AUDIO permission
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import re

          root = Path("android-app/android/app/src/main")
          for manifest in root.rglob("AndroidManifest.xml"):
              text = manifest.read_text(encoding="utf-8")
              text = re.sub(
                  r'\s*<uses-permission\s+android:name=["\']android\.permission\.RECORD_AUDIO["\']\s*/?>',
                  "",
                  text,
              )
              manifest.write_text(text, encoding="utf-8")

          forbidden = [
              "android.permission.RECORD_AUDIO",
              "PermissionRequest.RESOURCE_AUDIO_CAPTURE",
              "android.webkit.WebChromeClient",
              "REQ_MIC",
              "MICROPHONE_WEBVIEW_CLIENT",
          ]
          for path in root.rglob("*"):
              if path.is_file() and path.suffix in {".java", ".kt", ".xml"}:
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  for token in forbidden:
                      if token in text:
                          raise SystemExit(f"ERROR: forbidden microphone token {token} found in {path}")
          print("Final source guard passed: no microphone permission/capture code.")
          PY

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build signed release APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          STORE="${{ github.workspace }}/aya-release.jks"

          if [ ! -f "$STORE" ]; then
            echo "::error::Keystore file not found."
            exit 1
          fi

          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$STORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -o -name aapt2 | head -n 1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt/aapt2 not found; cannot verify final APK permissions."
            exit 1
          fi

          if "$AAPT" dump permissions "$APK" | grep -q "android.permission.RECORD_AUDIO"; then
            echo "::error::Final APK contains RECORD_AUDIO. Build rejected."
            exit 1
          fi

          echo "Final APK permission check passed: RECORD_AUDIO is not declared."

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-android-apk-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
