name: Build Aya Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Android project
        run: |
          mkdir -p android-app
          cd android-app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web files
        run: |
          mkdir -p android-app/www
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android-app' \
            ./ android-app/www/

      - name: Initialize Capacitor
        working-directory: android-app
        run: npx cap init "آية" "com.aya.alquran" --web-dir www

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Configure Android app name
        working-directory: android-app
        run: |
          python3 << 'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/values/strings.xml")

          if p.exists():
              text = p.read_text(encoding="utf-8")

              text = text.replace(
                  "app_name\">App",
                  "app_name\">آية"
              )

              p.write_text(text, encoding="utf-8")

          print("Android app name configured.")
          PY

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Install Aya app icon
        run: |
          python3 << 'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          icon_path = Path("icon.png")

          if not icon_path.exists():
              raise SystemExit("ERROR: icon.png was not found.")

          original = Image.open(icon_path).convert("RGBA")

          base = Path(
              "android-app/android/app/src/main/res"
          )

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              target_dir = base / folder
              target_dir.mkdir(parents=True, exist_ok=True)

              resized = original.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              resized.save(
                  target_dir / "ic_launcher.png",
                  "PNG"
              )

              resized.save(
                  target_dir / "ic_launcher_round.png",
                  "PNG"
              )

              for f in target_dir.glob("ic_launcher*"):
                  if f.name not in [
                      "ic_launcher.png",
                      "ic_launcher_round.png"
                  ]:
                      f.unlink(missing_ok=True)

          fg_size = 432

          canvas = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (0, 0, 0, 0)
          )

          icon_size = int(fg_size * 0.72)

          icon_resized = original.resize(
              (icon_size, icon_size),
              Image.Resampling.LANCZOS
          )

          offset = (
              (fg_size - icon_size) // 2
          )

          canvas.paste(
              icon_resized,
              (offset, offset),
              icon_resized
          )

          xxx = base / "mipmap-xxxhdpi"

          xxx.mkdir(
              parents=True,
              exist_ok=True
          )

          canvas.save(
              xxx / "ic_launcher_foreground.png",
              "PNG"
          )

          bg = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (13, 27, 42, 255)
          )

          bg.save(
              xxx / "ic_launcher_background.png",
              "PNG"
          )

          anydpi = base / "mipmap-anydpi-v26"

          if anydpi.exists():
              shutil.rmtree(anydpi)

          anydpi.mkdir(
              parents=True,
              exist_ok=True
          )

          xml = (
              '<?xml version="1.0" encoding="utf-8"?>'
              '<adaptive-icon '
              'xmlns:android='
              '"http://schemas.android.com/apk/res/android">'
              '<background '
              'android:drawable='
              '"@mipmap/ic_launcher_background"/>'
              '<foreground '
              'android:drawable='
              '"@mipmap/ic_launcher_foreground"/>'
              '</adaptive-icon>'
          )

          (
              anydpi / "ic_launcher.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          (
              anydpi / "ic_launcher_round.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          print("Aya icon improved successfully.")
          PY

      - name: Set versionCode from run number
        id: ver
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"

          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # KEYSTORE
      # ============================================================

      - name: Decode and verify keystore
        env:
          K1: ${{ secrets.KS1 }}
          K2: ${{ secrets.KS2 }}
          K3: ${{ secrets.KS3 }}
          K4: ${{ secrets.KS4 }}
          K5: ${{ secrets.KS5 }}
          K6: ${{ secrets.KS6 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          echo "Checking keystore parts..."

          for i in 1 2 3 4 5 6; do
            eval "v=\$K$i"

            if [ -z "$v" ]; then
              echo "::error::السر KS$i ناقص"
              exit 1
            fi

            echo "KS$i exists."
          done

          B64="${K1}${K2}${K3}${K4}${K5}${K6}"

          B64="$(printf '%s' "$B64" | tr -d '[:space:]')"

          echo "Checking Base64..."

          if ! printf '%s' "$B64" | base64 --decode > /dev/null 2>&1; then
            echo "::error::KS1-KS6 لا تحتوي على Base64 صالح"
            exit 1
          fi

          echo "Base64 is valid."

          printf '%s' "$B64" | base64 --decode \
            > "${{ github.workspace }}/aya-release.jks"

          if [ ! -s "${{ github.workspace }}/aya-release.jks" ]; then
            echo "::error::ملف keystore فارغ"
            exit 1
          fi

          echo "Keystore file created."

          ls -lh \
            "${{ github.workspace }}/aya-release.jks"

          keytool -list \
            -keystore "${{ github.workspace }}/aya-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Keystore verified successfully."

      # ============================================================
      # VERSION
      # ============================================================

      - name: Set version in Gradle
        env:
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os
          import re

          vc = os.environ["VERSION_CODE"]
          vn = os.environ["VERSION_NAME"]

          gradle = Path(
              "android-app/android/app/build.gradle"
          )

          if not gradle.exists():
              gradle = Path(
                  "android-app/android/app/build.gradle.kts"
              )

          if not gradle.exists():
              raise SystemExit(
                  "ERROR: Gradle file not found."
              )

          text = gradle.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r"versionCode\s+\d+",
              "versionCode " + vc,
              text
          )

          text = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName "' + vn + '"',
              text
          )

          gradle.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "version set",
              vc,
              vn
          )
          PY

      # ============================================================
      # NOTIFICATION + MEDIA CONTROLS
      # ============================================================

      - name: Configure Android notification system
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          android_root = Path(
              "android-app/android/app/src/main"
          )

          manifest = android_root / "AndroidManifest.xml"

          text = manifest.read_text(
              encoding="utf-8"
          )

          permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK"
          ]

          for permission in permissions:
              if permission not in text:
                  text = re.sub(
                      r"(<manifest[^>]*>)",
                      r'\1\n    <uses-permission android:name="%s" />'
                      % permission,
                      text,
                      count=1
                  )

          if "android:usesCleartextTraffic" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          # Receiver الخاص بأزرار الإشعار
          if "NotificationActionReceiver" not in text:

              receiver = '''
              <receiver
                  android:name=".NotificationActionReceiver"
                  android:exported="false" />
              '''

              text = text.replace(
                  "</application>",
                  receiver + "\n    </application>"
              )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          java_dir = (
              android_root /
              "java/com/aya/alquran"
          )

          java_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          # --------------------------------------------------------
          # MainActivity.java
          # --------------------------------------------------------

          main_activity = java_dir / "MainActivity.java"

          main_code = r'''package com.aya.alquran;

          import android.Manifest;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.webkit.WebView;

          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;
          import androidx.core.app.PendingIntentCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              public static final String CHANNEL_ID =
                      "aya_recitation";

              public static final int NOTIFICATION_ID =
                      2001;

              public static MainActivity instance;

              private final Handler handler =
                      new Handler();

              private boolean notificationVisible =
                      false;

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  instance = this;

                  createNotificationChannel();

                  requestNotificationPermission();

                  startNotificationUpdater();
              }

              private void requestNotificationPermission() {

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.TIRAMISU
                  ) {

                      if (
                          ActivityCompat.checkSelfPermission(
                              this,
                              Manifest.permission.POST_NOTIFICATIONS
                          ) != PackageManager.PERMISSION_GRANTED
                      ) {

                          requestPermissions(
                              new String[]{
                                  Manifest.permission.POST_NOTIFICATIONS
                              },
                              3001
                          );
                      }
                  }
              }

              private void createNotificationChannel() {

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O
                  ) {

                      NotificationChannel channel =
                              new NotificationChannel(
                                  CHANNEL_ID,
                                  "تلاوة القرآن",
                                  NotificationManager.IMPORTANCE_LOW
                              );

                      channel.setDescription(
                          "إشعار تشغيل تلاوة القرآن في تطبيق آية"
                      );

                      channel.setShowBadge(false);

                      NotificationManager manager =
                              getSystemService(
                                  NotificationManager.class
                              );

                      if (manager != null) {
                          manager.createNotificationChannel(
                              channel
                          );
                      }
                  }
              }

              public static void executeJavaScript(
                      String javascript
              ) {

                  if (instance == null) {
                      return;
                  }

                  WebView webView =
                          instance.bridge.getWebView();

                  if (webView == null) {
                      return;
                  }

                  webView.post(
                      () -> webView.evaluateJavascript(
                          javascript,
                          null
                      )
                  );
              }

              private void startNotificationUpdater() {

                  handler.postDelayed(
                      new Runnable() {

                          @Override
                          public void run() {

                              updateNotification();

                              handler.postDelayed(
                                  this,
                                  1000
                              );
                          }
                      },
                      1500
                  );
              }

              public void updateNotification() {

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.TIRAMISU
                  ) {

                      if (
                          ActivityCompat.checkSelfPermission(
                              this,
                              Manifest.permission.POST_NOTIFICATIONS
                          ) != PackageManager.PERMISSION_GRANTED
                      ) {
                          return;
                      }
                  }

                  String javascript =
                      "(function(){"
                      + "var a=document.querySelector('audio');"
                      + "var t=document.title||'آية';"
                      + "var p=a&&!a.paused;"
                      + "var d={title:t,playing:p};"
                      + "window.AndroidAyaData=JSON.stringify(d);"
                      + "return JSON.stringify(d);"
                      + "})()";

                  WebView webView =
                          bridge.getWebView();

                  if (webView == null) {
                      return;
                  }

                  webView.evaluateJavascript(
                      javascript,
                      value -> {

                          String title =
                              cleanTitle(value);

                          showNotification(
                              title,
                              isPlayingFromValue(value)
                          );
                      }
                  );
              }

              private String cleanTitle(
                      String value
              ) {

                  if (value == null) {
                      return "آية";
                  }

                  value = value
                      .replace("\\\"", "\"")
                      .replace("\"", "")
                      .replace("{title:", "")
                      .replace("}", "");

                  if (
                      value.length() < 2
                  ) {
                      return "آية";
                  }

                  return value;
              }

              private boolean isPlayingFromValue(
                      String value
              ) {

                  if (value == null) {
                      return false;
                  }

                  return value.contains(
                      "\"playing\":true"
                  );
              }

              public void showNotification(
                      String title,
                      boolean playing
              ) {

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.TIRAMISU
                  ) {

                      if (
                          ActivityCompat.checkSelfPermission(
                              this,
                              Manifest.permission.POST_NOTIFICATIONS
                          ) != PackageManager.PERMISSION_GRANTED
                      ) {
                          return;
                      }
                  }

                  Intent previousIntent =
                      new Intent(
                          this,
                          NotificationActionReceiver.class
                      );

                  previousIntent.setAction(
                      NotificationActionReceiver.ACTION_PREVIOUS
                  );

                  Intent playIntent =
                      new Intent(
                          this,
                          NotificationActionReceiver.class
                      );

                  playIntent.setAction(
                      NotificationActionReceiver.ACTION_PLAY_PAUSE
                  );

                  Intent nextIntent =
                      new Intent(
                          this,
                          NotificationActionReceiver.class
                      );

                  nextIntent.setAction(
                      NotificationActionReceiver.ACTION_NEXT
                  );

                  PendingIntent previous =
                      PendingIntentCompat.getBroadcast(
                          this,
                          501,
                          previousIntent,
                          PendingIntentCompat.FLAG_UPDATE_CURRENT |
                          PendingIntentCompat.FLAG_IMMUTABLE,
                          false
                      );

                  PendingIntent play =
                      PendingIntentCompat.getBroadcast(
                          this,
                          502,
                          playIntent,
                          PendingIntentCompat.FLAG_UPDATE_CURRENT |
                          PendingIntentCompat.FLAG_IMMUTABLE,
                          false
                      );

                  PendingIntent next =
                      PendingIntentCompat.getBroadcast(
                          this,
                          503,
                          nextIntent,
                          PendingIntentCompat.FLAG_UPDATE_CURRENT |
                          PendingIntentCompat.FLAG_IMMUTABLE,
                          false
                      );

                  int playIcon =
                      playing
                      ? android.R.drawable.ic_media_pause
                      : android.R.drawable.ic_media_play;

                  String state =
                      playing
                      ? "التلاوة تعمل الآن"
                      : "التلاوة متوقفة";

                  NotificationCompat.Builder builder =
                      new NotificationCompat.Builder(
                          this,
                          CHANNEL_ID
                      )
                      .setSmallIcon(
                          com.aya.alquran.R.mipmap.ic_launcher
                      )
                      .setContentTitle(
                          "آية"
                      )
                      .setContentText(
                          title
                      )
                      .setSubText(
                          state
                      )
                      .setPriority(
                          NotificationCompat.PRIORITY_LOW
                      )
                      .setOngoing(
                          playing
                      )
                      .setOnlyAlertOnce(
                          true
                      )
                      .setShowWhen(false)
                      .addAction(
                          android.R.drawable.ic_media_previous,
                          "السابق",
                          previous
                      )
                      .addAction(
                          playIcon,
                          playing ? "إيقاف" : "تشغيل",
                          play
                      )
                      .addAction(
                          android.R.drawable.ic_media_next,
                          "التالي",
                          next
                      );

                  NotificationManagerCompat
                      .from(this)
                      .notify(
                          NOTIFICATION_ID,
                          builder.build()
                      );

                  notificationVisible = true;
              }

              @Override
              protected void onDestroy() {

                  handler.removeCallbacksAndMessages(
                      null
                  );

                  instance = null;

                  super.onDestroy();
              }
          }
          '''

          main_activity.write_text(
              main_code,
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # NotificationActionReceiver.java
          # --------------------------------------------------------

          receiver_file =
              java_dir / "NotificationActionReceiver.java"

          receiver_code = r'''package com.aya.alquran;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class NotificationActionReceiver
                  extends BroadcastReceiver {

              public static final String ACTION_PREVIOUS =
                      "AYA_PREVIOUS";

              public static final String ACTION_PLAY_PAUSE =
                      "AYA_PLAY_PAUSE";

              public static final String ACTION_NEXT =
                      "AYA_NEXT";

              @Override
              public void onReceive(
                      Context context,
                      Intent intent
              ) {

                  if (intent == null) {
                      return;
                  }

                  String action =
                          intent.getAction();

                  if (
                      ACTION_PREVIOUS.equals(action)
                  ) {

                      openAppAndRun(
                          "previous"
                      );

                  } else if (
                      ACTION_PLAY_PAUSE.equals(action)
                  ) {

                      openAppAndRun(
                          "playpause"
                      );

                  } else if (
                      ACTION_NEXT.equals(action)
                  ) {

                      openAppAndRun(
                          "next"
                      );
                  }
              }

              private void openAppAndRun(
                      String action
              ) {

                  if (
                      MainActivity.instance != null
                  ) {

                      runJavascript(action);

                      return;
                  }

                  Context context =
                          MainActivity.instance;

                  if (context == null) {
                      return;
                  }
              }

              private void runJavascript(
                      String action
              ) {

                  String javascript;

                  if (
                      "playpause".equals(action)
                  ) {

                      javascript =
                          "(function(){"
                          + "var a=document.querySelector('audio');"
                          + "if(!a)return;"
                          + "if(a.paused){a.play();}"
                          + "else{a.pause();}"
                          + "})()";

                  } else if (
                      "next".equals(action)
                  ) {

                      javascript =
                          "(function(){"
                          + "var e=[...document.querySelectorAll('button')].find("
                          + "x=>/التالي|next/i.test(x.innerText||x.getAttribute('aria-label')||''));"
                          + "if(e)e.click();"
                          + "})()";

                  } else {

                      javascript =
                          "(function(){"
                          + "var e=[...document.querySelectorAll('button')].find("
                          + "x=>/السابق|previous|prev/i.test(x.innerText||x.getAttribute('aria-label')||''));"
                          + "if(e)e.click();"
                          + "})()";
                  }

                  MainActivity.executeJavaScript(
                      javascript
                  );
              }
          }
          '''

          receiver_file.write_text(
              receiver_code,
              encoding="utf-8"
          )

          print(
              "Aya media notification system configured successfully."
          )
          PY

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build signed release APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          STORE="${{ github.workspace }}/aya-release.jks"

          if [ ! -f "$STORE" ]; then
            echo "::error::Keystore file not found."
            exit 1
          fi

          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$STORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-android-apk-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
