name: Build Aya Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Android project
        run: |
          mkdir -p android-app
          cd android-app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web files
        run: |
          mkdir -p android-app/www
          rsync -av --exclude='.git' --exclude='.github' --exclude='android-app' ./ android-app/www/

      - name: Initialize Capacitor
        working-directory: android-app
        run: npx cap init "آية" "com.aya.alquran" --web-dir www

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Configure Android app name
        working-directory: android-app
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/src/main/res/values/strings.xml")
          if p.exists():
              text = p.read_text(encoding="utf-8")
              text = text.replace("app_name\">App", "app_name\">آية")
              p.write_text(text, encoding="utf-8")
          print("Android app name configured.")
          PY

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Install Aya app icon
        run: |
          python3 << 'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import shutil

          icon_path = Path("icon.png")
          if not icon_path.exists():
              raise SystemExit("ERROR: icon.png was not found.")

          original = Image.open(icon_path).convert("RGBA")

          base = Path("android-app/android/app/src/main/res")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              target_dir = base / folder
              target_dir.mkdir(parents=True, exist_ok=True)

              resized = original.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(target_dir / "ic_launcher.png", "PNG")
              resized.save(target_dir / "ic_launcher_round.png", "PNG")

              for f in target_dir.glob("ic_launcher*"):
                  if f.name not in ["ic_launcher.png", "ic_launcher_round.png"]:
                      f.unlink(missing_ok=True)

          fg_size = 432
          canvas = Image.new("RGBA", (fg_size, fg_size), (0, 0, 0, 0))

          icon_size = int(fg_size * 0.72)
          icon_resized = original.resize((icon_size, icon_size), Image.Resampling.LANCZOS)

          offset = (fg_size - icon_size) // 2
          canvas.paste(icon_resized, (offset, offset), icon_resized)

          xxx = base / "mipmap-xxxhdpi"
          xxx.mkdir(parents=True, exist_ok=True)
          canvas.save(xxx / "ic_launcher_foreground.png", "PNG")

          bg = Image.new("RGBA", (fg_size, fg_size), (13, 27, 42, 255))
          bg.save(xxx / "ic_launcher_background.png", "PNG")

          anydpi = base / "mipmap-anydpi-v26"
          if anydpi.exists():
              shutil.rmtree(anydpi)
          anydpi.mkdir(parents=True, exist_ok=True)

          xml = '<?xml version="1.0" encoding="utf-8"?>\n'
          xml += '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
          xml += '    <background android:drawable="@mipmap/ic_launcher_background"/>\n'
          xml += '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
          xml += '</adaptive-icon>'

          (anydpi / "ic_launcher.xml").write_text(xml, encoding="utf-8")
          (anydpi / "ic_launcher_round.xml").write_text(xml, encoding="utf-8")

          print("=== Icon files after install ===")
          for p in sorted(base.rglob("ic_launcher*")):
              print(p)
          print("Aya icon improved successfully.")
          PY

      - name: Set versionCode from run number
        id: ver
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"
          echo "versionCode=$CODE" >> $GITHUB_OUTPUT
          echo "versionName=$NAME" >> $GITHUB_OUTPUT
          echo "versionCode=$CODE versionName=$NAME"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::أضف GitHub Secret: KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/aya-release.jks
          ls -la ${{ github.workspace }}/aya-release.jks

      - name: Configure signing + version in Gradle
        env:
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
          STORE_FILE: ${{ github.workspace }}/aya-release.jks
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os, re

          version_code = os.environ.get("VERSION_CODE", "1")
          version_name = os.environ.get("VERSION_NAME", "1.0.0")
          store_file = os.environ["STORE_FILE"]

          gradle = Path("android-app/android/app/build.gradle")
          if not gradle.exists():
              gradle = Path("android-app/android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("build.gradle not found")

          text = gradle.read_text(encoding="utf-8")

          text = re.sub(r"versionCode\s+\d+", "versionCode " + version_code, text)
          text = re.sub(r'versionName\s+"[^"]*"', 'versionName "' + version_name + '"', text)

          if "signingConfigs" not in text:
              signing_block = (
                  "\n    signingConfigs {\n"
                  "        release {\n"
                  '            storeFile file("' + store_file + '")\n'
                  '            storePassword System.getenv("KEYSTORE_PASSWORD")\n'
                  '            keyAlias System.getenv("KEY_ALIAS")\n'
                  '            keyPassword System.getenv("KEY_PASSWORD")\n'
                  "        }\n"
                  "    }\n"
              )
              if "buildTypes" in text:
                  text = text.replace("buildTypes", signing_block + "\n    buildTypes", 1)
              else:
                  text = text.replace("android {", "android {" + signing_block, 1)

          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(
                  r"(release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1,
              )

          gradle.write_text(text, encoding="utf-8")
          print("Gradle updated OK")
          print(gradle.read_text(encoding="utf-8")[:2000])
          PY

      - name: Enable notifications + background audio permissions
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          manifest = Path("android-app/android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          text = manifest.read_text(encoding="utf-8")

          perms = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]

          for p in perms:
              tag = f'<uses-permission android:name="{p}" />'
              if p not in text:
                  text = re.sub(
                      r"(<manifest[^>]*>)",
                      r"\1\n    " + tag,
                      text,
                      count=1,
                  )

          if 'android:launchMode' not in text:
              text = text.replace(
                  "<activity",
                  '<activity android:launchMode="singleTask"',
                  1,
              )

          if "android:usesCleartextTraffic" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )

          manifest.write_text(text, encoding="utf-8")
          print("Manifest permissions updated:")
          print(manifest.read_text(encoding="utf-8")[:1800])
          PY

      - name: Patch native Android (notifications + background audio)
        run: |
          python3 << 'ENDPATCH'
          from pathlib import Path
          import re, json

          candidates = list(Path("android-app/android").rglob("MainActivity.java"))
          candidates += list(Path("android-app/android").rglob("MainActivity.kt"))

          for main in candidates:
              src = main.read_text(encoding="utf-8")
              if "AYA_BG_AUDIO" in src:
                  print("already patched", main)
                  continue

              if main.suffix == ".java":
                  if "POST_NOTIFICATIONS" not in src and "super.onCreate" in src:
                      block = """
                  // AYA_BG_AUDIO
                  try {
                      if (android.os.Build.VERSION.SDK_INT >= 33) {
                          if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS)
                                  != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(
                                  new String[]{android.Manifest.permission.POST_NOTIFICATIONS},
                                  1001
                              );
                          }
                      }
                  } catch (Exception ignored) { }
          """
                      src = src.replace(
                          "super.onCreate(savedInstanceState);",
                          "super.onCreate(savedInstanceState);" + block,
                          1,
                      )

                  pause_method = """
              @Override
              public void onPause() {
                  // AYA_BG_AUDIO: keep audio in background
              }
          """
                  if re.search(r"void\s+onPause\s*\(", src):
                      src = re.sub(
                          r"@Override\s+public\s+void\s+onPause\s*\(\s*\)\s*\{.*?\n\s*\}",
                          pause_method.strip(),
                          src,
                          count=1,
                          flags=re.S,
                      )
                  else:
                      idx = src.rfind("}")
                      if idx != -1:
                          src = src[:idx] + "\n" + pause_method + "\n" + src[idx:]

                  main.write_text(src, encoding="utf-8")
                  print("Patched", main)

          manifest = Path("android-app/android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text(encoding="utf-8")
              perms = [
                  "android.permission.POST_NOTIFICATIONS",
                  "android.permission.FOREGROUND_SERVICE",
                  "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
                  "android.permission.WAKE_LOCK",
                  "android.permission.MODIFY_AUDIO_SETTINGS",
              ]
              for p in perms:
                  if p not in text:
                      tag = f'    <uses-permission android:name="{p}" />\n'
                      text = re.sub(r"(<manifest[^>]*>)", r"\1\n" + tag, text, count=1)

              if "android:usesCleartextTraffic" not in text:
                  text = text.replace(
                      "<application",
                      '<application android:usesCleartextTraffic="true"',
                      1,
                  )
              manifest.write_text(text, encoding="utf-8")
              print("Manifest OK")

          conf = Path("android-app/capacitor.config.json")
          if conf.exists():
              data = json.loads(conf.read_text(encoding="utf-8"))
              data.setdefault("server", {})
              data["server"]["androidScheme"] = "https"
              conf.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
              print("capacitor config OK")

          print("patch_android_bg done")
          ENDPATCH

      - name: Build release APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-android-apk-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
