name: Build Aya Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Android project
        run: |
          mkdir android-app
          cd android-app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web files
        run: |
          mkdir -p android-app/www
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android-app' \
            ./ android-app/www/

      - name: Initialize Capacitor
        working-directory: android-app
        run: |
          npx cap init "آيات" "com.aya.alquran" --web-dir www

      - name: Create Android project
        working-directory: android-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-android-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
