name: Build Aya Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Android project
        run: |
          mkdir -p android-app
          cd android-app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/geolocation@7

      - name: Prepare web files
        run: |
          mkdir -p android-app/www
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android-app' \
            ./ android-app/www/

      - name: Initialize Capacitor
        working-directory: android-app
        run: npx cap init "آية" "com.aya.alquran" --web-dir www

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Configure Android app name
        working-directory: android-app
        run: |
          python3 << 'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/values/strings.xml")

          if p.exists():
              text = p.read_text(encoding="utf-8")

              text = text.replace(
                  "app_name\">App",
                  "app_name\">آية"
              )

              p.write_text(text, encoding="utf-8")

          print("Android app name configured.")
          PY

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Add prayer times and Qibla support
        run: |
          python3 << 'PY'
          from pathlib import Path

          # The Geolocation Capacitor plugin is already installed above. This step
          # only adds a self-contained UI/logic layer to the existing web app;
          # it does not replace the existing reader, player, notifications, icon,
          # signing, or version configuration.
          index = Path("android-app/www/index.html")
          if not index.exists():
              raise SystemExit("ERROR: android-app/www/index.html was not found.")

          text = index.read_text(encoding="utf-8")
          marker = "</body>"
          if marker not in text:
              raise SystemExit("ERROR: </body> was not found in index.html.")
          if "aya-prayer-qibla-v1" in text:
              print("Prayer/Qibla support already present.")
              raise SystemExit(0)

          script = r"""
          <style id="aya-prayer-qibla-v1">
            #aya-prayer-qibla {
              position: fixed; right: 14px; bottom: 14px; z-index: 2147483000;
              width: min(360px, calc(100vw - 28px)); box-sizing: border-box;
              background: rgba(255,255,255,.98); color:#17202a;
              border:1px solid rgba(0,0,0,.10); border-radius:16px;
              box-shadow:0 8px 28px rgba(0,0,0,.18); padding:14px;
              font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
              direction:rtl; text-align:right;
            }
            #aya-prayer-qibla button {
              border:0; border-radius:10px; padding:9px 12px; cursor:pointer;
              background:#0d6efd; color:#fff; font-size:14px;
            }
            #aya-pq-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
            #aya-pq-title { font-weight:700; font-size:16px; }
            #aya-pq-close { background:transparent !important; color:#555 !important; padding:2px 6px !important; }
            #aya-pq-status { margin:8px 0; font-size:13px; line-height:1.5; }
            #aya-pq-times { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
            .aya-pq-time { background:#f3f5f7; border-radius:9px; padding:7px 8px; display:flex; justify-content:space-between; gap:8px; }
            #aya-pq-qibla { margin-top:9px; font-weight:600; }
          </style>
          <div id="aya-prayer-qibla" hidden>
            <div id="aya-pq-head">
              <div id="aya-pq-title">مواقيت الصلاة والقبلة</div>
              <button id="aya-pq-close" aria-label="إغلاق">✕</button>
            </div>
            <div id="aya-pq-status">جارٍ طلب الموقع…</div>
            <div id="aya-pq-times"></div>
            <div id="aya-pq-qibla"></div>
          </div>
          <button id="aya-pq-open"
                  style="position:fixed;right:14px;bottom:14px;z-index:2147482999;border:0;border-radius:999px;padding:11px 14px;background:#0d6efd;color:#fff;font-size:14px;box-shadow:0 5px 18px rgba(0,0,0,.2);direction:rtl;">
            🕌 المواقيت والقبلة
          </button>
          <script>
          (function () {
            "use strict";
            if (window.__ayaPrayerQiblaV1) return;
            window.__ayaPrayerQiblaV1 = true;

            const panel = document.getElementById("aya-prayer-qibla");
            const open = document.getElementById("aya-pq-open");
            const close = document.getElementById("aya-pq-close");
            const status = document.getElementById("aya-pq-status");
            const timesBox = document.getElementById("aya-pq-times");
            const qiblaBox = document.getElementById("aya-pq-qibla");

            open.onclick = () => {
              panel.hidden = false;
              open.hidden = true;
              if (!window.__ayaPrayerLoaded) locate();
            };
            close.onclick = () => {
              panel.hidden = true;
              open.hidden = false;
            };

            function rad(x) { return x * Math.PI / 180; }
            function deg(x) { return x * 180 / Math.PI; }
            function fix(x) { return (x % 360 + 360) % 360; }

            // Solar/prayer calculation: local solar noon, sunrise/sunset,
            // Fajr/Isha at 18 degrees, and Asr shadow factor 1.
            function solarDeclination(day) {
              const g = 2 * Math.PI / 365 * (day - 1);
              return 0.006918 - 0.399912*Math.cos(g) + 0.070257*Math.sin(g)
                   - 0.006758*Math.cos(2*g) + 0.000907*Math.sin(2*g)
                   - 0.002697*Math.cos(3*g) + 0.00148*Math.sin(3*g);
            }

            function equationOfTime(day) {
              const g = 2 * Math.PI / 365 * (day - 1);
              return 229.18 * (0.000075 + 0.001868*Math.cos(g) - 0.032077*Math.sin(g)
                - 0.014615*Math.cos(2*g) - 0.040849*Math.sin(2*g));
            }

            function hourAngle(lat, decl, altitude) {
              const c = (Math.sin(rad(altitude)) - Math.sin(rad(lat))*Math.sin(decl))
                      / (Math.cos(rad(lat))*Math.cos(decl));
              if (c <= -1) return 180;
              if (c >= 1) return null;
              return deg(Math.acos(c));
            }

            function minutesToTime(mins) {
              if (mins == null || !isFinite(mins)) return "—";
              mins = ((mins % 1440) + 1440) % 1440;
              const h = Math.floor(mins / 60);
              const m = Math.round(mins % 60);
              return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
            }

            function calculatePrayerTimes(lat, lon, date) {
              const start = new Date(date.getFullYear(), 0, 0);
              const day = Math.floor((date - start) / 86400000);
              const decl = solarDeclination(day);
              const eot = equationOfTime(day);

              // Device-local timezone offset in minutes east of UTC.
              const tz = -date.getTimezoneOffset();
              const solarNoon = 720 - 4*lon - eot + tz;

              const sunriseHA = hourAngle(lat, decl, -0.833);
              const fajrHA = hourAngle(lat, decl, -18);
              const ishaHA = hourAngle(lat, decl, -18);

              const asrAltitude = -deg(Math.atan(1 / (1 + Math.tan(Math.abs(rad(lat - deg(decl)))))));
              const asrHA = hourAngle(lat, decl, asrAltitude);

              return {
                الفجر: fajrHA == null ? null : solarNoon - 4*fajrHA,
                الشروق: sunriseHA == null ? null : solarNoon - 4*sunriseHA,
                الظهر: solarNoon,
                العصر: asrHA == null ? null : solarNoon + 4*asrHA,
                المغرب: sunriseHA == null ? null : solarNoon + 4*sunriseHA,
                العشاء: ishaHA == null ? null : solarNoon + 4*ishaHA
              };
            }

            function qiblaBearing(lat, lon) {
              // Kaaba: 21.422487 N, 39.826206 E.
              const kaabaLat = rad(21.422487);
              const dLon = rad(39.826206 - lon);
              const y = Math.sin(dLon);
              const x = Math.cos(rad(lat))*Math.tan(kaabaLat) - Math.sin(rad(lat))*Math.cos(dLon);
              return fix(deg(Math.atan2(y, x)));
            }

            async function getPosition() {
              const cap = window.Capacitor;
              const geo = cap && cap.Plugins && cap.Plugins.Geolocation;
              if (geo && typeof geo.getCurrentPosition === "function") {
                return geo.getCurrentPosition({
                  enableHighAccuracy: false,
                  timeout: 15000,
                  maximumAge: 300000
                });
              }
              return new Promise((resolve, reject) => {
                if (!navigator.geolocation) return reject(new Error("geolocation-unavailable"));
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                  enableHighAccuracy:false, timeout:15000, maximumAge:300000
                });
              });
            }

            function render(pos) {
              const lat = Number(pos.coords.latitude);
              const lon = Number(pos.coords.longitude);
              if (!isFinite(lat) || !isFinite(lon)) throw new Error("invalid-location");

              const now = new Date();
              const times = calculatePrayerTimes(lat, lon, now);
              const names = ["الفجر","الشروق","الظهر","العصر","المغرب","العشاء"];

              status.textContent = "تم استخدام موقع جهازك لحساب المواقيت والقبلة.";
              timesBox.innerHTML = names.map(n =>
                '<div class="aya-pq-time"><span>' + n + '</span><strong>' +
                minutesToTime(times[n]) + '</strong></div>'
              ).join("");

              const bearing = qiblaBearing(lat, lon);
              qiblaBox.textContent =
                "اتجاه القبلة: " + Math.round(bearing) + "° من الشمال باتجاه عقارب الساعة.";
              window.__ayaPrayerLoaded = true;
            }

            async function locate() {
              status.textContent = "جارٍ طلب إذن الموقع…";
              timesBox.innerHTML = "";
              qiblaBox.textContent = "";
              try {
                const pos = await getPosition();
                render(pos);
              } catch (e) {
                status.textContent =
                  "تعذر الوصول إلى الموقع. فعّل إذن الموقع للتطبيق ثم أعد المحاولة.";
              }
            }

            // Request only when the user opens the feature, not on app startup.
            window.__ayaRequestPrayerLocation = locate;
          })();
          </script>
          """

          text = text.replace(marker, script + "\n" + marker, 1)
          index.write_text(text, encoding="utf-8")
          print("Prayer times + Qibla UI injected without replacing existing app features.")
          PY

      - name: Install Aya app icon
        run: |
          python3 << 'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          icon_path = Path("icon.png")

          if not icon_path.exists():
              raise SystemExit("ERROR: icon.png was not found.")

          original = Image.open(icon_path).convert("RGBA")

          base = Path(
              "android-app/android/app/src/main/res"
          )

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              target_dir = base / folder
              target_dir.mkdir(parents=True, exist_ok=True)

              resized = original.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              resized.save(
                  target_dir / "ic_launcher.png",
                  "PNG"
              )

              resized.save(
                  target_dir / "ic_launcher_round.png",
                  "PNG"
              )

              for f in target_dir.glob("ic_launcher*"):
                  if f.name not in [
                      "ic_launcher.png",
                      "ic_launcher_round.png"
                  ]:
                      f.unlink(missing_ok=True)

          fg_size = 432

          canvas = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (0, 0, 0, 0)
          )

          icon_size = int(fg_size * 0.72)

          icon_resized = original.resize(
              (icon_size, icon_size),
              Image.Resampling.LANCZOS
          )

          offset = (
              (fg_size - icon_size) // 2
          )

          canvas.paste(
              icon_resized,
              (offset, offset),
              icon_resized
          )

          xxx = base / "mipmap-xxxhdpi"

          xxx.mkdir(
              parents=True,
              exist_ok=True
          )

          canvas.save(
              xxx / "ic_launcher_foreground.png",
              "PNG"
          )

          bg = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (13, 27, 42, 255)
          )

          bg.save(
              xxx / "ic_launcher_background.png",
              "PNG"
          )

          anydpi = base / "mipmap-anydpi-v26"

          if anydpi.exists():
              shutil.rmtree(anydpi)

          anydpi.mkdir(
              parents=True,
              exist_ok=True
          )

          xml = (
              '<?xml version="1.0" encoding="utf-8"?>'
              '<adaptive-icon '
              'xmlns:android='
              '"http://schemas.android.com/apk/res/android">'
              '<background '
              'android:drawable='
              '"@mipmap/ic_launcher_background"/>'
              '<foreground '
              'android:drawable='
              '"@mipmap/ic_launcher_foreground"/>'
              '</adaptive-icon>'
          )

          (
              anydpi / "ic_launcher.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          (
              anydpi / "ic_launcher_round.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          print("Aya icon improved successfully.")
          PY

      - name: Set versionCode from run number
        id: ver
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"

          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # KEYSTORE
      # ============================================================

      - name: Decode and verify keystore
        env:
          K1: ${{ secrets.KS1 }}
          K2: ${{ secrets.KS2 }}
          K3: ${{ secrets.KS3 }}
          K4: ${{ secrets.KS4 }}
          K5: ${{ secrets.KS5 }}
          K6: ${{ secrets.KS6 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 << 'PY'
          import os, re, base64, pathlib, subprocess, sys

          parts = []
          for i in range(1, 7):
              v = os.environ.get(f"K{i}") or ""
              print(f"KS{i} length = {len(v)}")
              if not v:
                  print(f"::error::السر KS{i} ناقص")
                  sys.exit(1)
              parts.append(v)

          b64 = "".join(parts)
          # إزالة أي محارف غير Base64 (مسافات، أسطر، إلخ)
          b64 = re.sub(r"[^A-Za-z0-9+/=]", "", b64)
          # إكمال الحشو إن نقص
          pad = (-len(b64)) % 4
          if pad:
              b64 += "=" * pad

          print(f"Total base64 length = {len(b64)}")

          try:
              raw = base64.b64decode(b64, validate=False)
          except Exception as e:
              print(f"::error::فشل فك Base64: {e}")
              sys.exit(1)

          out = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "aya-release.jks"
          out.write_bytes(raw)
          print(f"Keystore bytes = {len(raw)}")
          if len(raw) < 100:
              print("::error::ملف keystore صغير جداً — الأجزاء ناقصة")
              sys.exit(1)

          pw = os.environ.get("KEYSTORE_PASSWORD") or ""
          alias = os.environ.get("KEY_ALIAS") or ""
          r = subprocess.run(
              ["keytool", "-list", "-keystore", str(out), "-storepass", pw, "-alias", alias],
              capture_output=True,
              text=True,
          )
          print(r.stdout)
          if r.returncode != 0:
              print(r.stderr)
              print("::error::keytool فشل — تحقق من KEYSTORE_PASSWORD و KEY_ALIAS")
              sys.exit(1)
          print("Keystore verified successfully.")
          PY

      # ============================================================
      # VERSION
      # ============================================================

      - name: Set version in Gradle
        env:
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os
          import re

          vc = os.environ["VERSION_CODE"]
          vn = os.environ["VERSION_NAME"]

          gradle = Path(
              "android-app/android/app/build.gradle"
          )

          if not gradle.exists():
              gradle = Path(
                  "android-app/android/app/build.gradle.kts"
              )

          if not gradle.exists():
              raise SystemExit(
                  "ERROR: Gradle file not found."
              )

          text = gradle.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r"versionCode\s+\d+",
              "versionCode " + vc,
              text
          )

          text = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName "' + vn + '"',
              text
          )

          gradle.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "version set",
              vc,
              vn
          )
          PY

      # ============================================================
      # NOTIFICATIONS — إشعار التلاوة (قائمة التشغيل)
      # ============================================================

      - name: Configure Android notifications
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re, base64

          android_root = Path("android-app/android/app/src/main")
          manifest = android_root / "AndroidManifest.xml"
          text = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK",
          ]
          for permission in permissions:
              if permission not in text:
                  text = re.sub(
                      r"(<manifest[^>]*>)",
                      r'\1\n    <uses-permission android:name="%s" />' % permission,
                      text,
                      count=1,
                  )

          if "android:usesCleartextTraffic" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )

          manifest.write_text(text, encoding="utf-8")

          java_dir = android_root / "java/com/aya/alquran"
          java_dir.mkdir(parents=True, exist_ok=True)
          activity = java_dir / "MainActivity.java"

          activity_b64 = ""
          activity.write_bytes(base64.b64decode(activity_b64))
          service_b64 = ""
          (java_dir / "AyaMediaService.java").write_bytes(base64.b64decode(service_b64))

          mtxt = manifest.read_text(encoding="utf-8")
          if "AyaMediaService" not in mtxt:
              svc_xml = (
                  "    <service\n"
                  "        android:name=\".AyaMediaService\"\n"
                  "        android:exported=\"false\"\n"
                  "        android:foregroundServiceType=\"mediaPlayback\" />\n"
              )
              mtxt = mtxt.replace("</application>", svc_xml + "    </application>", 1)
              manifest.write_text(mtxt, encoding="utf-8")

          mtxt = manifest.read_text(encoding="utf-8")
          if "android:launchMode" not in mtxt:
              mtxt = mtxt.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity"\n            android:launchMode="singleTop"',
                  1,
              )
              manifest.write_text(mtxt, encoding="utf-8")

          print("Android media notification MainActivity + Service configured.")

          update_b64 = ""
          recv_b64 = ""
          (java_dir / "AyaUpdateHelper.java").write_bytes(base64.b64decode(update_b64))
          (java_dir / "AyaUpdateDownloadReceiver.java").write_bytes(base64.b64decode(recv_b64))

          mtxt = manifest.read_text(encoding="utf-8")
          if "AyaUpdateDownloadReceiver" not in mtxt:
              extra_xml = (
                  '    <receiver android:name=".AyaUpdateDownloadReceiver" android:exported="false">'
                  '\n      <intent-filter>'
                  '\n        <action android:name="com.aya.alquran.START_UPDATE_DOWNLOAD" />'
                  '\n      </intent-filter>'
                  '\n    </receiver>\n'
                  '    <provider\n'
                  '        android:name="androidx.core.content.FileProvider"\n'
                  '        android:authorities="${applicationId}.fileprovider"\n'
                  '        android:exported="false"\n'
                  '        android:grantUriPermissions="true">'
                  '\n      <meta-data\n'
                  '          android:name="android.support.FILE_PROVIDER_PATHS"\n'
                  '          android:resource="@xml/file_paths" />\n'
                  '    </provider>\n'
              )
              mtxt = mtxt.replace("</application>", extra_xml + "    </application>", 1)
              for perm in [
                  "android.permission.REQUEST_INSTALL_PACKAGES",
                  "android.permission.DOWNLOAD_WITHOUT_NOTIFICATION",
              ]:
                  tag = f'<uses-permission android:name="{perm}" />'
                  if perm not in mtxt:
                      mtxt = mtxt.replace("<application", tag + "\n    <application", 1)
              manifest.write_text(mtxt, encoding="utf-8")

          # file_paths.xml
          res_xml = Path("android-app/android/app/src/main/res/xml")
          res_xml.mkdir(parents=True, exist_ok=True)
          (res_xml / "file_paths.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<paths>\n'
              '  <external-files-path name="downloads" path="Download/" />\n'
              '  <files-path name="files" path="." />\n'
              '</paths>\n',
              encoding="utf-8",
          )
          print("Update helper + receiver configured.")

          PY


      - name: Add media library for system media panel
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          gradle = Path("android-app/android/app/build.gradle")
          if not gradle.exists():
              gradle = Path("android-app/android/app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")
          dep = 'implementation "androidx.media:media:1.7.0"'
          if "androidx.media:media" not in text:
              if "dependencies {" in text:
                  text = text.replace("dependencies {", "dependencies {\n    " + dep, 1)
              elif "dependencies {" in text.replace("'", '"'):
                  pass
              else:
                  # kts
                  dep_kts = 'implementation("androidx.media:media:1.7.0")'
                  text = text.replace("dependencies {", "dependencies {\n    " + dep_kts, 1)
              gradle.write_text(text, encoding="utf-8")
              print("media dependency added")
          else:
              print("media dependency already present")
          PY

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build signed release APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          STORE="${{ github.workspace }}/aya-release.jks"

          if [ ! -f "$STORE" ]; then
            echo "::error::Keystore file not found."
            exit 1
          fi

          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$STORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-android-apk-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
