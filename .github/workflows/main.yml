name: Build Aya Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # DOWNLOAD PROJECT
      # ============================================================

      - name: Download project
        uses: actions/checkout@v4

      # ============================================================
      # NODE
      # ============================================================

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # CREATE CAPACITOR PROJECT
      # ============================================================

      - name: Create Android project
        run: |
          set -e

          mkdir -p android-app

          cd android-app

          npm init -y

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

      # ============================================================
      # PREPARE WEB FILES
      # ============================================================

      - name: Prepare web files
        run: |
          set -e

          mkdir -p android-app/www

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android-app' \
            ./ android-app/www/

      # ============================================================
      # INITIALIZE CAPACITOR
      # ============================================================

      - name: Initialize Capacitor
        working-directory: android-app
        run: |
          npx cap init \
            "آية" \
            "com.aya.alquran" \
            --web-dir www

      # ============================================================
      # ADD ANDROID
      # ============================================================

      - name: Add Android platform
        working-directory: android-app
        run: |
          npx cap add android

      # ============================================================
      # CONFIGURE APP NAME
      # ============================================================

      - name: Configure Android app name
        working-directory: android-app
        run: |
          python3 << 'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          if p.exists():

              text = p.read_text(
                  encoding="utf-8"
              )

              text = text.replace(
                  "app_name\">App",
                  "app_name\">آية"
              )

              p.write_text(
                  text,
                  encoding="utf-8"
              )

          print(
              "Android app name configured."
          )
          PY

      # ============================================================
      # PILLOW
      # ============================================================

      - name: Install Pillow
        run: |
          set -e

          python3 -m pip install --upgrade pip

          python3 -m pip install pillow

      # ============================================================
      # SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        working-directory: android-app
        run: |
          npx cap sync android

      # ============================================================
      # INSTALL AYA ICON
      # ============================================================

      - name: Install Aya app icon
        run: |
          python3 << 'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          icon_path = Path("icon.png")

          if not icon_path.exists():
              raise SystemExit(
                  "ERROR: icon.png was not found."
              )

          original = Image.open(
              icon_path
          ).convert("RGBA")

          base = Path(
              "android-app/android/app/src/main/res"
          )

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():

              target_dir = (
                  base / folder
              )

              target_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              resized = original.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              resized.save(
                  target_dir / "ic_launcher.png",
                  "PNG"
              )

              resized.save(
                  target_dir / "ic_launcher_round.png",
                  "PNG"
              )

              for f in target_dir.glob(
                  "ic_launcher*"
              ):

                  if f.name not in [
                      "ic_launcher.png",
                      "ic_launcher_round.png"
                  ]:

                      f.unlink(
                          missing_ok=True
                      )

          # --------------------------------------------------------
          # ADAPTIVE ICON
          # --------------------------------------------------------

          fg_size = 432

          canvas = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (0, 0, 0, 0)
          )

          icon_size = int(
              fg_size * 0.72
          )

          icon_resized = original.resize(
              (icon_size, icon_size),
              Image.Resampling.LANCZOS
          )

          offset = (
              (fg_size - icon_size) // 2
          )

          canvas.paste(
              icon_resized,
              (offset, offset),
              icon_resized
          )

          xxx = (
              base / "mipmap-xxxhdpi"
          )

          xxx.mkdir(
              parents=True,
              exist_ok=True
          )

          canvas.save(
              xxx / "ic_launcher_foreground.png",
              "PNG"
          )

          bg = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (13, 27, 42, 255)
          )

          bg.save(
              xxx / "ic_launcher_background.png",
              "PNG"
          )

          anydpi = (
              base / "mipmap-anydpi-v26"
          )

          if anydpi.exists():
              shutil.rmtree(anydpi)

          anydpi.mkdir(
              parents=True,
              exist_ok=True
          )

          xml = (
              '<?xml version="1.0" encoding="utf-8"?>'
              '<adaptive-icon '
              'xmlns:android='
              '"http://schemas.android.com/apk/res/android">'
              '<background '
              'android:drawable='
              '"@mipmap/ic_launcher_background"/>'
              '<foreground '
              'android:drawable='
              '"@mipmap/ic_launcher_foreground"/>'
              '</adaptive-icon>'
          )

          (
              anydpi / "ic_launcher.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          (
              anydpi / "ic_launcher_round.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          print(
              "Aya icon installed successfully."
          )
          PY

      # ============================================================
      # VERSION
      # ============================================================

      - name: Set versionCode from run number
        id: ver
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"

          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # KEYSTORE
      # ============================================================

      - name: Decode and verify keystore
        env:
          K1: ${{ secrets.KS1 }}
          K2: ${{ secrets.KS2 }}
          K3: ${{ secrets.KS3 }}
          K4: ${{ secrets.KS4 }}
          K5: ${{ secrets.KS5 }}
          K6: ${{ secrets.KS6 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          echo "Checking keystore parts..."

          for i in 1 2 3 4 5 6; do

            eval "v=\$K$i"

            if [ -z "$v" ]; then

              echo "::error::السر KS$i ناقص"

              exit 1

            fi

            echo "KS$i exists."

          done

          B64="${K1}${K2}${K3}${K4}${K5}${K6}"

          B64="$(
            printf '%s' "$B64" |
            tr -d '[:space:]'
          )"

          echo "Checking Base64..."

          if ! printf '%s' "$B64" |
              base64 --decode > /dev/null 2>&1
          then

              echo "::error::KS1-KS6 لا تحتوي على Base64 صالح"

              exit 1

          fi

          echo "Base64 is valid."

          printf '%s' "$B64" |
            base64 --decode \
            > "${{ github.workspace }}/aya-release.jks"

          if [
            ! -s "${{ github.workspace }}/aya-release.jks"
          ]; then

            echo "::error::ملف keystore فارغ"

            exit 1

          fi

          echo "Keystore file created."

          ls -lh \
            "${{ github.workspace }}/aya-release.jks"

          keytool -list \
            -keystore "${{ github.workspace }}/aya-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Keystore verified successfully."

      # ============================================================
      # SET VERSION IN GRADLE
      # ============================================================

      - name: Set version in Gradle
        env:
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os
          import re

          vc = os.environ[
              "VERSION_CODE"
          ]

          vn = os.environ[
              "VERSION_NAME"
          ]

          gradle = Path(
              "android-app/android/app/build.gradle"
          )

          if not gradle.exists():

              gradle = Path(
                  "android-app/android/app/build.gradle.kts"
              )

          if not gradle.exists():

              raise SystemExit(
                  "ERROR: Gradle file not found."
              )

          text = gradle.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r"versionCode\s+\d+",
              "versionCode " + vc,
              text
          )

          text = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName "' + vn + '"',
              text
          )

          gradle.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "version set",
              vc,
              vn
          )
          PY

      # ============================================================
      # NOTIFICATIONS
      # ============================================================

      - name: Configure Android notifications
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          android_root = Path(
              "android-app/android/app/src/main"
          )

          manifest = (
              android_root /
              "AndroidManifest.xml"
          )

          text = manifest.read_text(
              encoding="utf-8"
          )

          permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK",
          ]

          for permission in permissions:

              if permission not in text:

                  text = re.sub(
                      r"(<manifest[^>]*>)",
                      r'\1\n    <uses-permission android:name="%s" />'
                      % permission,
                      text,
                      count=1
                  )

          if (
              "android:usesCleartextTraffic"
              not in text
          ):

              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # JAVA DIRECTORY
          # --------------------------------------------------------

          java_dir = (
              android_root /
              "java/com/aya/alquran"
          )

          java_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          # --------------------------------------------------------
          # MAIN ACTIVITY
          # --------------------------------------------------------

          activity = (
              java_dir /
              "MainActivity.java"
          )

          activity_code = r'''package com.aya.alquran;

import android.Manifest;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.content.pm.PackageManager;
import android.os.Build;
import android.os.Bundle;

import androidx.core.app.ActivityCompat;
import androidx.core.app.NotificationCompat;
import androidx.core.app.NotificationManagerCompat;

import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {

    private static final String CHANNEL_ID =
            "aya_notifications";

    private static final int NOTIFICATION_ID =
            1001;

    private static final int REQUEST_NOTIFICATION_PERMISSION =
            2001;

    @Override
    public void onCreate(Bundle savedInstanceState) {

        super.onCreate(savedInstanceState);

        createNotificationChannel();

        requestNotificationPermission();
    }

    private void requestNotificationPermission() {

        if (
            Build.VERSION.SDK_INT >=
            Build.VERSION_CODES.TIRAMISU
        ) {

            if (
                ActivityCompat.checkSelfPermission(
                    this,
                    Manifest.permission.POST_NOTIFICATIONS
                ) != PackageManager.PERMISSION_GRANTED
            ) {

                ActivityCompat.requestPermissions(
                    this,
                    new String[]{
                        Manifest.permission.POST_NOTIFICATIONS
                    },
                    REQUEST_NOTIFICATION_PERMISSION
                );

            } else {

                showAyaNotification();
            }

        } else {

            showAyaNotification();
        }
    }

    @Override
    public void onRequestPermissionsResult(
            int requestCode,
            String[] permissions,
            int[] grantResults
    ) {

        super.onRequestPermissionsResult(
                requestCode,
                permissions,
                grantResults
        );

        if (
            requestCode ==
            REQUEST_NOTIFICATION_PERMISSION
        ) {

            if (
                grantResults.length > 0 &&
                grantResults[0] ==
                PackageManager.PERMISSION_GRANTED
            ) {

                showAyaNotification();
            }
        }
    }

    private void createNotificationChannel() {

        if (
            Build.VERSION.SDK_INT >=
            Build.VERSION_CODES.O
        ) {

            NotificationChannel channel =
                    new NotificationChannel(
                            CHANNEL_ID,
                            "إشعارات آية",
                            NotificationManager.IMPORTANCE_LOW
                    );

            channel.setDescription(
                    "إشعارات تطبيق آية"
            );

            channel.setShowBadge(false);

            NotificationManager manager =
                    getSystemService(
                            NotificationManager.class
                    );

            if (manager != null) {

                manager.createNotificationChannel(
                        channel
                );
            }
        }
    }

    private void showAyaNotification() {

        if (
            Build.VERSION.SDK_INT >=
            Build.VERSION_CODES.TIRAMISU
        ) {

            if (
                ActivityCompat.checkSelfPermission(
                    this,
                    Manifest.permission.POST_NOTIFICATIONS
                ) != PackageManager.PERMISSION_GRANTED
            ) {

                return;
            }
        }

        NotificationCompat.Builder builder =
                new NotificationCompat.Builder(
                        this,
                        CHANNEL_ID
                )
                .setSmallIcon(
                        com.aya.alquran.R.mipmap.ic_launcher
                )
                .setContentTitle(
                        "آية"
                )
                .setContentText(
                        "تطبيق آية يعمل الآن"
                )
                .setPriority(
                        NotificationCompat.PRIORITY_LOW
                )
                .setCategory(
                        NotificationCompat.CATEGORY_SERVICE
                )
                .setOnlyAlertOnce(true)
                .setShowWhen(false)
                .setOngoing(false)
                .setAutoCancel(false);

        NotificationManagerCompat
                .from(this)
                .notify(
                        NOTIFICATION_ID,
                        builder.build()
                );
    }
}
'''

          activity.write_text(
              activity_code,
              encoding="utf-8"
          )

          print(
              "Android notification system configured successfully."
          )
          PY

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build signed release APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          STORE="${{ github.workspace }}/aya-release.jks"

          if [ ! -f "$STORE" ]; then

            echo "::error::Keystore file not found."

            exit 1

          fi

          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$STORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-android-apk-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
