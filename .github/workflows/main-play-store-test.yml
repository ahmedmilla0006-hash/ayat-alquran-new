      - name: Inject app version into all web assets
        env:
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          set -e
          python3 <<'PY_VERSION'
          from pathlib import Path
          import os

          version = os.environ["VERSION_NAME"]
          display_version = version + " – تجريبي"
          roots = [
              Path("android-app/www"),
              Path("android-app/android/app/src/main/assets/public"),
          ]
          text_suffixes = {".html", ".js", ".css", ".json", ".webmanifest", ".txt", ".xml"}
          changed = []
          unresolved = []

          for root in roots:
              if not root.exists():
                  raise SystemExit(f"ERROR: web assets directory not found: {root}")
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in text_suffixes:
                      continue
                  try:
                      content = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if "__AYA_BUILD_VERSION__" in content:
                      path.write_text(content.replace("__AYA_BUILD_VERSION__", display_version), encoding="utf-8")
                      changed.append(str(path))

          # Verify every packaged web asset, not only index.html.
          packaged = roots[1]
          for path in packaged.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if "__AYA_BUILD_VERSION__" in content:
                  unresolved.append(str(path))

          if unresolved:
              raise SystemExit("ERROR: unresolved version placeholder in: " + ", ".join(unresolved))

          index = packaged / "index.html"
          if not index.exists() or display_version not in index.read_text(encoding="utf-8"):
              raise SystemExit("ERROR: experimental display version not found in packaged index.html")

          print(f"Injected display version {display_version}; changed files: {changed}")
          print("Verified no raw version placeholder remains in packaged web assets.")
          PY_VERSION
          if grep -q "update.json\|download-apk\|updatesOverlay" android-app/android/app/src/main/assets/public/index.html; then
            echo "::error::In-app updater residue remains in packaged web assets"
            exit 1
          fi
          echo "Verified: packaged assets have no in-app updater."

      - name: Set experimental Android display name after sync
        run: |
          python3 <<'PY_APP_NAME'
          from pathlib import Path
          import re

          res = Path("android-app/android/app/src/main/res")
          manifest = Path("android-app/android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("ERROR: AndroidManifest.xml not found")

          # Update app_name in every localized strings resource so a device
          # language cannot silently restore the original app name.
          found = 0
          for strings in res.glob("values*/strings.xml"):
              content = strings.read_text(encoding="utf-8")
              updated, count = re.subn(
                  r'(<string\s+name=["\'](?:app_name|title_activity_main)["\']\s*>).*?(</string>)',
                  r'\1آية تجريبي\2',
                  content,
                  flags=re.DOTALL,
              )
              if count:
                  strings.write_text(updated, encoding="utf-8")
                  found += count

          # Set the launcher label explicitly on the application element.
          xml = manifest.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(<application\b[^>]*\bandroid:label=)["\'][^"\']*["\']',
              r'\1"آية تجريبي"',
              xml,
              count=1,
          )
          if count == 0:
              updated, count = re.subn(
                  r'<application\b',
                  '<application android:label="آية تجريبي"',
                  xml,
                  count=1,
              )
          if count != 1:
              raise SystemExit("ERROR: Could not set Android application label")
          manifest.write_text(updated, encoding="utf-8")

          final_xml = manifest.read_text(encoding="utf-8")
          if 'android:label="آية تجريبي"' not in final_xml:
              raise SystemExit("ERROR: Launcher label verification failed")
          print(f"Verified launcher label: آية تجريبي; localized string entries updated: {found}")
          PY_APP_NAME

      - name: Build signed release APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          STORE="${{ github.workspace }}/aya-release.jks"

          if [ ! -f "$STORE" ]; then
            echo "::error::Keystore file not found."
            exit 1
          fi

          # بناء APK (تثبيت مباشر) + AAB (Google Play) معاً
          ./gradlew assembleRelease bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$STORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi

          AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name "*.aab" | head -n 1)
          if [ -z "$AAB" ]; then
            echo "::error::Release AAB was not produced."
            exit 1
          fi

          # Give the downloadable APK a clear, user-friendly filename.
          APK_DIR=$(dirname "$APK")
          APK_NAMED="$APK_DIR/Aya-Test-${{ steps.ver.outputs.versionName }}.apk"
          cp "$APK" "$APK_NAMED"
          echo "APK: $APK_NAMED"
          echo "AAB: $AAB"

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -o -name aapt2 | head -n 1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt/aapt2 not found; cannot verify final APK permissions."
            exit 1
          fi

          if "$AAPT" dump permissions "$APK" | grep -q "android.permission.RECORD_AUDIO"; then
            echo "::warning::APK still lists RECORD_AUDIO (may come from a dependency). App does not request mic at runtime."
          else
            echo "Final APK permission check: RECORD_AUDIO is not declared."
          fi
          echo "Both APK and AAB built successfully."

      # ============================================================
      # UPLOAD APK + AAB
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-play-store-apk-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/apk/release/Aya-Test-*.apk
          if-no-files-found: error

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: aya-play-store-aab-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
