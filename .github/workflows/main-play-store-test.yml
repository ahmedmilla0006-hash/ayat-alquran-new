name: Build Aya Android — Google Play (separate)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout this repository first so the original signing secrets remain available.
      - name: Checkout signing repository
        uses: actions/checkout@v4

      # The app's web files come from the experimental repository.
      - name: Checkout experimental app source
        uses: actions/checkout@v4
        with:
          repository: ahmedmilla0006-hash/test-index210-split.
          ref: main
          path: app-source

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Android project
        run: |
          mkdir -p android-app
          cd android-app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web files
        run: |
          mkdir -p android-app/www
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android-app' \
            app-source/ android-app/www/

      - name: Initialize Capacitor
        working-directory: android-app
        run: npx cap init "آية" "com.aya.alquran" --web-dir www

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Set separate experimental application ID
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          gradle = Path("android-app/android/app/build.gradle")
          if not gradle.exists():
              gradle = Path("android-app/android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("ERROR: Android app Gradle file not found")

          text = gradle.read_text(encoding="utf-8")
          pattern = r"(applicationId\s+)(['\"])(com\.aya\.alquran)(['\"])"
          updated, count = re.subn(pattern, r"\1\2com.aya.alquran.test\4", text, count=1)
          if count != 1:
              raise SystemExit("ERROR: Could not safely set applicationId to com.aya.alquran.test")
          gradle.write_text(updated, encoding="utf-8")
          if "applicationId 'com.aya.alquran.test'" not in updated and 'applicationId "com.aya.alquran.test"' not in updated and 'applicationId("com.aya.alquran.test")' not in updated:
              raise SystemExit("ERROR: Experimental application ID verification failed")
          print("Experimental application ID configured: com.aya.alquran.test")
          PY

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Install Aya app icon
        run: |
          python3 << 'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          icon_path = Path("app-source/icon.png")

          if not icon_path.exists():
              raise SystemExit("ERROR: icon.png was not found.")

          original = Image.open(icon_path).convert("RGBA")

          base = Path(
              "android-app/android/app/src/main/res"
          )

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              target_dir = base / folder
              target_dir.mkdir(parents=True, exist_ok=True)

              resized = original.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              resized.save(
                  target_dir / "ic_launcher.png",
                  "PNG"
              )

              resized.save(
                  target_dir / "ic_launcher_round.png",
                  "PNG"
              )

              for f in target_dir.glob("ic_launcher*"):
                  if f.name not in [
                      "ic_launcher.png",
                      "ic_launcher_round.png"
                  ]:
                      f.unlink(missing_ok=True)

          fg_size = 432

          canvas = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (0, 0, 0, 0)
          )

          icon_size = int(fg_size * 0.72)

          icon_resized = original.resize(
              (icon_size, icon_size),
              Image.Resampling.LANCZOS
          )

          offset = (
              (fg_size - icon_size) // 2
          )

          canvas.paste(
              icon_resized,
              (offset, offset),
              icon_resized
          )

          xxx = base / "mipmap-xxxhdpi"

          xxx.mkdir(
              parents=True,
              exist_ok=True
          )

          canvas.save(
              xxx / "ic_launcher_foreground.png",
              "PNG"
          )

          bg = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (13, 27, 42, 255)
          )

          bg.save(
              xxx / "ic_launcher_background.png",
              "PNG"
          )

          anydpi = base / "mipmap-anydpi-v26"

          if anydpi.exists():
              shutil.rmtree(anydpi)

          anydpi.mkdir(
              parents=True,
              exist_ok=True
          )

          xml = (
              '<?xml version="1.0" encoding="utf-8"?>'
              '<adaptive-icon '
              'xmlns:android='
              '"http://schemas.android.com/apk/res/android">'
              '<background '
              'android:drawable='
              '"@mipmap/ic_launcher_background"/>'
              '<foreground '
              'android:drawable='
              '"@mipmap/ic_launcher_foreground"/>'
              '</adaptive-icon>'
          )

          (
              anydpi / "ic_launcher.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          (
              anydpi / "ic_launcher_round.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          # أيقونة الإشعار (شريط الحالة) — بنفس أسلوب أيقونة التطبيق
          # مصدرها نفس icon.png في المشروع، وتُولَّد لكل كثافة بشكل نظامي
          # يجب أن تكون بيضاء/شفافة (silhouette) لتعمل على كل الأجهزة
          try:
              src0 = original.convert("RGBA")
              w, h = src0.size
              side = min(w, h)
              left = (w - side) // 2
              top = (h - side) // 2
              src0 = src0.crop((left, top, left + side, top + side))

              def to_white_silhouette(img):
                  img = img.copy()
                  pixels = img.load()
                  ww, hh = img.size
                  for yy in range(hh):
                      for xx in range(ww):
                          r, g, b, a = pixels[xx, yy]
                          if a < 40:
                              pixels[xx, yy] = (0, 0, 0, 0)
                          else:
                              pixels[xx, yy] = (255, 255, 255, a)
                  return img

              # أحجام قياسية لأيقونات الإشعار (status bar)
              notif_sizes = {
                  "drawable-mdpi": 24,
                  "drawable-hdpi": 36,
                  "drawable-xhdpi": 48,
                  "drawable-xxhdpi": 72,
                  "drawable-xxxhdpi": 96,
              }
              for folder, size in notif_sizes.items():
                  ddir = base / folder
                  ddir.mkdir(parents=True, exist_ok=True)
                  resized = src0.resize((size, size), Image.Resampling.LANCZOS)
                  white = to_white_silhouette(resized)
                  out = ddir / "ic_stat_aya.png"
                  white.save(out, "PNG")
                  print("Notification icon:", out, size)

              # نسخة افتراضية في drawable/ للتوافق
              ddef = base / "drawable"
              ddef.mkdir(parents=True, exist_ok=True)
              fallback = src0.resize((48, 48), Image.Resampling.LANCZOS)
              to_white_silhouette(fallback).save(ddef / "ic_stat_aya.png", "PNG")
              print("Notification icon default: drawable/ic_stat_aya.png")
          except Exception as e:
              print("WARN: could not generate ic_stat_aya:", e)

          print("Aya icon improved successfully.")
          PY

      - name: Set automatic Google Play version
        id: ver
        run: |
          CODE="$((203 + GITHUB_RUN_NUMBER))"
          NAME="1.0.${CODE}"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # KEYSTORE
      # ============================================================

      - name: Decode and verify keystore
        env:
          K1: ${{ secrets.KS1 }}
          K2: ${{ secrets.KS2 }}
          K3: ${{ secrets.KS3 }}
          K4: ${{ secrets.KS4 }}
          K5: ${{ secrets.KS5 }}
          K6: ${{ secrets.KS6 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 << 'PY'
          import os, re, base64, pathlib, subprocess, sys

          parts = []
          for i in range(1, 7):
              v = os.environ.get(f"K{i}") or ""
              print(f"KS{i} length = {len(v)}")
              if not v:
                  print(f"::error::السر KS{i} ناقص")
                  sys.exit(1)
              parts.append(v)

          b64 = "".join(parts)
          # إزالة أي محارف غير Base64 (مسافات، أسطر، إلخ)
          b64 = re.sub(r"[^A-Za-z0-9+/=]", "", b64)
          # إكمال الحشو إن نقص
          pad = (-len(b64)) % 4
          if pad:
              b64 += "=" * pad

          print(f"Total base64 length = {len(b64)}")

          try:
              raw = base64.b64decode(b64, validate=False)
          except Exception as e:
              print(f"::error::فشل فك Base64: {e}")
              sys.exit(1)

          out = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "aya-release.jks"
          out.write_bytes(raw)
          print(f"Keystore bytes = {len(raw)}")
          if len(raw) < 100:
              print("::error::ملف keystore صغير جداً — الأجزاء ناقصة")
              sys.exit(1)

          pw = os.environ.get("KEYSTORE_PASSWORD") or ""
          alias = os.environ.get("KEY_ALIAS") or ""
          r = subprocess.run(
              ["keytool", "-list", "-keystore", str(out), "-storepass", pw, "-alias", alias],
              capture_output=True,
              text=True,
          )
          print(r.stdout)
          if r.returncode != 0:
              print(r.stderr)
              print("::error::keytool فشل — تحقق من KEYSTORE_PASSWORD و KEY_ALIAS")
              sys.exit(1)
          print("Keystore verified successfully.")
          PY

      # ============================================================
      # VERSION
      # ============================================================

      - name: Set version in Gradle
        env:
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os
          import re

          vc = os.environ["VERSION_CODE"]
          vn = os.environ["VERSION_NAME"]

          gradle = Path(
              "android-app/android/app/build.gradle"
          )

          if not gradle.exists():
              gradle = Path(
                  "android-app/android/app/build.gradle.kts"
              )

          if not gradle.exists():
              raise SystemExit(
                  "ERROR: Gradle file not found."
              )

          text = gradle.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r"versionCode\s+\d+",
              "versionCode " + vc,
              text
          )

          text = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName "' + vn + '"',
              text
          )

          gradle.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "version set",
              vc,
              vn
          )
          PY

      # ============================================================
      # NOTIFICATIONS — إشعار التلاوة (قائمة التشغيل)
      # ============================================================

      - name: Configure Android media notifications
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re, base64

          android_root = Path("android-app/android/app/src/main")
          manifest = android_root / "AndroidManifest.xml"
          text = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK",
          ]
          for permission in permissions:
              if permission not in text:
                  text = re.sub(
                      r"(<manifest[^>]*>)",
                      r'\1\n    <uses-permission android:name="%s" />' % permission,
                      text,
                      count=1,
                  )

          if "android:usesCleartextTraffic" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )


          manifest.write_text(text, encoding="utf-8")

          # Remove media notification/service when the app task is swiped away.
          text = manifest.read_text(encoding="utf-8")
          if 'android:name=".AyaMediaService"' in text and 'android:stopWithTask="true"' not in text:
              text = re.sub(
                  r'(<service\s+android:name="\.AyaMediaService"[^>]*)(/?>)',
                  r'\1\n        android:stopWithTask="true"\2',
                  text, count=1
              )
              manifest.write_text(text, encoding="utf-8")


          java_dir = android_root / "java/com/aya/alquran"
          java_dir.mkdir(parents=True, exist_ok=True)
          activity = java_dir / "MainActivity.java"

          activity_b64 = ""
          activity.write_bytes(base64.b64decode(activity_b64))

          # ============================================================
          # ============================================================
          # AYA MEDIA SERVICE — keep the existing service intact
          # IMPORTANT: use AndroidX MediaCompat classes from androidx.media:media
          # ============================================================

          service_b64 = ""
          service_file = java_dir / "AyaMediaService.java"
          service_file.write_bytes(base64.b64decode(service_b64))

          if not service_file.exists():
              raise SystemExit("ERROR: AyaMediaService.java was not created.")

          service_text_check = service_file.read_text(encoding="utf-8")
          required_service = [
              "public class AyaMediaService",
              "android.support.v4.media.session.MediaSessionCompat",
              "android.support.v4.media.session.PlaybackStateCompat",
              "EXTRA_POSITION",
              "EXTRA_DURATION",
              "onTaskRemoved(Intent rootIntent)",
          ]
          missing_service = [x for x in required_service if x not in service_text_check]
          if missing_service:
              raise SystemExit(
                  "ERROR: AyaMediaService.java missing: " + ", ".join(missing_service)
              )

          mtxt = manifest.read_text(encoding="utf-8")
          if 'android:name=".AyaMediaService"' not in mtxt:
              svc = (
                  '    <service\n'
                  '        android:name=".AyaMediaService"\n'
                  '        android:exported="false"\n'
                  '        android:stopWithTask="true"\n'
                  '        android:foregroundServiceType="mediaPlayback" />\n'
              )
              mtxt = re.sub(r"(</application>)", svc + r"\1", mtxt, count=1)
          elif 'android:name=".AyaMediaService"' in mtxt and 'android:foregroundServiceType="mediaPlayback"' not in mtxt:
              mtxt = re.sub(
                  r'(<service\s+android:name="\.AyaMediaService"[^>]*)(/?>)',
                  r'\1\n        android:foregroundServiceType="mediaPlayback"\2',
                  mtxt,
                  count=1
              )
          manifest.write_text(mtxt, encoding="utf-8")
          print("AyaMediaService.java restored and verified without overwriting it later.")


      - name: Add Quran widget
        run: |
          set -e
          echo "Running Quran widget installation script..."
          python3 app-source/scripts/add-quran-widget.py

          # Verify widget Java files exist
          JAVA_DIR="android-app/android/app/src/main/java/com/aya/alquran"
          WIDGET_JAVA=$(find "$JAVA_DIR" -name '*Widget*.java' -o -name '*QuranWidget*.java' 2>/dev/null | head -5)
          if [ -z "$WIDGET_JAVA" ]; then
            echo "::error::No widget Java files found after running add-quran-widget.py"
            ls -la "$JAVA_DIR" || true
            exit 1
          fi
          echo "Found widget Java files:"
          echo "$WIDGET_JAVA"

          # Verify widget XML resources exist (provider info, layouts, etc.)
          RES_DIR="android-app/android/app/src/main/res"
          WIDGET_XML=$(find "$RES_DIR" -type f \( -name '*widget*.xml' -o -name '*quran*widget*.xml' -o -path '*/xml/*widget*' \) 2>/dev/null | head -10)
          if [ -z "$WIDGET_XML" ]; then
            # also check common locations
            WIDGET_XML=$(find "$RES_DIR" -type f -name '*.xml' | xargs grep -l -i 'AppWidgetProvider\|appwidget-provider' 2>/dev/null | head -5)
          fi
          if [ -z "$WIDGET_XML" ]; then
            echo "::error::No widget XML files found after running add-quran-widget.py"
            find "$RES_DIR" -name '*widget*' -o -name '*quran*' 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "Found widget XML files:"
          echo "$WIDGET_XML"

          # Verify widget is registered in AndroidManifest.xml
          MANIFEST="android-app/android/app/src/main/AndroidManifest.xml"
          if ! grep -qE 'android:name=.*[Ww]idget|AppWidgetProvider|receiver.*[Ww]idget' "$MANIFEST"; then
            echo "::error::Widget not registered in AndroidManifest.xml"
            grep -n -i widget "$MANIFEST" || true
            exit 1
          fi
          echo "Widget registration found in AndroidManifest.xml:"
          grep -n -i -E 'widget|AppWidget' "$MANIFEST" || true

          # Verify MainActivity is linked / references the widget (or at least exists and is intact)
          MAIN_ACT="$JAVA_DIR/MainActivity.java"
          if [ ! -f "$MAIN_ACT" ]; then
            echo "::error::MainActivity.java missing after widget script"
            exit 1
          fi
          # Soft check: script may inject widget-related code into MainActivity
          if grep -qiE 'widget|AppWidget|QuranWidget' "$MAIN_ACT"; then
            echo "MainActivity contains widget-related references (good)."
            grep -n -i -E 'widget|AppWidget|QuranWidget' "$MAIN_ACT" | head -10 || true
          else
            echo "Note: No explicit widget string found in MainActivity (may be OK if linking is via Manifest only)."
          fi

          echo "Quran widget step completed and verified successfully."

      - name: Add Adhan (prayer) notifications
        run: |
          set -e
          echo "==== Installing native Adhan notification components ===="
          test -f app-source/scripts/add-adhan-notifications.py
          python3 app-source/scripts/add-adhan-notifications.py
          JAVA_DIR="android-app/android/app/src/main/java/com/aya/alquran"
          MAIN="$JAVA_DIR/MainActivity.java"
          MANIFEST="android-app/android/app/src/main/AndroidManifest.xml"
          python3 -c "import base64,pathlib; pathlib.Path('/tmp/adhan_patch.py').write_bytes(base64.b64decode(''))"
          python3 /tmp/adhan_patch.py
          if [ -f android-app/www/js/32-aya-prayer-times.js ]; then
            mkdir -p android-app/android/app/src/main/assets/public/js
            cp -f android-app/www/js/32-aya-prayer-times.js android-app/android/app/src/main/assets/public/js/ 2>/dev/null || true
          fi
          grep -q 'prayerEpochMs' android-app/www/js/32-aya-prayer-times.js
          grep -q 'setAlarmClock' "$JAVA_DIR/AyaAdhanScheduler.java"
          grep -q 'وقت غير صالح' "$JAVA_DIR/AyaAdhanBridge.java"
          grep -q 'addJavascriptInterface(new AyaAdhanBridge' "$MAIN"
          grep -q 'AYA_ADHAN_CHANNEL_EARLY_V6' "$MAIN"
          grep -q 'TIME_SET' "$MANIFEST"
          echo "==== Adhan countdown-based epoch fix verified ===="

      - name: Remove invalid Activity onTaskRemoved override
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          activity = Path("android-app/android/app/src/main/java/com/aya/alquran/MainActivity.java")
          text = activity.read_text(encoding="utf-8")

          # onTaskRemoved() belongs to Service, not Activity/BridgeActivity.
          # Remove any previously injected override from MainActivity.
          text = re.sub(
              r"\n\s*@Override\s*\n\s*public void onTaskRemoved\(Intent rootIntent\)\s*\{.*?\n\s*\}\s*\n",
              "\n",
              text,
              flags=re.DOTALL,
          )
          text = text.replace("\n        super.onTaskRemoved(rootIntent);", "")
          activity.write_text(text, encoding="utf-8")

          if "onTaskRemoved(" in text or "super.onTaskRemoved(" in text:
              raise SystemExit("ERROR: invalid onTaskRemoved override remains in MainActivity.java")

          print("MainActivity.java fixed: no onTaskRemoved override.")
          PY

      # ============================================================
      # FIX: إخفاء إشعار التلاوة عند الإيقاف (لا يبقى معلّقاً)
      # ============================================================

      - name: Add reliable Android network state bridge
        run: |
          set -e
          python3 <<'PY_NETWORK'
          from pathlib import Path
          import re

          root = Path("android-app/android/app/src/main")
          manifest = root / "AndroidManifest.xml"
          activity = root / "java/com/aya/alquran/MainActivity.java"

          if not manifest.exists() or not activity.exists():
              raise SystemExit("ERROR: Android manifest or generated MainActivity.java is missing.")

          # Android 6+ network-state permission (does not request location).
          mt = manifest.read_text(encoding="utf-8")
          permission = "android.permission.ACCESS_NETWORK_STATE"
          if permission not in mt:
              mt = re.sub(
                  r"(<manifest[^>]*>)",
                  r'\1\n    <uses-permission android:name="%s" />' % permission,
                  mt,
                  count=1,
              )
              manifest.write_text(mt, encoding="utf-8")

          java = activity.read_text(encoding="utf-8")

          imports = [
              "import android.net.ConnectivityManager;",
              "import android.net.Network;",
              "import android.net.NetworkRequest;",
              "import android.net.NetworkCapabilities;",
              "import android.net.NetworkInfo;",
          ]
          for item in imports:
              if item not in java:
                  java = java.replace("import android.os.Bundle;", "import android.os.Bundle;\n" + item, 1)

          if "AYA_NATIVE_NETWORK_BRIDGE_V1" not in java:
              fields = """
              // AYA_NATIVE_NETWORK_BRIDGE_V1
              private ConnectivityManager ayaConnectivityManager;
              private ConnectivityManager.NetworkCallback ayaNetworkCallback;
              private Boolean ayaLastPublishedNetworkState = null;

              private boolean isAyaInternetConnected() {
                  try {
                      if (ayaConnectivityManager == null) {
                          ayaConnectivityManager = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      }
                      if (ayaConnectivityManager == null) return false;
                      NetworkInfo info = ayaConnectivityManager.getActiveNetworkInfo();
                      return info != null && info.isConnected();
                  } catch (Exception ignored) {
                      return false;
                  }
              }

              private void publishAyaNetworkState() {
                  final boolean connected = isAyaInternetConnected();
                  runOnUiThread(() -> {
                      if (ayaLastPublishedNetworkState != null
                              && ayaLastPublishedNetworkState.booleanValue() == connected) return;
                      ayaLastPublishedNetworkState = connected;
                      String js = "(function(){try{"
                              + "window.__AYA_NATIVE_ONLINE=" + (connected ? "true" : "false") + ";"
                              + "try{Object.defineProperty(navigator,'onLine',{configurable:true,get:function(){return window.__AYA_NATIVE_ONLINE;}});}catch(e){}"
                              + "window.dispatchEvent(new Event('" + (connected ? "online" : "offline") + "'));"
                              + "}catch(e){}})();";
                      evalJs(js);
                  });
              }

              private void registerAyaNetworkCallback() {
                  try {
                      if (ayaConnectivityManager == null) {
                          ayaConnectivityManager = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      }
                      if (ayaConnectivityManager == null || ayaNetworkCallback != null) return;
                      ayaNetworkCallback = new ConnectivityManager.NetworkCallback() {
                          @Override public void onAvailable(Network network) {
                              getWindow().getDecorView().postDelayed(() -> publishAyaNetworkState(), 350);
                          }
                          @Override public void onLost(Network network) {
                              getWindow().getDecorView().postDelayed(() -> publishAyaNetworkState(), 500);
                          }
                          @Override public void onCapabilitiesChanged(Network network, NetworkCapabilities caps) {
                              getWindow().getDecorView().postDelayed(() -> publishAyaNetworkState(), 250);
                          }
                      };
                      NetworkRequest request = new NetworkRequest.Builder()
                              .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                              .build();
                      ayaConnectivityManager.registerNetworkCallback(request, ayaNetworkCallback);
                  } catch (Exception ignored) {
                      ayaNetworkCallback = null;
                  }
                  getWindow().getDecorView().postDelayed(() -> publishAyaNetworkState(), 500);
              }
              """
              java = java.replace(
                  "    private static final String CHANNEL_ID",
                  fields + "\n    private static final String CHANNEL_ID",
                  1,
              )

              java = java.replace(
                  "        instance = this;\n",
                  "        instance = this;\n        registerAyaNetworkCallback();\n",
                  1,
              )

              java = java.replace(
                  "        super.onResume();\n",
                  "        super.onResume();\n        registerAyaNetworkCallback();\n        getWindow().getDecorView().postDelayed(() -> publishAyaNetworkState(), 300);\n",
                  1,
              )

              java = java.replace(
                  "    public void onDestroy() {\n",
                  "    public void onDestroy() {\n        try { if (ayaConnectivityManager != null && ayaNetworkCallback != null) ayaConnectivityManager.unregisterNetworkCallback(ayaNetworkCallback); } catch (Exception ignored) {}\n        ayaNetworkCallback = null;\n",
                  1,
              )

          activity.write_text(java, encoding="utf-8")

          # Strict checks: avoid silently shipping a partial injection.
          final_manifest = manifest.read_text(encoding="utf-8")
          final_java = activity.read_text(encoding="utf-8")
          required = [
              "android.permission.ACCESS_NETWORK_STATE",
          ]
          if not all(x in final_manifest for x in required):
              raise SystemExit("ERROR: ACCESS_NETWORK_STATE permission verification failed.")
          for token in (
              "AYA_NATIVE_NETWORK_BRIDGE_V1",
              "registerAyaNetworkCallback",
              "publishAyaNetworkState",
              "navigator,'onLine'",
              "unregisterNetworkCallback",
          ):
              if token not in final_java:
                  raise SystemExit("ERROR: network bridge verification failed: " + token)
          print("Native network bridge and manifest permission verified.")
          PY_NETWORK


