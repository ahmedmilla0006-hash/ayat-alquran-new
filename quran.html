<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #f7f3e8;
  color: #222;
}

header {
  background: #176b2c;
  color: white;
  text-align: center;
  padding: 35px 15px;
}

header h1 {
  margin: 0;
  font-size: 38px;
}

header p {
  font-size: 20px;
  margin-bottom: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 25px 15px;
}

.back {
  display: inline-block;
  background: #176b2c;
  color: white;
  text-decoration: none;
  padding: 14px 25px;
  border-radius: 12px;
  margin-bottom: 25px;
}

.search {
  width: 100%;
  padding: 16px;
  border: 2px solid #ddd;
  border-radius: 12px;
  font-size: 18px;
  margin-bottom: 20px;
  text-align: right;
}

.surah-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.surah {
  background: white;
  border-radius: 14px;
  padding: 18px;
  cursor: pointer;
  border: 1px solid #e5e5e5;
  transition: 0.2s;
}

.surah:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.surah-number {
  display: inline-flex;
  width: 38px;
  height: 38px;
  align-items: center;
  justify-content: center;
  background: #176b2c;
  color: white;
  border-radius: 50%;
  margin-left: 10px;
}

.surah-name {
  font-size: 20px;
  font-weight: bold;
}

.reader {
  display: none;
  background: white;
  border-radius: 18px;
  padding: 25px;
  margin-top: 20px;
}

.reader h2 {
  color: #176b2c;
  text-align: center;
  font-size: 30px;
}

.bismillah {
  text-align: center;
  font-size: 28px;
  margin: 30px 0;
}

.ayah {
  font-family: "Amiri", "Traditional Arabic", serif;
  font-size: 27px;
  line-height: 2.2;
  padding: 20px 5px;
  border-bottom: 1px solid #eee;
}

.ayah-number {
  display: inline-flex;
  width: 34px;
  height: 34px;
  align-items: center;
  justify-content: center;
  background: #176b2c;
  color: white;
  border-radius: 50%;
  font-family: Tahoma, Arial, sans-serif;
  font-size: 15px;
  margin-right: 8px;
}

.close-reader {
  display: block;
  width: 100%;
  border: none;
  background: #176b2c;
  color: white;
  padding: 15px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
  margin-bottom: 20px;
}

.loading {
  text-align: center;
  font-size: 20px;
  padding: 30px;
}

.error {
  text-align: center;
  color: #b00020;
  padding: 20px;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}

@media (max-width: 600px) {
  header h1 {
    font-size: 30px;
  }

  .surah-list {
    grid-template-columns: 1fr;
  }

  .ayah {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<header>
  <h1>القرآن الكريم</h1>
  <p>آيات القرآن الكريم</p>
</header>

<div class="container">

  <a href="index.html" class="back">← العودة للرئيسية</a>

  <input
    type="text"
    id="search"
    class="search"
    placeholder="🔎 ابحث عن سورة..."
  >

  <div id="surahList" class="surah-list"></div>

  <div id="reader" class="reader">
    <button class="close-reader" onclick="closeReader()">
      ← العودة إلى قائمة السور
    </button>

    <h2 id="surahTitle"></h2>

    <div class="bismillah">
      بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
    </div>

    <div id="ayahs"></div>
  </div>

</div>

<footer>
  © 2026 أبو إسلام — جميع الحقوق محفوظة
</footer>

<script>

const surahs = [
"الفاتحة",
"البقرة",
"آل عمران",
"النساء",
"المائدة",
"الأنعام",
"الأعراف",
"الأنفال",
"التوبة",
"يونس",
"هود",
"يوسف",
"الرعد",
"إبراهيم",
"الحجر",
"النحل",
"الإسراء",
"الكهف",
"مريم",
"طه",
"الأنبياء",
"الحج",
"المؤمنون",
"النور",
"الفرقان",
"الشعراء",
"النمل",
"القصص",
"العنكبوت",
"الروم",
"لقمان",
"السجدة",
"الأحزاب",
"سبأ",
"فاطر",
"يس",
"الصافات",
"ص",
"الزمر",
"غافر",
"فصلت",
"الشورى",
"الزخرف",
"الدخان",
"الجاثية",
"الأحقاف",
"محمد",
"الفتح",
"الحجرات",
"ق",
"الذاريات",
"الطور",
"النجم",
"القمر",
"الرحمن",
"الواقعة",
"الحديد",
"المجادلة",
"الحشر",
"الممتحنة",
"الصف",
"الجمعة",
"المنافقون",
"التغابن",
"الطلاق",
"التحريم",
"الملك",
"القلم",
"الحاقة",
"المعارج",
"نوح",
"الجن",
"المزمل",
"المدثر",
"القيامة",
"الإنسان",
"المرسلات",
"النبأ",
"النازعات",
"عبس",
"التكوير",
"الانفطار",
"المطففين",
"الانشقاق",
"البروج",
"الطارق",
"الأعلى",
"الغاشية",
"الفجر",
"البلد",
"الشمس",
"الليل",
"الضحى",
"الشرح",
"التين",
"العلق",
"القدر",
"البينة",
"الزلزلة",
"العاديات",
"القارعة",
"التكاثر",
"العصر",
"الهمزة",
"الفيل",
"قريش",
"الماعون",
"الكوثر",
"الكافرون",
"النصر",
"المسد",
"الإخلاص",
"الفلق",
"الناس"
];

const list = document.getElementById("surahList");
const search = document.getElementById("search");

function showSurahs(items = surahs) {

  list.innerHTML = "";

  items.forEach((name) => {

    const number = surahs.indexOf(name) + 1;

    const div = document.createElement("div");
    div.className = "surah";

    div.innerHTML = `
      <span class="surah-number">${number}</span>
      <span class="surah-name">سورة ${name}</span>
    `;

    div.onclick = () => loadSurah(number, name);

    list.appendChild(div);
  });
}

async function loadSurah(number, name) {

  list.style.display = "none";
  search.style.display = "none";

  const reader = document.getElementById("reader");
  const title = document.getElementById("surahTitle");
  const ayahs = document.getElementById("ayahs");

  reader.style.display = "block";

  title.textContent = "سورة " + name;

  ayahs.innerHTML = `
    <div class="loading">
      جاري تحميل الآيات...
    </div>
  `;

  try {

    const response = await fetch(
      `https://api.alquran.cloud/v1/surah/${number}/quran-uthmani`
    );

    if (!response.ok) {
      throw new Error("فشل الاتصال");
    }

    const data = await response.json();

    ayahs.innerHTML = "";

    data.data.ayahs.forEach(ayah => {

      const div = document.createElement("div");

      div.className = "ayah";

      div.innerHTML = `
        ${ayah.text}
        <span class="ayah-number">${ayah.numberInSurah}</span>
      `;

      ayahs.appendChild(div);
    });

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  } catch (error) {

    ayahs.innerHTML = `
      <div class="error">
        تعذر تحميل السورة.<br>
        تأكد من اتصال الإنترنت ثم حاول مرة أخرى.
      </div>
    `;
  }
}

function closeReader() {

  document.getElementById("reader").style.display = "none";

  list.style.display = "grid";
  search.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

search.addEventListener("input", function() {

  const text = this.value.trim();

  if (!text) {
    showSurahs();
    return;
  }

  const filtered = surahs.filter(name =>
    name.includes(text)
  );

  showSurahs(filtered);
});

showSurahs();

</script>

</body>
</html>
