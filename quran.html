<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f1e8;
    color: #292929;
    font-family: "Tahoma", Arial, sans-serif;
    transition: 0.3s;
}

body.dark {
    background: #121212;
    color: #eee;
}

header {
    background: #146b2e;
    color: white;
    text-align: center;
    padding: 30px 15px;
}

header h1 {
    margin: 0;
    font-size: 38px;
}

header p {
    font-size: 20px;
    margin: 12px 0 0;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 25px 15px;
}

.top-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 18px;
    background: #176f32;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    transform: scale(.97);
}

.search {
    width: 100%;
    padding: 17px;
    border-radius: 15px;
    border: 2px solid #ddd;
    font-size: 18px;
    margin-bottom: 20px;
    outline: none;
}

body.dark .search {
    background: #222;
    color: white;
    border-color: #444;
}

.surah-list {
    display: grid;
    gap: 12px;
}

.surah {
    background: white;
    border-radius: 18px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
    cursor: pointer;
    transition: .2s;
}

.surah:hover {
    transform: translateY(-2px);
}

body.dark .surah {
    background: #1e1e1e;
}

.surah-number {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #176f32;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.surah-name {
    flex: 1;
    text-align: right;
    padding-right: 15px;
    font-size: 22px;
    font-weight: bold;
}

.reader {
    display: none;
}

.reader-header {
    background: white;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
}

body.dark .reader-header {
    background: #1e1e1e;
}

.reader-header h2 {
    color: #176f32;
    font-size: 30px;
}

.ayah {
    background: white;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 15px;
    line-height: 2.4;
    font-family: "Amiri", "Traditional Arabic", serif;
    font-size: 28px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

body.dark .ayah {
    background: #1e1e1e;
}

.ayah-number {
    display: inline-flex;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #176f32;
    color: white;
    align-items: center;
    justify-content: center;
    font-family: Arial;
    font-size: 15px;
    margin-left: 8px;
    vertical-align: middle;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.loading {
    text-align: center;
    padding: 40px;
    font-size: 20px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}

@media(max-width:600px) {
    header h1 {
        font-size: 30px;
    }

    .surah-name {
        font-size: 19px;
    }

    .ayah {
        font-size: 25px;
        padding: 20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>القرآن الكريم</h1>
    <p>آيات القرآن الكريم</p>
</header>

<div class="container">

    <div class="top-buttons">
        <button onclick="toggleDark()">🌙 الوضع الليلي</button>
    </div>

    <!-- قائمة السور -->
    <section id="surahSection">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="🔎 ابحث عن سورة..."
            oninput="searchSurah()"
        >

        <div id="surahList" class="surah-list">
            <div class="loading">جاري تحميل سور القرآن...</div>
        </div>

    </section>

    <!-- صفحة القراءة -->
    <section id="reader" class="reader">

        <div class="top-buttons">
            <button onclick="backToSurahs()">← العودة للسور</button>
        </div>

        <div class="reader-header">
            <h2 id="readerTitle"></h2>

            <div class="controls">
                <button onclick="changeFont(2)">تكبير الخط +</button>
                <button onclick="changeFont(-2)">تصغير الخط −</button>
            </div>
        </div>

        <div id="ayahs"></div>

    </section>

</div>

<footer>
    © 2026 — القرآن الكريم
</footer>

<script>

let allSurahs = [];
let currentFont = 28;

/* تحميل أسماء السور */
async function loadSurahs() {

    try {

        const response = await fetch(
            "https://api.alquran.cloud/v1/surah"
        );

        const data = await response.json();

        allSurahs = data.data;

        displaySurahs(allSurahs);

    } catch(error) {

        document.getElementById("surahList").innerHTML =
            "<div class='loading'>تعذر تحميل السور. تأكد من اتصال الإنترنت.</div>";

    }
}


/* عرض السور */
function displaySurahs(surahs) {

    const list = document.getElementById("surahList");

    list.innerHTML = "";

    surahs.forEach(surah => {

        const item = document.createElement("div");

        item.className = "surah";

        item.innerHTML = `
            <div class="surah-number">${surah.number}</div>

            <div class="surah-name">
                ${surah.name}
            </div>
        `;

        item.onclick = () => openSurah(surah.number);

        list.appendChild(item);

    });
}


/* البحث */
function searchSurah() {

    const value =
        document.getElementById("search").value.trim();

    const filtered = allSurahs.filter(surah =>
        surah.name.includes(value) ||
        String(surah.number).includes(value)
    );

    displaySurahs(filtered);
}


/* فتح السورة */
async function openSurah(number) {

    document.getElementById("surahSection").style.display = "none";

    document.getElementById("reader").style.display = "block";

    document.getElementById("ayahs").innerHTML =
        "<div class='loading'>جاري تحميل السورة...</div>";

    try {

        const response = await fetch(
            "https://api.alquran.cloud/v1/surah/" +
            number +
            "/quran-uthmani"
        );

        const data = await response.json();

        const surah = data.data;

        document.getElementById("readerTitle").textContent =
            surah.name;

        let html = "";

        surah.ayahs.forEach(ayah => {

            html += `
                <div class="ayah">
                    ${ayah.text}
                    <span class="ayah-number">
                        ${ayah.numberInSurah}
                    </span>
                </div>
            `;

        });

        document.getElementById("ayahs").innerHTML = html;

    } catch(error) {

        document.getElementById("ayahs").innerHTML =
            "<div class='loading'>حدث خطأ أثناء تحميل السورة.</div>";

    }
}


/* العودة */
function backToSurahs() {

    document.getElementById("reader").style.display = "none";

    document.getElementById("surahSection").style.display = "block";

    window.scrollTo(0, 0);
}


/* الوضع الليلي */
function toggleDark() {

    document.body.classList.toggle("dark");

}


/* تغيير حجم الخط */
function changeFont(amount) {

    currentFont += amount;

    if (currentFont < 20)
        currentFont = 20;

    if (currentFont > 45)
        currentFont = 45;

    document.querySelectorAll(".ayah").forEach(ayah => {

        ayah.style.fontSize = currentFont + "px";

    });

}


/* تشغيل */
loadSurahs();

</script>

</body>
</html>
