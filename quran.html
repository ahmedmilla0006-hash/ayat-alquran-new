<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

<title>القرآن الكريم - أبو إسلام</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #eee9dc;
  color: #222;
  font-family: Tahoma, Arial, sans-serif;
}

body.dark {
  background: #111;
  color: #eee;
}

header {
  background: #146b2f;
  color: white;
  text-align: center;
  padding: 12px 8px;
  position: sticky;
  top: 0;
  z-index: 20;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}

header h1 {
  margin: 0;
  font-size: 23px;
}

header p {
  margin: 4px 0 0;
  font-size: 13px;
}

.back {
  display: block;
  width: fit-content;
  margin: 8px auto;
  padding: 8px 15px;
  background: #146b2f;
  color: white;
  text-decoration: none;
  border-radius: 9px;
  font-size: 14px;
}

.controls {
  background: #f5f1e6;
  padding: 8px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  position: sticky;
  top: 66px;
  z-index: 19;
}

body.dark .controls {
  background: #202020;
}

.controls button,
.controls select {
  border: 0;
  border-radius: 9px;
  padding: 8px 11px;
  background: #146b2f;
  color: white;
  font-size: 14px;
}

.page-info {
  font-weight: bold;
  min-width: 90px;
  text-align: center;
}

.reader {
  width: 100%;
  max-width: 850px;
  margin: 10px auto 20px;
  padding: 0 5px;
}

.page-wrapper {
  width: 100%;
  overflow: hidden;
  background: white;
  border-radius: 4px;
  box-shadow: 0 3px 15px rgba(0,0,0,.2);
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.page {
  display: block;
  width: 100%;
  height: auto;
  margin: 0 auto;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

.loading {
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  text-align: center;
  font-size: 18px;
}

.hint {
  text-align: center;
  color: #666;
  font-size: 13px;
  padding: 8px;
}

body.dark .hint {
  color: #aaa;
}

@media (max-width: 600px) {

  header h1 {
    font-size: 21px;
  }

  .controls {
    top: 62px;
    padding: 7px 4px;
  }

  .controls button,
  .controls select {
    font-size: 13px;
    padding: 7px 8px;
  }

  .reader {
    padding: 0 2px;
  }
}
</style>
</head>

<body>

<header>
  <h1>القرآن الكريم</h1>
  <p>صفحات المصحف الشريف</p>
</header>

<a href="index.html" class="back">
  ← العودة للرئيسية
</a>

<div class="controls">

  <span class="page-info">
    صفحة <span id="pageNumber">1</span> / 604
  </span>

  <select id="pageSelect"></select>

  <button onclick="zoomOut()">−</button>
  <button onclick="zoomIn()">+</button>
  <button onclick="toggleDark()">🌙</button>

</div>

<main class="reader">

  <div class="page-wrapper" id="pageWrapper">

    <div class="loading" id="loading">
      جاري تحميل صفحة المصحف...
    </div>

    <img
      id="quranPage"
      class="page"
      alt="صفحة المصحف"
      draggable="false"
      style="display:none;"
    >

  </div>

  <div class="hint">
    اسحب بإصبعك يمينًا أو يسارًا لتقليب الصفحة
  </div>

</main>

<script>

const TOTAL_PAGES = 604;

let currentPage =
  parseInt(localStorage.getItem("quranPage") || "1");

let zoom = 1;

const pageWrapper =
  document.getElementById("pageWrapper");

const image =
  document.getElementById("quranPage");

const loading =
  document.getElementById("loading");

const pageNumber =
  document.getElementById("pageNumber");

const pageSelect =
  document.getElementById("pageSelect");


/* قائمة الصفحات */

for (let i = 1; i <= TOTAL_PAGES; i++) {

  const option =
    document.createElement("option");

  option.value = i;
  option.textContent = "صفحة " + i;

  pageSelect.appendChild(option);
}


/* تحميل الصفحة */

function loadPage(page) {

  page = parseInt(page);

  if (page < 1) page = 1;
  if (page > TOTAL_PAGES) page = TOTAL_PAGES;

  currentPage = page;

  pageNumber.textContent = page;
  pageSelect.value = page;

  loading.style.display = "flex";
  image.style.display = "none";

  image.onload = function() {

    loading.style.display = "none";
    image.style.display = "block";

    applyZoom();
  };

  image.onerror = function() {

    loading.textContent =
      "تعذر تحميل صفحة المصحف رقم " + page;

  };

  image.src = page + ".png";

  localStorage.setItem(
    "quranPage",
    page
  );

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* اختيار صفحة */

pageSelect.addEventListener(
  "change",
  function() {
    loadPage(this.value);
  }
);


/* التكبير */

function zoomIn() {

  if (zoom < 2.5) {
    zoom += 0.1;
    applyZoom();
  }

}

function zoomOut() {

  if (zoom > 0.5) {
    zoom -= 0.1;
    applyZoom();
  }

}

function applyZoom() {

  image.style.width =
    (zoom * 100) + "%";

}


/* الوضع الليلي */

function toggleDark() {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "quranDark",
    document.body.classList.contains("dark")
  );
}

if (
  localStorage.getItem("quranDark") === "true"
) {
  document.body.classList.add("dark");
}


/* ================================
   تقليب الصفحات بالسحب
================================ */

/*
   السحب من اليمين إلى اليسار
   = الصفحة التالية

   السحب من اليسار إلى اليمين
   = الصفحة السابقة
*/

let startX = 0;
let startY = 0;

pageWrapper.addEventListener(
  "touchstart",
  function(event) {

    const touch = event.touches[0];

    startX = touch.clientX;
    startY = touch.clientY;

  },
  { passive: true }
);


pageWrapper.addEventListener(
  "touchend",
  function(event) {

    const touch =
      event.changedTouches[0];

    const endX =
      touch.clientX;

    const endY =
      touch.clientY;

    const distanceX =
      endX - startX;

    const distanceY =
      endY - startY;


    /*
      نتجاهل السحب العمودي
    */

    if (
      Math.abs(distanceY) >
      Math.abs(distanceX)
    ) {
      return;
    }


    /*
      الحد الأدنى للحركة
    */

    if (
      Math.abs(distanceX) < 60
    ) {
      return;
    }


    /*
      من اليمين إلى اليسار
      distanceX يكون سالبًا
      = الصفحة التالية
    */

    if (distanceX < 0) {

      if (
        currentPage < TOTAL_PAGES
      ) {

        loadPage(
          currentPage + 1
        );

      }

    }


    /*
      من اليسار إلى اليمين
      distanceX يكون موجبًا
      = الصفحة السابقة
    */

    else {

      if (currentPage > 1) {

        loadPage(
          currentPage - 1
        );

      }

    }

  },
  { passive: true }
);


/* لوحة المفاتيح */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "ArrowLeft") {

      if (currentPage > 1) {
        loadPage(currentPage - 1);
      }

    }

    if (event.key === "ArrowRight") {

      if (currentPage < TOTAL_PAGES) {
        loadPage(currentPage + 1);
      }

    }

  }
);


/* تشغيل آخر صفحة */

loadPage(currentPage);

</script>

</body>
</html>
