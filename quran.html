<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

<title>القرآن الكريم - أبو إسلام</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#eee9dc;
  color:#222;
  font-family:Tahoma,Arial,sans-serif;
}

body.dark{
  background:#111;
  color:#eee;
}

header{
  background:#146b2f;
  color:#fff;
  padding:10px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}

header h1{
  margin:0;
  font-size:22px;
}

header p{
  margin:3px 0 0;
  font-size:12px;
}

.back{
  display:block;
  width:max-content;
  margin:8px auto;
  padding:7px 14px;
  border-radius:9px;
  background:#146b2f;
  color:white;
  text-decoration:none;
  font-size:13px;
}

.toolbar{
  position:sticky;
  top:63px;
  z-index:45;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  padding:7px;
  background:#f5f1e6;
  box-shadow:0 1px 5px rgba(0,0,0,.12);
}

body.dark .toolbar{
  background:#202020;
}

.tool{
  width:42px;
  height:38px;
  border:0;
  border-radius:9px;
  background:#146b2f;
  color:#fff;
  font-size:19px;
  cursor:pointer;
}

.page-info{
  min-width:95px;
  text-align:center;
  font-weight:bold;
  font-size:14px;
}

.reader{
  width:100%;
  max-width:850px;
  margin:10px auto 25px;
  padding:0 3px;
}

.page-wrapper{
  width:100%;
  overflow:hidden;
  background:white;
  border-radius:3px;
  box-shadow:0 3px 15px rgba(0,0,0,.2);
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
}

.page{
  display:block;
  width:100%;
  height:auto;
  margin:auto;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}

.loading{
  min-height:350px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.hint{
  text-align:center;
  color:#666;
  font-size:12px;
  padding:8px;
}

body.dark .hint{
  color:#aaa;
}

/* القائمة */

.menu{
  position:fixed;
  top:0;
  right:-310px;
  width:290px;
  max-width:85%;
  height:100vh;
  background:#fff;
  color:#222;
  z-index:100;
  box-shadow:-5px 0 20px rgba(0,0,0,.3);
  transition:right .25s ease;
  padding:18px;
  overflow-y:auto;
}

body.dark .menu{
  background:#222;
  color:#eee;
}

.menu.open{
  right:0;
}

.menu h2{
  margin:5px 0 18px;
  text-align:center;
  color:#146b2f;
}

.menu button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:12px;
  margin:5px 0;
  background:#146b2f;
  color:#fff;
  font-size:15px;
  text-align:right;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:90;
}

.overlay.show{
  display:block;
}

/* نافذة الانتقال */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:120;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:360px;
  background:white;
  color:#222;
  border-radius:14px;
  padding:20px;
  text-align:center;
}

body.dark .modal-box{
  background:#222;
  color:#eee;
}

.modal-box input{
  width:100%;
  padding:12px;
  margin:12px 0;
  border:1px solid #bbb;
  border-radius:8px;
  font-size:18px;
  text-align:center;
}

.modal-box button{
  border:0;
  border-radius:8px;
  padding:10px 18px;
  background:#146b2f;
  color:white;
  margin:4px;
}

/* الهاتف */

@media(max-width:600px){

  header h1{
    font-size:20px;
  }

  .toolbar{
    top:59px;
    padding:6px 3px;
  }

  .tool{
    width:39px;
    height:36px;
    font-size:17px;
  }

  .page-info{
    min-width:82px;
    font-size:13px;
  }

  .reader{
    margin-top:7px;
  }
}
</style>
</head>

<body>

<header>
  <h1>القرآن الكريم</h1>
  <p>صفحات المصحف الشريف</p>
</header>

<a href="index.html" class="back">
  ← العودة للرئيسية
</a>

<!-- شريط الأدوات -->

<div class="toolbar">

  <!-- المزيد -->
  <button class="tool" onclick="openMenu()" title="المزيد">
    ☰
  </button>

  <!-- الصفحة -->
  <button class="tool" onclick="openPageModal()" title="انتقال إلى صفحة">
    🔢
  </button>

  <div class="page-info">
    صفحة <span id="pageNumber">1</span> / 604
  </div>

  <!-- علامة -->
  <button class="tool" onclick="bookmarkPage()" title="علامة مرجعية">
    🔖
  </button>

</div>


<!-- المصحف -->

<main class="reader">

  <div class="page-wrapper" id="pageWrapper">

    <div class="loading" id="loading">
      جاري تحميل صفحة المصحف...
    </div>

    <img
      id="quranPage"
      class="page"
      alt="صفحة المصحف"
      draggable="false"
      style="display:none;"
    >

  </div>

  <div class="hint">
    👆 اسحب بإصبعك يمينًا أو يسارًا لتقليب الصفحات
  </div>

</main>


<!-- القائمة الجانبية -->

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="menu" id="menu">

  <h2>المزيد</h2>

  <button onclick="goLastPage(); closeMenu();">
    🕘 آخر قراءة
  </button>

  <button onclick="goBookmark(); closeMenu();">
    🔖 الذهاب إلى العلامة المرجعية
  </button>

  <button onclick="zoomIn();">
    🔍 تكبير
  </button>

  <button onclick="zoomOut();">
    🔎 تصغير
  </button>

  <button onclick="toggleDark();">
    🌙 الوضع الليلي
  </button>

  <button onclick="resetZoom();">
    ↔️ الحجم الطبيعي
  </button>

  <button onclick="openPageModal(); closeMenu();">
    🔢 الانتقال إلى صفحة
  </button>

  <button onclick="closeMenu()">
    ✕ إغلاق
  </button>

</div>


<!-- نافذة اختيار الصفحة -->

<div class="modal" id="pageModal">

  <div class="modal-box">

    <h3>الانتقال إلى صفحة</h3>

    <input
      id="pageInput"
      type="number"
      min="1"
      max="604"
      placeholder="1 - 604"
    >

    <button onclick="confirmPage()">
      انتقال
    </button>

    <button onclick="closePageModal()">
      إلغاء
    </button>

  </div>

</div>


<script>

const TOTAL_PAGES = 604;

let currentPage =
  parseInt(
    localStorage.getItem("quranPage") || "1"
  );

let zoom = 1;

const image =
  document.getElementById("quranPage");

const loading =
  document.getElementById("loading");

const pageNumber =
  document.getElementById("pageNumber");

const pageWrapper =
  document.getElementById("pageWrapper");

const menu =
  document.getElementById("menu");

const overlay =
  document.getElementById("overlay");

const pageModal =
  document.getElementById("pageModal");

const pageInput =
  document.getElementById("pageInput");


/* =========================
   تحميل الصفحة
========================= */

function loadPage(page){

  page = parseInt(page);

  if(page < 1)
    page = 1;

  if(page > TOTAL_PAGES)
    page = TOTAL_PAGES;

  currentPage = page;

  pageNumber.textContent =
    currentPage;

  loading.style.display =
    "flex";

  image.style.display =
    "none";

  image.onload = function(){

    loading.style.display =
      "none";

    image.style.display =
      "block";

    applyZoom();

  };

  image.onerror = function(){

    loading.textContent =
      "تعذر تحميل صفحة " +
      currentPage;

  };

  image.src =
    currentPage + ".png";

  localStorage.setItem(
    "quranPage",
    currentPage
  );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================
   السحب
========================= */

let startX = 0;
let startY = 0;

pageWrapper.addEventListener(
  "touchstart",
  function(e){

    const touch =
      e.touches[0];

    startX =
      touch.clientX;

    startY =
      touch.clientY;

  },
  {passive:true}
);


pageWrapper.addEventListener(
  "touchend",
  function(e){

    const touch =
      e.changedTouches[0];

    const endX =
      touch.clientX;

    const endY =
      touch.clientY;

    const dx =
      endX - startX;

    const dy =
      endY - startY;

    if(
      Math.abs(dy) >
      Math.abs(dx)
    ){
      return;
    }

    if(
      Math.abs(dx) < 60
    ){
      return;
    }

    /*
      السحب من اليمين إلى اليسار
      = الصفحة التالية
    */

    if(dx < 0){

      if(
        currentPage <
        TOTAL_PAGES
      ){

        loadPage(
          currentPage + 1
        );

      }

    }

    /*
      السحب من اليسار إلى اليمين
      = الصفحة السابقة
    */

    else{

      if(
        currentPage > 1
      ){

        loadPage(
          currentPage - 1
        );

      }

    }

  },
  {passive:true}
);


/* =========================
   العلامة المرجعية
========================= */

function bookmarkPage(){

  localStorage.setItem(
    "quranBookmark",
    currentPage
  );

  alert(
    "تم حفظ الصفحة " +
    currentPage +
    " كعلامة مرجعية."
  );
}


function goBookmark(){

  const bookmark =
    localStorage.getItem(
      "quranBookmark"
    );

  if(bookmark){

    loadPage(
      parseInt(bookmark)
    );

  }else{

    alert(
      "لا توجد علامة مرجعية محفوظة."
    );

  }
}


/* =========================
   آخر قراءة
========================= */

function goLastPage(){

  const last =
    localStorage.getItem(
      "quranPage"
    );

  if(last){

    loadPage(
      parseInt(last)
    );

  }
}


/* =========================
   التكبير
========================= */

function zoomIn(){

  if(zoom < 2.5){

    zoom += 0.1;

    applyZoom();

  }
}


function zoomOut(){

  if(zoom > 0.5){

    zoom -= 0.1;

    applyZoom();

  }
}


function resetZoom(){

  zoom = 1;

  applyZoom();

}


function applyZoom(){

  image.style.width =
    (zoom * 100) + "%";
}


/* =========================
   الوضع الليلي
========================= */

function toggleDark(){

  document.body.classList.toggle(
    "dark"
  );

  localStorage.setItem(
    "quranDark",
    document.body.classList.contains(
      "dark"
    )
  );
}


if(
  localStorage.getItem(
    "quranDark"
  ) === "true"
){

  document.body.classList.add(
    "dark"
  );

}


/* =========================
   القائمة
========================= */

function openMenu(){

  menu.classList.add(
    "open"
  );

  overlay.classList.add(
    "show"
  );

}


function closeMenu(){

  menu.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "show"
  );

}


/* =========================
   نافذة الصفحة
========================= */

function openPageModal(){

  pageModal.classList.add(
    "show"
  );

  pageInput.value =
    currentPage;

  setTimeout(
    function(){
      pageInput.focus();
    },
    100
  );
}


function closePageModal(){

  pageModal.classList.remove(
    "show"
  );

}


function confirmPage(){

  const page =
    parseInt(
      pageInput.value
    );

  if(
    page >= 1 &&
    page <= TOTAL_PAGES
  ){

    loadPage(page);

    closePageModal();

  }else{

    alert(
      "أدخل رقمًا من 1 إلى 604."
    );

  }
}


/* =========================
   زر Enter
========================= */

pageInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      confirmPage();

    }

  }
);


/* =========================
   تشغيل آخر صفحة
========================= */

loadPage(currentPage);

</script>

</body>
</html>
