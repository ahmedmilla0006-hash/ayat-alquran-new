<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

<title>القرآن الكريم - صفحات المصحف</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #f3efe4;
  color: #222;
  font-family: Tahoma, Arial, sans-serif;
  min-height: 100%;
}

body.dark {
  background: #151515;
  color: #eee;
}

header {
  background: #146b2f;
  color: white;
  padding: 14px 10px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 20;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 5px 0 0;
  font-size: 14px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  padding: 10px;
  background: #eee9dc;
  position: sticky;
  top: 74px;
  z-index: 19;
}

body.dark .controls {
  background: #222;
}

button,
select {
  border: none;
  border-radius: 9px;
  padding: 9px 12px;
  font-size: 15px;
  background: #146b2f;
  color: white;
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

.page-number {
  font-weight: bold;
  min-width: 100px;
  text-align: center;
}

.reader {
  width: 100%;
  max-width: 850px;
  margin: 12px auto 80px;
  padding: 0 8px;
  text-align: center;
}

.page-container {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: white;
  border-radius: 5px;
  box-shadow: 0 2px 12px rgba(0,0,0,.18);
  touch-action: pan-y;
}

.page {
  display: block;
  width: 100%;
  height: auto;
  margin: auto;
  user-select: none;
  -webkit-user-drag: none;
}

.loading {
  padding: 40px 10px;
  font-size: 18px;
}

.bottom-controls {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(20,107,47,.96);
  padding: 8px;
  display: flex;
  justify-content: center;
  gap: 8px;
  z-index: 30;
}

.bottom-controls button {
  background: white;
  color: #146b2f;
  min-width: 90px;
}

.info {
  text-align: center;
  margin-top: 10px;
  color: #555;
  font-size: 13px;
}

body.dark .info {
  color: #bbb;
}

@media (max-width: 600px) {
  header h1 {
    font-size: 22px;
  }

  .controls {
    top: 69px;
  }

  button,
  select {
    padding: 8px 10px;
    font-size: 14px;
  }

  .reader {
    padding: 0 4px;
    margin-top: 8px;
  }
}
</style>
</head>

<body>

<header>
  <h1>القرآن الكريم</h1>
  <p>صفحات المصحف الشريف</p>
</header>

<div class="controls">

  <button onclick="previousPage()">‹ السابق</button>

  <span class="page-number">
    صفحة <span id="pageNumber">1</span> / 604
  </span>

  <button onclick="nextPage()">التالي ›</button>

  <button onclick="zoomOut()">−</button>
  <button onclick="zoomIn()">+</button>

  <button onclick="toggleDark()">🌙</button>

  <select id="pageSelect" onchange="goToPage(this.value)">
  </select>

</div>

<main class="reader">

  <div class="page-container" id="pageContainer">

    <div class="loading" id="loading">
      جاري تحميل صفحة المصحف...
    </div>

    <img
      id="quranPage"
      class="page"
      alt="صفحة القرآن الكريم"
      draggable="false"
      style="display:none;"
    >

  </div>

  <div class="info">
    اسحب الصفحة يمينًا أو يسارًا للتنقل
  </div>

</main>

<div class="bottom-controls">

  <button onclick="previousPage()">← الصفحة السابقة</button>

  <button onclick="nextPage()">الصفحة التالية →</button>

</div>

<script>

const totalPages = 604;

let currentPage =
  parseInt(localStorage.getItem("quranPage") || "1");

let zoom = 1;

const image = document.getElementById("quranPage");
const loading = document.getElementById("loading");
const pageNumber = document.getElementById("pageNumber");
const pageSelect = document.getElementById("pageSelect");
const container = document.getElementById("pageContainer");


// إنشاء قائمة الصفحات
for (let i = 1; i <= totalPages; i++) {

  const option = document.createElement("option");

  option.value = i;
  option.textContent = "الصفحة " + i;

  pageSelect.appendChild(option);
}


// تحميل الصفحة
function loadPage(page) {

  if (page < 1) page = 1;
  if (page > totalPages) page = totalPages;

  currentPage = page;

  pageNumber.textContent = page;
  pageSelect.value = page;

  loading.style.display = "block";
  image.style.display = "none";

  image.onload = function() {

    loading.style.display = "none";
    image.style.display = "block";

    applyZoom();
  };

  image.onerror = function() {

    loading.textContent =
      "تعذر تحميل الصفحة رقم " + page +
      ". تأكد أن الملف " + page + ".png موجود في المستودع.";
  };

  image.src = page + ".png";

  localStorage.setItem("quranPage", page);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


// الصفحة التالية
function nextPage() {

  if (currentPage < totalPages) {
    loadPage(currentPage + 1);
  }

}


// الصفحة السابقة
function previousPage() {

  if (currentPage > 1) {
    loadPage(currentPage - 1);
  }

}


// الانتقال إلى صفحة
function goToPage(page) {

  loadPage(parseInt(page));

}


// التكبير
function zoomIn() {

  if (zoom < 2.5) {
    zoom += 0.1;
    applyZoom();
  }

}


// التصغير
function zoomOut() {

  if (zoom > 0.5) {
    zoom -= 0.1;
    applyZoom();
  }

}


// تطبيق التكبير
function applyZoom() {

  image.style.width = (zoom * 100) + "%";
}


// الوضع الليلي
function toggleDark() {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "quranDark",
    document.body.classList.contains("dark")
  );

}


// استعادة الوضع الليلي
if (localStorage.getItem("quranDark") === "true") {
  document.body.classList.add("dark");
}


// السحب باللمس
let touchStartX = 0;
let touchEndX = 0;

container.addEventListener("touchstart", function(e) {

  touchStartX = e.changedTouches[0].screenX;

}, {passive: true});


container.addEventListener("touchend", function(e) {

  touchEndX = e.changedTouches[0].screenX;

  const distance = touchEndX - touchStartX;

  if (Math.abs(distance) > 60) {

    if (distance > 0) {
      previousPage();
    } else {
      nextPage();
    }

  }

}, {passive: true});


// لوحة المفاتيح
document.addEventListener("keydown", function(e) {

  if (e.key === "ArrowRight") {
    nextPage();
  }

  if (e.key === "ArrowLeft") {
    previousPage();
  }

});


// تشغيل أول صفحة
loadPage(currentPage);

</script>

</body>
</html>
