<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>القرآن الكريم</title>

<style>
:root{
  --green:#16803b;
  --green-dark:#10672f;
  --cream:#f5f0e7;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--cream);
  font-family:Tahoma,Arial,sans-serif;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--cream);
}

.reader{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  display:flex;
  justify-content:center;
  background:#fff;
}

.page-area{
  width:100%;
  height:100%;
  overflow:auto;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  touch-action:pan-y;
}

.page{
  height:100%;
  width:auto;
  max-width:100%;
  object-fit:contain;
  object-position:top center;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
  transform-origin:center top;
}

.menu-button{
  position:absolute;
  top:16px;
  left:16px;
  z-index:20;
  width:56px;
  height:56px;
  border:0;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  font-size:31px;
  line-height:56px;
  padding:0;
  box-shadow:0 4px 12px #0004;
  cursor:pointer;
}

.player{
  flex:none;
  width:100%;
  background:#fff;
  border-radius:24px 24px 0 0;
  box-shadow:0 -5px 20px #0002;
  padding:10px 16px 12px;
  z-index:30;
}

.player-top{
  display:flex;
  align-items:center;
  gap:10px;
  direction:rtl;
}

.reader-photo{
  width:56px;
  height:56px;
  flex:none;
  border-radius:50%;
  background:#e9eee9;
  border:2px solid var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.reader-data{
  flex:1;
  min-width:0;
}

.reader-row{
  display:flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
}

.reader-label{
  font-size:13px;
  color:#666;
}

.reader-name{
  color:var(--green);
  font-size:15px;
  font-weight:bold;
  overflow:hidden;
  text-overflow:ellipsis;
}

.readers-title{
  margin-top:6px;
  font-size:17px;
  font-weight:bold;
}

.reader-select{
  min-width:180px;
  border:1px solid #d4cbb9;
  border-radius:10px;
  background:#fff;
  padding:9px 8px;
  font:inherit;
}

.progress-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
  direction:rtl;
}

.progress{
  flex:1;
  height:6px;
  appearance:none;
  -webkit-appearance:none;
  border-radius:10px;
  background:#c8c8c8;
  overflow:hidden;
}

.progress::-webkit-progress-bar{
  background:#c8c8c8;
}

.progress::-webkit-progress-value{
  background:var(--green);
}

.progress::-moz-progress-bar{
  background:var(--green);
}

.progress-time{
  min-width:38px;
  font-size:12px;
  color:#555;
  text-align:center;
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  direction:rtl;
  margin-top:8px;
}

.control{
  width:68px;
  border:0;
  background:transparent;
  color:var(--green);
  font-family:inherit;
  cursor:pointer;
}

.control-icon{
  height:35px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:26px;
  font-weight:bold;
}

.control-text{
  margin-top:1px;
  color:#666;
  font-size:12px;
}

.play-button{
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  font-size:25px;
  box-shadow:0 3px 8px #0003;
  cursor:pointer;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:80;
  background:#0007;
  display:none;
}

.overlay.show{
  display:block;
}

.side-menu{
  position:fixed;
  top:0;
  left:0;
  width:min(76vw,520px);
  height:100dvh;
  z-index:100;
  background:#202020;
  padding:28px 26px 30px;
  overflow-y:auto;
  transform:translateX(-105%);
  transition:transform .25s ease;
  box-shadow:8px 0 25px #0007;
}

.side-menu.open{
  transform:translateX(0);
}

.side-menu h2{
  margin:14px 0 42px;
  text-align:center;
  color:var(--green);
  font-size:29px;
  font-weight:bold;
}

.menu-item{
  display:block;
  width:100%;
  margin:0 0 16px;
  padding:17px 22px;
  min-height:70px;
  border:0;
  border-radius:16px;
  background:var(--green);
  color:#fff;
  text-align:right;
  font-family:inherit;
  font-size:19px;
  box-shadow:0 2px 4px #0003;
  cursor:pointer;
}

.menu-item:active{
  background:var(--green-dark);
  transform:scale(.99);
}

.popup-overlay{
  position:fixed;
  inset:0;
  z-index:200;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.popup-overlay.show{
  display:flex;
}

.popup-box{
  width:min(94vw,520px);
  max-height:90vh;
  background:#202020;
  border-radius:22px;
  padding:18px;
  box-shadow:0 10px 40px #0009;
  display:flex;
  flex-direction:column;
}

.popup-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.popup-header h2{
  margin:0;
  color:var(--green);
  font-size:24px;
}

.popup-close{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  font-size:21px;
  cursor:pointer;
}

.popup-list{
  overflow-y:auto;
  padding:3px;
}

.popup-item{
  display:block;
  width:100%;
  border:0;
  border-radius:13px;
  background:var(--green);
  color:#fff;
  padding:14px 16px;
  margin-bottom:9px;
  font-family:inherit;
  font-size:17px;
  text-align:right;
  cursor:pointer;
}

.popup-item:active{
  background:var(--green-dark);
}

.popup-item small{
  opacity:.8;
}

.night-mode .app,
.night-mode .reader,
.night-mode .page-area{
  background:#202020;
}

.night-mode .player{
  background:#202020;
  color:#fff;
}

.night-mode .reader-label,
.night-mode .control-text,
.night-mode .progress-time{
  color:#ccc;
}

.night-mode .reader-select{
  background:#303030;
  color:#fff;
  border-color:#555;
}

@media(max-width:600px){

  .side-menu{
    width:76vw;
    padding:24px 26px 28px;
  }

  .side-menu h2{
    font-size:28px;
    margin-bottom:40px;
  }

  .menu-item{
    min-height:68px;
    margin-bottom:16px;
    padding:16px 20px;
    font-size:18px;
    border-radius:16px;
  }

  .menu-button{
    top:14px;
    left:14px;
  }

  .player{
    padding:9px 12px 10px;
  }

  .reader-select{
    min-width:150px;
    max-width:190px;
  }

  .reader-photo{
    width:52px;
    height:52px;
  }

  .control{
    width:61px;
  }

  .control-icon{
    font-size:24px;
  }
}
</style>
</head>

</div>

<div class="overlay" id="overlay"></div>

<aside class="side-menu" id="sideMenu">

  <h2>القرآن الكريم</h2>

  <button class="menu-item" id="surahsButton">
    📖 السور
  </button>

  <button class="menu-item" id="juzButton">

  </button>

  <button class="menu-item" id="searchButton">
    🔎 البحث
  </button>

    🔖 حفظ الصفحة الحالية
  </button>

  <button class="menu-item" id="bookmarkButton">
    🕘 الذهاب إلى العلامة المرجعية
  </button>

  <button class="menu-item" id="nightButton">
    🌙 الوضع الليلي
  </button>

  <button class="menu-item" id="zoomInButton">
    🔍 تكبير
  </button>

  <button class="menu-item" id="zoomOutButton">
    🔍 تصغير
  </button>

  <button class="menu-item" id="zoomResetButton">
    ↔️ الحجم الطبيعي
  </button>

  <button class="menu-item" id="recitersButton">
    🎧 القراء والتلاوات
  </button>

  <button class="menu-item" id="closeMenu">
    ✕ إغلاق
  </button>

</aside>

<!-- نافذة السور -->

<div class="popup-overlay" id="surahOverlay">

  <div class="popup-box">

    <div class="popup-header">

      <h2>سور القرآن الكريم</h2>

      <button class="popup-close" id="surahClose">
        ✕
      </button>

    </div>

    <div class="popup-list" id="surahList"></div>

  </div>

</div>

<!-- نافذة الأجزاء -->

<div class="popup-overlay" id="juzOverlay">

  <div class="popup-box">

    <div class="popup-header">

      <h2>الأجزاء</h2>

      <button class="popup-close" id="juzClose">
        ✕
      </button>

    </div>

    <div class="popup-list" id="juzList"></div>

  </div>

</div>

<audio id="audio"></audio>

<script>

const TOTAL_PAGES = 604;

let currentPage =
  Number(localStorage.getItem("quranPage") || 3);

let startX = 0;

const page =
  document.getElementById("quranPage");

const pageArea =
  document.getElementById("pageArea");

const audio =
  document.getElementById("audio");

const playButton =
  document.getElementById("playButton");

const progress =
  document.getElementById("progress");

const currentTime =
  document.getElementById("currentTime");

const duration =
  document.getElementById("duration");

const readerSelect =
  document.getElementById("readerSelect");

const readerName =
  document.getElementById("readerName");

const menuButton =
  document.getElementById("menuButton");

const sideMenu =
  document.getElementById("sideMenu");

const overlay =
  document.getElementById("overlay");

const closeMenu =
  document.getElementById("closeMenu");

const surahOverlay =
  document.getElementById("surahOverlay");

const surahList =
  document.getElementById("surahList");

const surahClose =
  document.getElementById("surahClose");

const juzOverlay =
  document.getElementById("juzOverlay");

const juzList =
  document.getElementById("juzList");

const juzClose =
  document.getElementById("juzClose");


/* =========================
   تحميل الصفحة
========================= */

function loadPage(n){

  currentPage =
    Math.max(
      1,
      Math.min(TOTAL_PAGES,n)
    );

  localStorage.setItem(
    "quranPage",
    currentPage
  );

  page.src =
    "images/" +
    currentPage +
    ".png";

}


/* =========================
   الصفحة التالية
========================= */

function nextPage(){

  if(currentPage < TOTAL_PAGES){

    loadPage(
      currentPage + 1
    );

  }

}


/* =========================
   الصفحة السابقة
========================= */

function prevPage(){

  if(currentPage > 1){

    loadPage(
      currentPage - 1
    );

  }

}


/* =========================
   السحب
========================= */

pageArea.addEventListener(
  "touchstart",
  e=>{

    startX =
      e.touches[0].clientX;

  },
  {passive:true}
);

pageArea.addEventListener(
  "touchend",
  e=>{

    const endX =
      e.changedTouches[0].clientX;

    const dx =
      endX - startX;

    if(Math.abs(dx) < 60){
      return;
    }

    if(dx < 0){
      prevPage();
    }else{
      nextPage();
    }

  },
  {passive:true}
);


/* =========================
   القائمة
========================= */

function openMenu(){

  sideMenu.classList.add("open");

  overlay.classList.add("show");

}

function closeSideMenu(){

  sideMenu.classList.remove("open");

  overlay.classList.remove("show");

}

menuButton.onclick =
  openMenu;

closeMenu.onclick =
  closeSideMenu;

overlay.onclick =
  closeSideMenu;


/* =========================
   القراء
========================= */

readerSelect.onchange = ()=>{

  readerName.textContent =
    readerSelect.options[
      readerSelect.selectedIndex
    ].text;

};


/* =========================
   الوقت
========================= */

function fmt(s){

  if(!Number.isFinite(s)){
    return "0:00";
  }

  return (
    Math.floor(s / 60)
    +
    ":"
    +
    String(
      Math.floor(s % 60)
    ).padStart(2,"0")
  );

}

audio.addEventListener(
  "loadedmetadata",
  ()=>{

    duration.textContent =
      fmt(audio.duration);

  }
);

audio.addEventListener(
  "timeupdate",
  ()=>{

    currentTime.textContent =
      fmt(audio.currentTime);

    progress.value =
      audio.duration
      ?
      audio.currentTime /
      audio.duration *
      100
      :
      0;

  }
);


/* =========================
   التشغيل
========================= */

playButton.onclick = ()=>{

  if(!audio.src){

    alert(
      "ملفات التلاوة تحتاج إلى ربطها بالمصادر الصوتية."
    );

    return;

  }

  if(audio.paused){

    audio.play();

    playButton.textContent =
      "Ⅱ";

  }else{

    audio.pause();

    playButton.textContent =
      "▶";

  }

};


/* =========================
   التحكم بالصوت
========================= */

document.getElementById(
  "backButton"
).onclick = ()=>{

  audio.currentTime =
    Math.max(
      0,
      audio.currentTime - 10
    );

};

document.getElementById(
  "forwardButton"
).onclick = ()=>{

  audio.currentTime =
    Math.min(
      audio.duration || Infinity,
      audio.currentTime + 10
    );

};


/* =========================
   أزرار الصفحات
========================= */

document.getElementById(
  "prevButton"
).onclick =
  prevPage;

document.getElementById(
  "nextButton"
).onclick =
  nextPage;


/* =========================
   حفظ الصفحة
========================= */

document.getElementById(
  "saveButton"
).onclick = ()=>{

  localStorage.setItem(
    "quranSavedPage",
    String(currentPage)
  );

  alert(
    "تم حفظ الصفحة الحالية: " +
    currentPage
  );

};


/* =========================
   العلامة المرجعية
========================= */

document.getElementById(
  "bookmarkButton"
).onclick = ()=>{

  const saved =
    Number(
      localStorage.getItem(
        "quranSavedPage"
      ) || 0
    );

  if(saved){

    loadPage(saved);

  }else{

    alert(
      "لا توجد علامة مرجعية محفوظة بعد."
    );

  }

  closeSideMenu();

};


/* =========================
   الوضع الليلي
========================= */

document.getElementById(
  "nightButton"
).onclick = ()=>{

  document.body.classList.toggle(
    "night-mode"
  );

};


/* =========================
   التكبير والتصغير
========================= */

let pageScale = 1;

document.getElementById(
  "zoomInButton"
).onclick = ()=>{

  pageScale =
    Math.min(
      2.2,
      pageScale + 0.15
    );

  page.style.transform =
    "scale(" +
    pageScale +
    ")";

};

document.getElementById(
  "zoomOutButton"
).onclick = ()=>{

  pageScale =
    Math.max(
      0.7,
      pageScale - 0.15
    );

  page.style.transform =
    "scale(" +
    pageScale +
    ")";

};

document.getElementById(
  "zoomResetButton"
).onclick = ()=>{

  pageScale = 1;

  page.style.transform =
    "scale(1)";

};
