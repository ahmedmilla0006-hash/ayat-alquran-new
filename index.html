<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>القرآن الكريم</title>

<style>
:root{
  --green:#16803b;
  --green-dark:#10672f;
  --cream:#f5f0e7;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--cream);
  font-family:Tahoma,Arial,sans-serif;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--cream);
}

.reader{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  display:flex;
  justify-content:center;
  background:#fff;
}

.page-area{
  width:100%;
  height:100%;
  overflow:auto;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  touch-action:pan-y;
}

.page{
  height:100%;
  width:auto;
  max-width:100%;
  object-fit:contain;
  object-position:top center;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
  transform-origin:center top;
}

.menu-button{
  position:absolute;
  top:16px;
  left:16px;
  z-index:20;
  width:56px;
  height:56px;
  border:0;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  font-size:31px;
  line-height:56px;
  padding:0;
  box-shadow:0 4px 12px #0004;
  cursor:pointer;
}

.player{
  flex:none;
  width:100%;
  background:#fff;
  border-radius:24px 24px 0 0;
  box-shadow:0 -5px 20px #0002;
  padding:10px 16px 12px;
  z-index:30;
}

.player-top{
  display:flex;
  align-items:flex-end;
  gap:12px;
  direction:rtl;
}

.select-group{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.select-label{
  font-size:13px;
  color:#666;
  font-weight:bold;
}

.reader-select{
  width:100%;
  border:1px solid #d4cbb9;
  border-radius:10px;
  background:#fff;
  padding:9px 8px;
  font:inherit;
  font-size:14px;
}

/* إبقاء العنصر مخفياً حتى لا يتعطل كود جافاسكربت القديم */
.reader-name{
  display:none;
}

.progress-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
  direction:rtl;
}

.progress{
  flex:1;
  height:6px;
  appearance:none;
  -webkit-appearance:none;
  border-radius:10px;
  background:#c8c8c8;
  overflow:hidden;
}

.progress::-webkit-progress-bar{
  background:#c8c8c8;
}

.progress::-webkit-progress-value{
  background:var(--green);
}

.progress::-moz-progress-bar{
  background:var(--green);
}

.progress-time{
  min-width:38px;
  font-size:12px;
  color:#555;
  text-align:center;
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  direction:rtl;
  margin-top:8px;
}

.control{
  width:68px;
  border:0;
  background:transparent;
  color:var(--green);
  font-family:inherit;
  cursor:pointer;
}

.control-icon{
  height:35px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:26px;
  font-weight:bold;
}

.control-text{
  margin-top:1px;
  color:#666;
  font-size:12px;
}

.play-button{
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  font-size:25px;
  box-shadow:0 3px 8px #0003;
  cursor:pointer;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:80;
  background:#0007;
  display:none;
}

.overlay.show{
  display:block;
}

.side-menu{
  position:fixed;
  top:0;
  left:0;
  width:min(76vw,520px);
  height:100dvh;
  z-index:100;
  background:#202020;
  padding:28px 26px 30px;
  overflow-y:auto;
  transform:translateX(-105%);
  transition:transform .25s ease;
  box-shadow:8px 0 25px #0007;
}

.side-menu.open{
  transform:translateX(0);
}

.side-menu h2{
  margin:14px 0 42px;
  text-align:center;
  color:var(--green);
  font-size:29px;
  font-weight:bold;
}

.menu-item{
  display:block;
  width:100%;
  margin:0 0 16px;
  padding:17px 22px;
  min-height:70px;
  border:0;
  border-radius:16px;
  background:var(--green);
  color:#fff;
  text-align:right;
  font-family:inherit;
  font-size:19px;
  box-shadow:0 2px 4px #0003;
  cursor:pointer;
}

.menu-item:active{
  background:var(--green-dark);
  transform:scale(.99);
}

.popup-overlay{
  position:fixed;
  inset:0;
  z-index:200;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.popup-overlay.show{
  display:flex;
}

.popup-box{
  width:min(94vw,520px);
  max-height:90vh;
  background:#202020;
  border-radius:22px;
  padding:18px;
  box-shadow:0 10px 40px #0009;
  display:flex;
  flex-direction:column;
}

.popup-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.popup-header h2{
  margin:0;
  color:var(--green);
  font-size:24px;
}

.popup-close{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  font-size:21px;
  cursor:pointer;
}

.popup-list{
  overflow-y:auto;
  padding:3px;
}

.popup-item{
  display:block;
  width:100%;
  border:0;
  border-radius:13px;
  background:var(--green);
  color:#fff;
  padding:14px 16px;
  margin-bottom:9px;
  font-family:inherit;
  font-size:17px;
  text-align:right;
  cursor:pointer;
}

.popup-item:active{
  background:var(--green-dark);
}

.popup-item small{
  opacity:.8;
}

.night-mode .app,
.night-mode .reader,
.night-mode .page-area{
  background:#202020;
}

.night-mode .player{
  background:#202020;
  color:#fff;
}

.night-mode .select-label,
.night-mode .control-text,
.night-mode .progress-time{
  color:#ccc;
}

.night-mode .reader-select{
  background:#303030;
  color:#fff;
  border-color:#555;
}


.search-box{
  width:min(94vw,560px);
}
.search-form{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.search-input{
  flex:1;
  min-width:0;
  border:1px solid #555;
  border-radius:12px;
  background:#303030;
  color:#fff;
  padding:13px 14px;
  font:inherit;
  font-size:17px;
  outline:none;
  direction:rtl;
}
.search-input:focus{
  border-color:var(--green);
}
.search-submit{
  width:58px;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:#fff;
  font-size:22px;
  cursor:pointer;
}
.search-hint{
  color:#bbb;
  font-size:13px;
  margin:0 0 10px;
  line-height:1.7;
}
.search-status{
  color:#bbb;
  text-align:center;
  padding:12px 4px;
  font-size:14px;
}
.search-result{
  text-align:right;
  line-height:1.7;
}
.search-result-title{
  font-weight:bold;
}
.search-result-meta{
  display:block;
  font-size:12px;
  opacity:.8;
  margin-top:2px;
}
.search-result-text{
  display:block;
  margin-top:6px;
  font-size:14px;
  line-height:2;
}

.about-box{
  text-align:center;
}
.about-content{
  color:#eee;
  line-height:2.1;
  font-size:17px;
  padding:10px 8px 18px;
}
.about-name{
  color:var(--green);
  font-size:25px;
  font-weight:bold;
  margin-bottom:8px;
}
.about-developer{
  font-size:18px;
  margin-bottom:4px;
}
.about-copy{
  color:#bbb;
  font-size:14px;
  margin-bottom:18px;
}
.about-dua{
  color:#fff;
  font-size:16px;
  margin:4px 0;
}

@media(max-width:600px){

  .side-menu{
    width:76vw;
    padding:24px 26px 28px;
  }

  .side-menu h2{
    font-size:28px;
    margin-bottom:40px;
  }

  .menu-item{
    min-height:68px;
    margin-bottom:16px;
    padding:16px 20px;
    font-size:18px;
    border-radius:16px;
  }

  .menu-button{
    top:14px;
    left:14px;
  }

  .player{
    padding:9px 12px 10px;
  }

  .reader-select{
    font-size:13px;
    padding:8px 6px;
  }

  .control{
    width:61px;
  }

  .control-icon{
    font-size:24px;
  }
}

/* === تظليل الآية فوق صورة المصحف === */
.page-area{position:relative;}
.ayah-highlight-layer{
  position:absolute;
  pointer-events:none;
  z-index:15;
  display:none;
  overflow:visible;
}
.ayah-highlight-layer polygon{
  fill:rgba(22,128,59,.18);
  stroke:rgba(16,103,47,.25);
  stroke-width:.6;
  pointer-events:none;
}

</style>
</head>

</div>

<div class="overlay" id="overlay"></div>

<script>

const TOTAL_PAGES = 604;

let currentPage =
  Number(localStorage.getItem("quranPage") || 3);

let startX = 0;

const page =
  document.getElementById("quranPage");

const pageArea =
  document.getElementById("pageArea");

const audio =
  document.getElementById("audio");

const playButton =
  document.getElementById("playButton");

const progress =
  document.getElementById("progress");

const currentTime =
  document.getElementById("currentTime");

const duration =
  document.getElementById("duration");

const readerSelect =
  document.getElementById("readerSelect");

const readerName =
  document.getElementById("readerName");

const menuButton =
  document.getElementById("menuButton");

const sideMenu =
  document.getElementById("sideMenu");

const overlay =
  document.getElementById("overlay");

const closeMenu =
  document.getElementById("closeMenu");

const surahOverlay =
  document.getElementById("surahOverlay");

const surahList =
  document.getElementById("surahList");

const surahClose =
  document.getElementById("surahClose");

const juzOverlay =
  document.getElementById("juzOverlay");

const juzList =
  document.getElementById("juzList");

const juzClose =
  document.getElementById("juzClose");

const aboutOverlay =
  document.getElementById("aboutOverlay");

const aboutButton =
  document.getElementById("aboutButton");

const aboutClose =
  document.getElementById("aboutClose");


/* =========================
   تحميل الصفحة
========================= */

let currentAudioSurah = null;

function loadPage(n, options = {}){

  currentPage =
    Math.max(
      1,
      Math.min(TOTAL_PAGES, n)
    );

  localStorage.setItem(
    "quranPage",
    currentPage
  );

  page.src =
    currentPage +
    ".png";

  clearAyahHighlight();

  // عندما تكون الصفحة التالية داخل نفس مسار التلاوة،
  // نغيّر الصورة فقط ولا نعيد تحميل ملف الصوت.
  if(options.keepAudio){
    syncHighlight();
    return;
  }

  updateAudioSource(
    false,
    {
      autoContinue: !!options.autoContinue,
      surahNumber: options.surahNumber || null
    }
  );
}


/* =========================
   الصفحة التالية
========================= */

/* =========================
   الصفحة التالية
========================= */

function nextPage(){

  if(currentPage < TOTAL_PAGES){

    loadPage(
      currentPage + 1
    );

  }

}


/* =========================
   الصفحة السابقة
========================= */

function prevPage(){

  if(currentPage > 1){

    loadPage(
      currentPage - 1
    );

  }

}


/* =========================
   السحب
========================= */

pageArea.addEventListener(
  "touchstart",
  e=>{

    startX =
      e.touches[0].clientX;

  },
  {passive:true}
);

pageArea.addEventListener(
  "touchend",
  e=>{

    const endX =
      e.changedTouches[0].clientX;

    const dx =
      endX - startX;

    if(Math.abs(dx) < 60){
      return;
    }

    if(dx < 0){
      prevPage();
    }else{
      nextPage();
    }

  },
  {passive:true}
);


/* =========================
   القائمة
========================= */

function openMenu(){

  sideMenu.classList.add("open");

  overlay.classList.add("show");

}

function closeSideMenu(){

  sideMenu.classList.remove("open");

  overlay.classList.remove("show");

}

menuButton.onclick =
  openMenu;

closeMenu.onclick =
  closeSideMenu;

overlay.onclick =
  closeSideMenu;


/* =========================
   القراء
========================= */

/* =========================
   القراء والتلاوات
========================= */

const RECITERS = {

  },

function getSurahNumberForPage(pageNumber){

  for(let i = 0; i < surahs.length; i++){

    const startPage = Number(surahs[i][1]);
    const nextStart =
      i < surahs.length - 1
        ? Number(surahs[i + 1][1])
        : TOTAL_PAGES + 1;

    if(pageNumber >= startPage && pageNumber < nextStart){
      return i + 1;
    }

  }

  return 1;
}

function getAudioUrl(readerKey, pageNumber, explicitSurah = null){

  const reader = RECITERS[readerKey];

  if(!reader) return "";

  const surahNumber =
    explicitSurah ||
    getSurahNumberForPage(pageNumber);

  const fileNumber =
    String(surahNumber).padStart(3, "0");

  return reader.server + fileNumber + ".mp3";
}

/* =========================
   مزامنة التلاوة مع الآية والصفحة
   يعتمد على MP3Quran Timing API:
   start_time / end_time / polygon / page
========================= */

const ayahHighlightLayer =
  document.getElementById("ayahHighlightLayer");

let timingCache = {};
let currentTiming = [];
let timingReadId = null;
let timingSurahLoaded = 0;
let timingLoading = false;
let timingToken = 0;

const TIMING_API =
  "https://mp3quran.net/api/v3/ayat_timing";

const READS_API =
  "https://mp3quran.net/api/v3/reciters?language=ar";

function clearAyahHighlight(){
  if(!ayahHighlightLayer) return;
  ayahHighlightLayer.innerHTML = "";
  ayahHighlightLayer.style.display = "none";
}

function pageFromTiming(item){
  if(!item || !item.page) return null;
  const m = String(item.page).match(/(\d{3})\.svg(?:\?|$)/i);
  return m ? Number(m[1]) : null;
}

/*
  صفحات 1 و 2 (الفاتحة وأول البقرة) في API:
    viewBox 0 0 235 235
  باقي الصفحات:
    viewBox 0 0 345 550
  صور المصحف عندك تقريباً 456×672.
*/
function getHighlightMapping(pageNumber){
  const n = Number(pageNumber) || currentPage;

  if(n <= 2){
    // صفحات خاصة — الإزاحة التي كانت صحيحة عندك
    return {
      mapX: (x) => x + 100,
      mapY: (y) => y + 270,
      viewW: 456,
      viewH: 672
    };
  }

  // باقي الصفحات: منطقة النص داخل الإطار الذهبي
  // تم ضبط الهوامش لتطابق صور المصحف (456×672)
  const marginLeft = 28;
  const marginRight = 28;
  const marginTop = 22;   // أقل = التظليل يرتفع للأعلى
  const marginBottom = 36;
  const contentW = 456 - marginLeft - marginRight;
  const contentH = 672 - marginTop - marginBottom;

  return {
    mapX: (x) => marginLeft + (x / 345) * contentW,
    mapY: (y) => marginTop  + (y / 550) * contentH,
    viewW: 456,
    viewH: 672
  };
}

function positionHighlightLayer(pageNumber){
  if(!ayahHighlightLayer || !page || !pageArea) return;

  const imageRect = page.getBoundingClientRect();
  const areaRect = pageArea.getBoundingClientRect();

  const left =
    imageRect.left - areaRect.left + pageArea.scrollLeft;

  const top =
    imageRect.top - areaRect.top + pageArea.scrollTop;

  ayahHighlightLayer.style.left = left + "px";
  ayahHighlightLayer.style.top = top + "px";
  ayahHighlightLayer.style.width = imageRect.width + "px";
  ayahHighlightLayer.style.height = imageRect.height + "px";

  const m = getHighlightMapping(pageNumber || currentPage);

  ayahHighlightLayer.setAttribute(
    "viewBox",
    "0 0 " + m.viewW + " " + m.viewH
  );
  ayahHighlightLayer.setAttribute("preserveAspectRatio","none");
  ayahHighlightLayer.setAttribute("width", imageRect.width);
  ayahHighlightLayer.setAttribute("height", imageRect.height);
}

function drawAyahHighlight(item){
  clearAyahHighlight();

  if(!item || !item.polygon || !page.complete) return;

  const targetPage =
    pageFromTiming(item) || currentPage;

  const pts = String(item.polygon)
    .trim()
    .split(/\s+/)
    .map(pair=>{
      const p = pair.split(",").map(Number);
      return p.length === 2 &&
             Number.isFinite(p[0]) &&
             Number.isFinite(p[1])
        ? p
        : null;
    })
    .filter(Boolean);

  if(!pts.length) return;

  const m = getHighlightMapping(targetPage);
  positionHighlightLayer(targetPage);

  const poly =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "polygon"
    );

  poly.setAttribute(
    "points",
    pts.map(p => m.mapX(p[0]) + "," + m.mapY(p[1])).join(" ")
  );

  ayahHighlightLayer.appendChild(poly);
  ayahHighlightLayer.style.display = "block";
}

/* =========================
   ضغط مطوّل (ثانيتان) على الآية لتشغيلها
   لا يحجب القائمة ولا تقليب الصفحات
========================= */

function pointInPolygon(x, y, pts){
  let inside = false;
  for(let i = 0, j = pts.length - 1; i < pts.length; j = i++){
    const xi = pts[i][0], yi = pts[i][1];
    const xj = pts[j][0], yj = pts[j][1];
    const intersect =
      ((yi > y) !== (yj > y)) &&
      (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi);
    if(intersect) inside = !inside;
  }
  return inside;
}

function getAyahAtPoint(clientX, clientY){
  if(!currentTiming.length || !page || !page.complete) return null;

  const imageRect = page.getBoundingClientRect();
  if(
    clientX < imageRect.left || clientX > imageRect.right ||
    clientY < imageRect.top  || clientY > imageRect.bottom
  ) return null;

  const relX = (clientX - imageRect.left) / imageRect.width;
  const relY = (clientY - imageRect.top)  / imageRect.height;

  const m = getHighlightMapping(currentPage);
  const vx = relX * m.viewW;
  const vy = relY * m.viewH;

  const pageItems = currentTiming.filter(
    item => pageFromTiming(item) === currentPage && item.polygon
  );

  for(const item of pageItems){
    const pts = String(item.polygon)
      .trim()
      .split(/\s+/)
      .map(pair => {
        const p = pair.split(",").map(Number);
        return p.length === 2 && Number.isFinite(p[0]) && Number.isFinite(p[1])
          ? [m.mapX(p[0]), m.mapY(p[1])]
          : null;
      })
      .filter(Boolean);

    if(pts.length >= 3 && pointInPolygon(vx, vy, pts)){
      return item;
    }
  }

  return null;
}

function playAyahFromTiming(item){
  if(!item) return;

  const startSec = Number(item.start_time || 0) / 1000;
  const surahOfAyah = getSurahNumberForPage(currentPage);

  // إذا كانت التلاوة الحالية لسورة أخرى → حمّل سورة الصفحة
  if(currentAudioSurah !== surahOfAyah || !audio.src){
    currentAudioSurah = surahOfAyah;
    updateAudioSource(false, {
      surahNumber: surahOfAyah,
      autoContinue: false
    });
    audio.addEventListener("loadedmetadata", function once(){
      audio.removeEventListener("loadedmetadata", once);
      try{ audio.currentTime = startSec; }catch(e){}
      audio.play().then(() => {
        playButton.textContent = "Ⅱ";
        drawAyahHighlight(item);
      }).catch(() => {});
    });
    return;
  }

  const seekAndPlay = () => {
    try{ audio.currentTime = startSec; }catch(e){}
    audio.play().then(() => {
      playButton.textContent = "Ⅱ";
      drawAyahHighlight(item);
    }).catch(() => {});
  };

  if(audio.readyState >= 1){
    seekAndPlay();
  }else{
    audio.addEventListener("loadedmetadata", function once(){
      audio.removeEventListener("loadedmetadata", once);
      seekAndPlay();
    });
  }
}

// ضغط مطوّل ثانية واحدة على الصفحة
const AYAH_LONG_PRESS_MS = 1000;
let longPressTimer = null;
let longPressStartX = 0;
let longPressStartY = 0;
let longPressMoved = false;

function cancelLongPress(){
  if(longPressTimer){
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }
}

pageArea.addEventListener("touchstart", (e) => {
  if(!e.touches || !e.touches[0]) return;
  // لا تفعّل إن كان الضغط على زر القائمة
  if(e.target.closest && e.target.closest(".menu-button")) return;

  longPressStartX = e.touches[0].clientX;
  longPressStartY = e.touches[0].clientY;
  longPressMoved = false;

  cancelLongPress();
  longPressTimer = setTimeout(() => {
    longPressTimer = null;
    if(longPressMoved) return;

    const item = getAyahAtPoint(longPressStartX, longPressStartY);
    if(item){
      playAyahFromTiming(item);
    }
  }, AYAH_LONG_PRESS_MS);
}, {passive: true});

pageArea.addEventListener("touchmove", (e) => {
  if(!e.touches || !e.touches[0]) return;
  const dx = e.touches[0].clientX - longPressStartX;
  const dy = e.touches[0].clientY - longPressStartY;
  if(Math.abs(dx) > 14 || Math.abs(dy) > 14){
    longPressMoved = true;
    cancelLongPress();
  }
}, {passive: true});

pageArea.addEventListener("touchend", cancelLongPress, {passive: true});
pageArea.addEventListener("touchcancel", cancelLongPress, {passive: true});

// للكمبيوتر: ضغط مطوّل بالماوس
pageArea.addEventListener("mousedown", (e) => {
  if(e.button !== 0) return;
  if(e.target.closest && e.target.closest(".menu-button")) return;

  longPressStartX = e.clientX;
  longPressStartY = e.clientY;
  longPressMoved = false;

  cancelLongPress();
  longPressTimer = setTimeout(() => {
    longPressTimer = null;
    if(longPressMoved) return;
    const item = getAyahAtPoint(longPressStartX, longPressStartY);
    if(item) playAyahFromTiming(item);
  }, AYAH_LONG_PRESS_MS);
});

pageArea.addEventListener("mousemove", (e) => {
  if(!longPressTimer) return;
  const dx = e.clientX - longPressStartX;
  const dy = e.clientY - longPressStartY;
  if(Math.abs(dx) > 14 || Math.abs(dy) > 14){
    longPressMoved = true;
    cancelLongPress();
  }
});

pageArea.addEventListener("mouseleave", cancelLongPress);

// قارئ احتياطي معروف أن له بيانات توقيت (السديس)
const FALLBACK_TIMING_READ_ID = 54;

async function getTimingReadId(){
  const reader = RECITERS[selectedReader];
  if(!reader) return FALLBACK_TIMING_READ_ID;

  if(timingCache["read:"+selectedReader] != null){
    return timingCache["read:"+selectedReader];
  }

  try{
    // أولاً: قائمة القراءات التي لديها توقيت آيات
    const res = await fetch(
      "https://mp3quran.net/api/v3/ayat_timing/reads",
      {cache:"force-cache"}
    );
    const list = await res.json();

    const wanted =
      String(reader.server || "").replace(/\/+$/,"").toLowerCase();

    if(Array.isArray(list)){
      for(const r of list){
        const folder =
          String(r.folder_url || "").replace(/\/+$/,"").toLowerCase();

        if(folder && wanted && (
          folder === wanted ||
          wanted.endsWith(folder.split("/").pop()) ||
          folder.endsWith(wanted.split("/").pop())
        )){
          const id = Number(r.id);
          timingCache["read:"+selectedReader] = id;
          return id;
        }
      }
    }
  }catch(e){}

  // لا توجد بيانات توقيت لهذا القارئ → نستخدم السديس للتظليل فقط
  timingCache["read:"+selectedReader] = FALLBACK_TIMING_READ_ID;
  return FALLBACK_TIMING_READ_ID;
}

async function loadTimingForCurrentSurah(){
  const surah = getSurahNumberForPage(currentPage);
  const token = ++timingToken;

  timingSurahLoaded = surah;
  currentTiming = [];

  const cacheKey =
    selectedReader + ":" + surah;

  if(timingCache[cacheKey]){
    currentTiming = timingCache[cacheKey];
    return;
  }

  timingLoading = true;

  try{
    const readId = await getTimingReadId();

    if(token !== timingToken) return;

    timingReadId = readId;

    if(!readId) return;

    const res =
      await fetch(
        TIMING_API +
        "?surah=" + surah +
        "&read=" + readId,
        {cache:"force-cache"}
      );

    if(!res.ok) return;

    const data = await res.json();

    if(token !== timingToken) return;

    currentTiming =
      Array.isArray(data)
        ? data.filter(x =>
            x &&
            x.ayah != null &&
            Number.isFinite(Number(x.start_time)) &&
            Number.isFinite(Number(x.end_time))
          )
        : [];

    timingCache[cacheKey] = currentTiming;

    syncHighlight();
  }catch(e){
    currentTiming = [];
  }finally{
    timingLoading = false;
  }
}

function itemsForCurrentPage(){
  return currentTiming.filter(
    item => pageFromTiming(item) === currentPage
  );
}

function seekAudioToCurrentPage(){
  const items = itemsForCurrentPage();

  if(!items.length) return;

  const first = items[0];

  try{
    audio.currentTime =
      Number(first.start_time || 0) / 1000;
  }catch(e){}
}

function getActiveTiming(){
  if(!currentTiming.length) return null;

  const t = audio.currentTime * 1000;

  return currentTiming.find(item =>
    t >= Number(item.start_time) &&
    t < Number(item.end_time)
  ) || null;
}

function syncHighlight(){
  if(!audio || !currentTiming.length) return;

  const active = getActiveTiming();

  if(!active) return;

  const targetPage =
    pageFromTiming(active);

  if(targetPage && targetPage !== currentPage){
    loadPage(
      targetPage,
      {keepAudio:true}
    );
    return;
  }

  if(targetPage === currentPage){
    drawAyahHighlight(active);
  }
}

function updateAudioSource(keepPosition = false, options = {}){

  const requestedSurah =
    options.surahNumber ||
    getSurahNumberForPage(currentPage);

  currentAudioSurah =
    Number(requestedSurah);

  const url =
    getAudioUrl(
      selectedReader,
      currentPage,
      currentAudioSurah
    );

  const oldTime = audio.currentTime || 0;
  const wasPlaying = !audio.paused;
  const autoContinue = !!options.autoContinue;

  audio.pause();
  audio.src = url;
  audio.load();

  currentTime.textContent = "0:00";
  duration.textContent = "0:00";
  progress.value = 0;
  playButton.textContent = "▶";
  clearAyahHighlight();

  loadTimingForCurrentSurah();

  audio.addEventListener("loadedmetadata", function restore(){
    audio.removeEventListener("loadedmetadata", restore);

    if(keepPosition){
      try{
        audio.currentTime = Math.min(oldTime, audio.duration || oldTime);
      }catch(e){}
    }else{
      seekAudioToCurrentPage();
    }

    syncHighlight();

    if(wasPlaying || autoContinue){
      audio.play().then(()=>{
        playButton.textContent = "Ⅱ";
      }).catch(()=>{});
    }
  });
}

/* =========================
   الوقت
========================= */

function fmt(s){

  if(!Number.isFinite(s)){
    return "0:00";
  }

  return (
    Math.floor(s / 60)
    +
    ":"
    +
    String(
      Math.floor(s % 60)
    ).padStart(2,"0")
  );

}

audio.addEventListener(
  "loadedmetadata",
  ()=>{

    duration.textContent =
      fmt(audio.duration);

  }
);

audio.addEventListener(
  "timeupdate",
  ()=>{

    currentTime.textContent =
      fmt(audio.currentTime);

    progress.value =
      audio.duration
      ?
      audio.currentTime /
      audio.duration *
      100
      :
      0;

    syncHighlight();

  }
);

audio.addEventListener(
  "error",
  ()=>{

    playButton.textContent = "▶";

  }
);

audio.addEventListener(
  "ended",
  ()=>{

    const finishedSurah =
      currentAudioSurah ||
      getSurahNumberForPage(currentPage);

    const nextSurah =
      finishedSurah + 1;

    if(nextSurah > surahs.length){
      playButton.textContent = "▶";
      return;
    }

    const nextSurahStartPage =
      Number(surahs[nextSurah - 1][1]);

    loadPage(
      nextSurahStartPage,
      {
        autoContinue: true,
        surahNumber: nextSurah
      }
    );

  }
);

const searchOverlay =
  document.getElementById("searchOverlay");

const searchClose =
  document.getElementById("searchClose");

const searchForm =
  document.getElementById("searchForm");

const searchInput =
  document.getElementById("searchInput");

const searchResults =
  document.getElementById("searchResults");

function normalizeArabic(text){

  return String(text || "")
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "")
    .replace(/[إأآٱ]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();

}

function openSearch(){

  closeSideMenu();

  searchOverlay.classList.add("show");

  searchResults.innerHTML = "";

  searchInput.value = "";

  setTimeout(() => searchInput.focus(), 80);

}

function closeSearch(){

  searchOverlay.classList.remove("show");

}

document.getElementById(
  "searchButton"
).onclick = openSearch;

searchClose.onclick = closeSearch;

searchOverlay.onclick = e => {

  if(e.target === searchOverlay){
    closeSearch();
  }

};

function addSearchResult(title, meta, text, targetPage){

  const button =
    document.createElement("button");

  button.className = "popup-item search-result";

  button.innerHTML =
    '<span class="search-result-title">' +
    title +
    '</span>' +
    '<span class="search-result-meta">' +
    meta +
    '</span>' +
    (text ?
      '<span class="search-result-text">' +
      text +
      '</span>' : '');

  button.onclick = () => {

    loadPage(targetPage);

    closeSearch();

  };

  searchResults.appendChild(button);

}

function searchLocal(query){

  const q =
    normalizeArabic(query);

  const numeric =
    Number(q);

  if(/^\d+$/.test(q) &&
     numeric >= 1 &&
     numeric <= TOTAL_PAGES){

    addSearchResult(
      "الصفحة " + numeric,
      "الانتقال مباشرة إلى الصفحة",
      "",
      numeric
    );

  }

  const matches =
    surahs.filter(item =>
      normalizeArabic(item[0]).includes(q) ||
      String(surahs.indexOf(item) + 1) === q
    );

  matches.forEach(item => {

    addSearchResult(
      "سورة " + item[0],
      "بداية السورة — الصفحة " + item[1],
      "",
      item[1]
    );

  });

  return matches.length > 0 ||
         (/^\d+$/.test(q) &&
          numeric >= 1 &&
          numeric <= TOTAL_PAGES);

}

async function searchWord(query){

  searchResults.innerHTML =
    '<div class="search-status">جاري البحث في القرآن…</div>';

  async function searchQuranHub(){

    const url =
      "https://api.quranhub.com/v1/search/" +
      encodeURIComponent(query) +
      "?language=ar";

    const response =
      await fetch(url, {
        method:"GET",
        headers:{
          "Accept":"application/json"
        }
      });

    if(!response.ok){
      throw new Error("QuranHub search failed");
    }

    const json =
      await response.json();

    const raw =
      json &&
      json.data &&
      Array.isArray(json.data.ayahs)
      ? json.data.ayahs
      : (
          json &&
          json.data &&
          Array.isArray(json.data.results)
          ? json.data.results
          : []
        );

    return raw.map(item=>{

      let surahNumber =
        item.surah &&
        Number(item.surah.number);

      let ayahNumber =
        Number(
          item.numberInSurah ||
          item.ayah ||
          0
        );

      let verseKey =
        item.verse_key ||
        (
          surahNumber &&
          ayahNumber
          ? surahNumber + ":" + ayahNumber
          : ""
        );

      if(!surahNumber && verseKey){

        const parts =
          String(verseKey).split(":");

        surahNumber =
          Number(parts[0]);

        ayahNumber =
          Number(parts[1]);

      }

      return {
        verseKey,
        surahNumber,
        ayahNumber,
        text:item.text || item.name || "",
        surahName:
          item.surah &&
          item.surah.name
          ? item.surah.name.replace(/^سورة\s*/,"")
          : "سورة",
        page:Number(item.page || 0)
      };

    }).filter(item =>
      item.surahNumber &&
      item.ayahNumber
    );

  }

  async function getAyahDetails(item){

    if(item.page && item.text){
      return item;
    }

    const url =
      "https://api.quranhub.com/v1/ayah/" +
      encodeURIComponent(item.verseKey);

    const response =
      await fetch(url, {
        method:"GET",
        headers:{
          "Accept":"application/json"
        }
      });

    if(!response.ok){
      return item;
    }

    const json =
      await response.json();

    const ayah =
      json &&
      json.data
      ? json.data
      : null;

    if(!ayah){
      return item;
    }

    return {
      verseKey:item.verseKey,
      surahNumber:
        Number(
          ayah.surah &&
          ayah.surah.number
        ) || item.surahNumber,
      ayahNumber:
        Number(ayah.numberInSurah) ||
        item.ayahNumber,
      text:
        ayah.text ||
        item.text ||
        "",
      surahName:
        ayah.surah &&
        ayah.surah.name
        ? ayah.surah.name.replace(/^سورة\s*/,"")
        : item.surahName,
      page:
        Number(ayah.page) ||
        item.page ||
        0
    };

  }

  try{

    let matches =
      await searchQuranHub();

    if(!matches.length){

      searchResults.innerHTML =
        '<div class="search-status">' +
        'لم يتم العثور على نتائج للكلمة التي كتبتها.' +
        '</div>';

      return;

    }

    searchResults.innerHTML =
      '<div class="search-status">جاري تجهيز النتائج…</div>';

    const detailed =
      await Promise.all(
        matches
          .slice(0,20)
          .map(getAyahDetails)
      );

    searchResults.innerHTML = "";

    detailed.forEach(match=>{

      const pageNumber =
        Number(match.page);

      if(!pageNumber) return;

      addSearchResult(
        "سورة " +
        match.surahName,
        "الآية " +
        match.ayahNumber +
        " — الصفحة " +
        pageNumber,
        match.text || "",
        pageNumber
      );

    });

    if(!searchResults.children.length){

      searchResults.innerHTML =
        '<div class="search-status">' +
        'تم العثور على النتائج ولكن تعذر تحديد صفحاتها.' +
        '</div>';

    }

  }catch(error){

    searchResults.innerHTML =
      '<div class="search-status">' +
      'تعذر الاتصال بخدمة البحث حالياً. ' +
      'تأكد من اتصال الإنترنت ثم جرّب مرة أخرى.' +
      '</div>';

  }

}

searchForm.onsubmit = async e => {

  e.preventDefault();

  const query =
    searchInput.value.trim();

  if(!query){

    searchResults.innerHTML =
      '<div class="search-status">' +
      'اكتب كلمة أو اسم سورة أو رقم صفحة.' +
      '</div>';

    return;

  }

  const foundLocal =
    searchLocal(query);

  if(foundLocal){
    return;
  }

  await searchWord(query);

};

<script>
function populateDirectSurahSelector(){
  const select=document.getElementById("surahSelect");
  if(!select || typeof surahs==="undefined") return;
  select.innerHTML='<option value="">اختر السورة</option>';
  surahs.forEach((s,i)=>{
    const o=document.createElement("option");
    o.value=String(i+1);
    o.textContent=(i+1)+" - "+s[0];
    select.appendChild(o);
  });
}
function chooseDirectSurah(n){
  n=Number(n);
  if(!n || typeof surahs==="undefined") return;
  const s=surahs[n-1];
  if(!s) return;
  window.currentAudioSurah=n;
  if(typeof loadPage==="function")
    loadPage(Number(s[1]),{surahNumber:n,autoContinue:true});
}
document.addEventListener("DOMContentLoaded",()=>{
  populateDirectSurahSelector();
  const s=document.getElementById("surahSelect");
  if(s) s.addEventListener("change",()=>chooseDirectSurah(s.value));
});
</script>
