<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار آيات القرآن الكريم - تغيير لون الحروف</title>

<!-- مكتبة مستقلة للتجربة فقط، لا تغيّر ملف مشروعك الأصلي -->
<script src="https://unpkg.com/quran-madina-html@1.0.1"></script>

<style>
  html,body{
    margin:0;
    padding:0;
    background:#fff;
    font-family:Arial,sans-serif;
  }

  .top{
    position:sticky;
    top:0;
    z-index:20;
    background:#fff;
    border-bottom:1px solid #ddd;
    padding:10px;
    text-align:center;
  }

  .title{
    font-size:18px;
    font-weight:700;
    margin-bottom:8px;
  }

  .note{
    font-size:13px;
    color:#555;
    margin-bottom:8px;
  }

  button{
    border:0;
    border-radius:10px;
    padding:10px 14px;
    margin:3px;
    font-size:15px;
    cursor:pointer;
  }

  #ayahBtn{ background:#198754; color:#fff; }
  #wordBtn{ background:#0d6efd; color:#fff; }
  #offBtn{ background:#666; color:#fff; }

  .pageWrap{
    max-width:900px;
    margin:0 auto;
    padding:10px;
  }

  /*
    التجربة المهمة:
    نلغي خلفية التمييز، ونغيّر لون النص نفسه.
    إذا كانت المكتبة تضع الكلمات داخل عناصر highlight
    فسيصبح لون الحروف أخضر بدل أن يظهر مستطيل خلفها.
  */
  quran-madina-html{
    --qmh-highlight: transparent;
    --qmh-error: transparent;
    --test-word-color:#16833a;
    display:block;
    color:#111;
  }

  quran-madina-html .quran-madina-html-word-highlight{
    background:transparent !important;
    color:var(--test-word-color) !important;
    box-shadow:none !important;
  }

  quran-madina-html .quran-madina-html-word-error{
    background:transparent !important;
    color:#16833a !important;
    box-shadow:none !important;
  }

  .status{
    text-align:center;
    font-size:14px;
    margin:8px 0;
    color:#333;
  }
</style>
</head>

<body>
<div class="top">
  <div class="title">اختبار آمن — تغيير لون الحروف فقط</div>
  <div class="note">
    هذه صفحة تجريبية مستقلة. الصفحة المختبرة هي الصفحة 2 فقط، ولا يوجد أي تعديل على مشروعك الأصلي.
  </div>

  <button id="ayahBtn">تغيير لون الآية 1</button>
  <button id="wordBtn">تغيير لون الكلمة 1</button>
  <button id="offBtn">إلغاء اللون</button>

  <div id="status" class="status">الحالة: بدون تمييز</div>
</div>

<div class="pageWrap">
  <!-- صفحة 2 من مصحف المدينة -->
  <quran-madina-html id="mushaf" page="2" headless="true" data-font="Hafs"></quran-madina-html>
</div>

<script>
const mushaf = document.getElementById("mushaf");
const status = document.getElementById("status");

function setHighlight(value, label){
  mushaf.setAttribute("highlight", value);
  status.textContent = "الحالة: " + label;
}

document.getElementById("ayahBtn").onclick = () => {
  /*
    صفحة 2 تبدأ بالآية 1 من البقرة (الم).
    في هذا الاختبار نلوّن أول كلمة/وحدة من الآية فقط
    للتأكد أولاً أن المكتبة تغيّر لون الحروف نفسها.
  */
  setHighlight("1", "تجربة لون الآية — الوحدة الأولى");
};

document.getElementById("wordBtn").onclick = () => {
  setHighlight("1", "تجربة لون الكلمة — الكلمة الأولى");
};

document.getElementById("offBtn").onclick = () => {
  mushaf.removeAttribute("highlight");
  mushaf.removeAttribute("error");
  status.textContent = "الحالة: بدون تمييز";
};
</script>
</body>
</html>
