<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>القرآن الكريم</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717;font-family:Tahoma,Arial,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column;background:#eee7d8}
.reader{position:relative;flex:1;min-height:0;display:flex;justify-content:center;overflow:hidden}
.page-wrap{width:100%;max-width:900px;height:100%;overflow:auto;display:flex;align-items:flex-start;justify-content:center;touch-action:pan-y;background:#fff;scrollbar-width:none}
.page-wrap::-webkit-scrollbar{display:none}.page{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#666;background:#f8f5ed}
.menu-btn{position:absolute;top:12px;left:12px;z-index:20;width:46px;height:46px;border:0;border-radius:50%;background:#146b2f;color:#fff;font-size:25px;box-shadow:0 3px 12px #0005}
.audio{height:116px;background:#fff;border-top:1px solid #d8cbb0;box-shadow:0 -5px 18px #0002;padding:9px 12px;z-index:30}
.audio-top{display:flex;align-items:center;gap:9px}.reader-avatar{width:42px;height:42px;border-radius:50%;background:#146b2f;display:grid;place-items:center;color:#fff;font-size:20px}
.reader-info{min-width:0;flex:1}.reader-label{font-size:11px;color:#777}.reader-name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select{border:1px solid #cfc3a8;border-radius:9px;background:#fff;padding:8px;max-width:150px}.progress{display:flex;align-items:center;gap:7px;margin:6px 0}
progress{width:100%;height:5px;accent-color:#146b2f}.time{font-size:10px;color:#666;min-width:36px;text-align:center}
.controls{display:flex;justify-content:center;align-items:center;gap:7px}.controls button{border:0;background:#f0ecdf;color:#146b2f;width:39px;height:32px;border-radius:9px;font-size:14px}
.controls .play{background:#146b2f;color:#fff;width:45px;font-size:18px}
.overlay{position:fixed;inset:0;background:#0008;display:none;z-index:50}.overlay.show{display:block}
.menu-panel{position:fixed;top:0;left:0;width:min(320px,88vw);height:100dvh;background:#fff;transform:translateX(-105%);transition:.25s;padding:20px 14px;box-shadow:8px 0 25px #0004;z-index:60}
.menu-panel.open{transform:translateX(0)}.menu-panel h2{margin:5px 0 20px;text-align:center;color:#146b2f}
.menu-panel button{width:100%;border:0;background:#f3efe5;margin:4px 0;padding:13px;border-radius:10px;text-align:right;font-size:15px}
@media(max-width:600px){.audio{height:124px}.controls button{width:37px}.menu-btn{top:8px;left:8px}}
</style>
</head>
<body>
<div class="app">
<main class="reader">
<button class="menu-btn" id="menuBtn" aria-label="القائمة">☰</button>
<div class="page-wrap" id="pageWrap">
<div class="loading" id="loading">جاري تحميل صفحة المصحف...</div>
<img id="page" class="page" alt="صفحة المصحف" draggable="false" hidden>
</div>
</main>

<section class="audio" aria-label="التلاوة">
<div class="audio-top">
<div class="reader-avatar">🎙</div>
<div class="reader-info"><div class="reader-label">القارئ</div><div class="reader-name" id="readerName">اختر القارئ</div></div>
<select id="readerSelect" aria-label="اختيار القارئ">
<option value="">اختيار القارئ</option>
<option>عبد الباسط عبد الصمد</option>
<option>عبد الرحمن السديس</option>
<option>محمد صديق المنشاوي</option>
</select>
</div>
<div class="progress"><span class="time" id="currentTime">0:00</span><progress id="progress" value="0" max="100"></progress><span class="time" id="duration">0:00</span></div>
<div class="controls">
<button id="prevBtn">⏮</button><button id="backBtn">↶10</button><button class="play" id="playBtn">▶</button><button id="forwardBtn">10↷</button><button id="nextBtn">⏭</button>
</div>
</section>
</div>

<div class="overlay" id="overlay"></div>
<aside class="menu-panel" id="menuPanel">
<h2>القرآن الكريم</h2>
<button>📖 السور</button><button>📚 الأجزاء والأحزاب</button><button>🔎 البحث</button>
<button id="bookmark">🔖 حفظ العلامة المرجعية</button><button id="goBookmark">🕘 آخر قراءة / العلامة</button>
<button id="dark">🌙 الوضع الليلي</button><button id="closeMenu">✕ إغلاق</button>
</aside>
<audio id="audio"></audio>

<script>
const TOTAL_PAGES=604;let pageNo=Number(localStorage.getItem("quranPage")||1),startX=0,startY=0;
const page=document.getElementById("page"),wrap=document.getElementById("pageWrap"),loading=document.getElementById("loading");
const menu=document.getElementById("menuPanel"),overlay=document.getElementById("overlay"),audio=document.getElementById("audio");
const play=document.getElementById("playBtn"),progress=document.getElementById("progress"),currentTime=document.getElementById("currentTime"),duration=document.getElementById("duration");
function loadPage(n){pageNo=Math.max(1,Math.min(TOTAL_PAGES,n));localStorage.setItem("quranPage",pageNo);loading.hidden=false;page.hidden=true;page.onload=()=>{loading.hidden=true;page.hidden=false;wrap.scrollTop=0};page.onerror=()=>loading.textContent="تعذر تحميل الصفحة "+pageNo+" — تأكد من وجود 1.png إلى 604.png بجانب الملف.";page.src=pageNo+".png"}
function nextPage(){if(pageNo<TOTAL_PAGES)loadPage(pageNo+1)}function prevPage(){if(pageNo>1)loadPage(pageNo-1)}
wrap.addEventListener("touchstart",e=>{let t=e.touches[0];startX=t.clientX;startY=t.clientY},{passive:true});
wrap.addEventListener("touchend",e=>{let t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY;if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx))return;if(dx<0)prevPage();else nextPage()},{passive:true});
function openMenu(){menu.classList.add("open");overlay.classList.add("show")}function closeMenu(){menu.classList.remove("open");overlay.classList.remove("show")}
menuBtn.onclick=openMenu;closeMenuBtn=()=>closeMenu();document.getElementById("closeMenu").onclick=closeMenu;overlay.onclick=closeMenu;
document.getElementById("bookmark").onclick=()=>{localStorage.setItem("quranBookmark",pageNo);alert("تم حفظ الصفحة "+pageNo)};
document.getElementById("goBookmark").onclick=()=>{loadPage(Number(localStorage.getItem("quranBookmark")||1));closeMenu()};
document.getElementById("dark").onclick=()=>document.body.classList.toggle("dark");
function fmt(s){return Number.isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00"}
audio.addEventListener("loadedmetadata",()=>duration.textContent=fmt(audio.duration));
audio.addEventListener("timeupdate",()=>{currentTime.textContent=fmt(audio.currentTime);progress.value=audio.duration?audio.currentTime/audio.duration*100:0});
play.onclick=()=>{if(!audio.src){alert("اختر القارئ ثم اربط ملف التلاوة الصوتي.");return}if(audio.paused){audio.play();play.textContent="Ⅱ"}else{audio.pause();play.textContent="▶"}};
document.getElementById("backBtn").onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-10);
document.getElementById("forwardBtn").onclick=()=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+10);
document.getElementById("prevBtn").onclick=prevPage;document.getElementById("nextBtn").onclick=nextPage;
document.getElementById("readerSelect").onchange=e=>document.getElementById("readerName").textContent=e.target.value||"اختر القارئ";
loadPage(pageNo);
</script>
</body>
</html>
