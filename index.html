<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>آيات القرآن</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3e8;
      color: #26352f;
    }

    header {
      background: #ffffff;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #ddd6c7;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #777;
    }

    main {
      padding: 25px 15px;
      max-width: 700px;
      margin: auto;
    }

    .welcome {
      background: #ffffff;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .welcome h2 {
      margin-top: 0;
      font-size: 25px;
    }

    .welcome p {
      color: #777;
      line-height: 1.8;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 25px;
      background: #496b5b;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <header>
    <h1>آيات القرآن</h1>
    <p>المصحف الشريف</p>
  </header>

  <main>
    <section class="welcome">
      <h2>صفحات تتلوها بهدوء</h2>

      <p>
        مرحبًا بك في مشروع آيات القرآن.
        سنبني هنا مصحفًا إلكترونيًا بسيطًا وسهل الاستخدام.
      </p>

      <a href="#" class="button">ابدأ القراءة</a>
    </section>
  </main>

</body>
</html>
